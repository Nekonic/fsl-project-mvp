[project]
name = "fsl-project-mvp"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<7",
    "djangorestframework>=3.16,<4",
    "drf-spectacular>=0.28,<1",
    "PyYAML>=6,<7",
    "requests>=2.32,<3",
    "waitress>=3,<4",
]

[dependency-groups]
dev = [
    "openapi-python-client>=0.24,<1",
    "pytest>=8,<9",
    "pytest-django>=4.9,<5",
]
cloud = [
    "openstacksdk>=4",
    "python-openstackclient>=7",
    "python-heatclient>=4",
]

[tool.uv]
package = false
default-groups = ["dev", "cloud"]
