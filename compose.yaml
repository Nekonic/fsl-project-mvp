name: fsl

networks:
  edge:
    labels:
      fsl.segment.id: "ru"
      fsl.segment: "Internet"
      fsl.origin: "Russia"
    ipam:
      config:
        - subnet: 5.188.10.0/24

  edge-br:
    labels:
      fsl.segment.id: "br"
      fsl.segment: "Internet"
      fsl.origin: "Brazil"
    ipam:
      config:
        - subnet: 177.54.144.0/24

  edge-hk:
    labels:
      fsl.segment.id: "hk"
      fsl.segment: "Internet"
      fsl.origin: "Hong Kong"
    ipam:
      config:
        - subnet: 103.152.220.0/24

  edge-us:
    labels:
      fsl.segment.id: "us"
      fsl.segment: "Internet"
      fsl.origin: "United States"
    ipam:
      config:
        - subnet: 73.0.0.0/24

  mgmt:
    labels:
      fsl.segment.id: "mgmt"
      fsl.segment: "Management"
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  esdata:
  collectordata:
  platformdata:

services:
  elasticsearch:
    platform: linux/amd64
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: fsl-elasticsearch
    networks: [mgmt]
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - ./config/ingest-geoip:/usr/share/elasticsearch/config/ingest-geoip:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  collector:
    platform: linux/amd64
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: fsl-collector
    user: root
    depends_on:
      elasticsearch: {condition: service_healthy}
    networks: [mgmt]
    ports:
      - "${FSL_SYSLOG_PUBLISH:-127.0.0.1}:5140:5140/udp"
    command: ["--strict.perms=false", "-e"]
    volumes:
      - ./deploy/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - collectordata:/usr/share/filebeat/data

  kibana:
    platform: linux/amd64
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: fsl-kibana
    depends_on:
      elasticsearch: {condition: service_healthy}
    networks: [mgmt]
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      SERVER_BASEPATH: "/kibana"
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: "http://localhost:8000/kibana"
      TELEMETRY_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/kibana/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  platform:
    platform: linux/amd64
    build: ./platform
    image: ghcr.io/nekonic/fsl-platform:${FSL_IMAGE_TAG:-dev}
    container_name: fsl-platform
    depends_on:
      elasticsearch: {condition: service_healthy}
    networks:
      edge: {gw_priority: 1}
      edge-br: {}
      edge-hk: {}
      edge-us: {}
      mgmt: {}
    ports:
      - "${FSL_PUBLISH:-127.0.0.1}:8000:8000"
      - "${FSL_PUBLISH:-127.0.0.1}:8002:8002"
    environment:
      DJANGO_DEBUG: "1"
      ELASTIC_URL: "http://elasticsearch:9200"
      ELASTIC_INDEX: "fsl-logs-*"
      DJANGO_DB_PATH: "/data/db.sqlite3"
      TARGET_URL: "http://board.com"
      PUBLIC_TARGET_URL: "http://board.com"
      WARGAME_CASES_DIR: "/app/redteam/cases"
      FSL_SOURCE: "/src"
      FSL_IMAGE_TAG: "${FSL_IMAGE_TAG:-dev}"
      FSL_GNS3_URL: "http://gns3:3080"
      FSL_GNS3_AUDITOR_PASSWORD: "${FSL_GNS3_AUDITOR_PASSWORD:-fsl-auditor}"
      FSL_GNS3_ADMIN_PASSWORD: "${FSL_GNS3_ADMIN_PASSWORD:-}"
    env_file:
      - path: ./openstack.env
        required: false
        format: raw
    volumes:
      - ./platform:/app
      - ./redteam:/app/redteam:ro
      - ./deploy:/src/deploy:ro
      - ./wargames:/src/wargames:ro
      - ./session.yaml:/src/session.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/fsl-gns3:/run/fsl-gns3:ro
      - platformdata:/data

  gns3:
    platform: linux/amd64
    build: ./deploy/gns3
    image: ghcr.io/nekonic/fsl-gns3:${FSL_IMAGE_TAG:-dev}
    container_name: fsl-gns3
    networks: [mgmt]
    pid: host
    ports:
      - "${FSL_PUBLISH:-127.0.0.1}:3080:3080"
    environment:
      FSL_GNS3_ADMIN_PASSWORD: "${FSL_GNS3_ADMIN_PASSWORD:-}"
      FSL_GNS3_AUDITOR_PASSWORD: "${FSL_GNS3_AUDITOR_PASSWORD:-fsl-auditor}"
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/fsl-gns3:/var/lib/fsl-gns3
