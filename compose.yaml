name: fsl

networks:
  edge:
    labels:
      fsl.segment.id: "ru"
      fsl.segment: "Internet"
      fsl.origin: "Russia"
    ipam:
      config:
        - subnet: 5.188.10.0/24

  edge-br:
    labels:
      fsl.segment.id: "br"
      fsl.segment: "Internet"
      fsl.origin: "Brazil"
    ipam:
      config:
        - subnet: 177.54.144.0/24

  edge-hk:
    labels:
      fsl.segment.id: "hk"
      fsl.segment: "Internet"
      fsl.origin: "Hong Kong"
    ipam:
      config:
        - subnet: 103.152.220.0/24

  edge-us:
    labels:
      fsl.segment.id: "us"
      fsl.segment: "Internet"
      fsl.origin: "United States"
    ipam:
      config:
        - subnet: 73.0.0.0/24

  estate:
    labels:
      fsl.segment.id: "estate"
      fsl.segment: "Application estate"
    ipam:
      config:
        - subnet: 172.30.0.0/24

  mgmt:
    labels:
      fsl.segment.id: "mgmt"
      fsl.segment: "Management"
    ipam:
      config:
        - subnet: 172.31.0.0/24

include:
  - wargames/juice-shop/compose.yaml
  - wargames/board/compose.yaml

volumes:
  esdata:
  filebeatdata:
  platformdata:
  waflogs:

services:
  waf:
    platform: linux/amd64
    image: owasp/modsecurity-crs@sha256:941c045ca601c4eb5b77863832be7b1e226c27687554767e7bb3f3f8c2442d05
    container_name: fsl-waf
    depends_on:
      juice-shop: {condition: service_healthy}
    networks:
      edge:
        priority: 100
        aliases: [shop.com, board.com]
      edge-br:
        priority: 90
        aliases: [board.com]
      edge-hk:
        priority: 90
        aliases: [board.com]
      edge-us:
        priority: 90
        aliases: [board.com]
      estate:
        priority: 10
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    ports:
      - "127.0.0.1:8080:80"
    environment:
      BACKEND: "http://juice-shop:3000"
      PORT: "80"
      MODSEC_RULE_ENGINE: "DetectionOnly"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG_FORMAT: "JSON"
      MODSEC_AUDIT_LOG_TYPE: "Serial"
      MODSEC_AUDIT_LOG: "/var/log/modsecurity/audit/audit.log"
      MODSEC_AUDIT_LOG_PARTS: "ABIJDEFHZ"
      PARANOIA: "1"
      ANOMALY_INBOUND: "5"
    volumes:
      - ./deploy/nginx/allow-low-port.sh:/docker-entrypoint.d/01-check-low-port.sh:ro
      - waflogs:/var/log/modsecurity/audit
      - ./deploy/nginx/board.conf:/etc/nginx/conf.d/board.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  suricata:
    platform: linux/amd64
    image: jasonish/suricata@sha256:7ca2546f7f2735f621b981b6a5ec84fb962984636f7629a1a2fa6a324d4b6840
    container_name: fsl-suricata
    network_mode: "service:waf"
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    command: ["-c", "/etc/suricata/suricata.yaml", "--af-packet"]
    volumes:
      - ./deploy/suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./deploy/suricata/rules:/var/lib/suricata/rules
      - ./deploy/suricata/logs:/var/log/suricata

  elasticsearch:
    platform: linux/amd64
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: fsl-elasticsearch
    networks: [mgmt]
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  filebeat:
    platform: linux/amd64
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: fsl-filebeat
    user: root
    depends_on:
      elasticsearch: {condition: service_healthy}
    networks: [mgmt]
    command: ["--strict.perms=false", "-e"]
    volumes:
      - ./deploy/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./deploy/suricata/logs:/logs/suricata:ro
      - waflogs:/logs/modsecurity:ro
      - filebeatdata:/usr/share/filebeat/data

  kali:
    platform: linux/amd64
    build: ./deploy/kali
    container_name: fsl-kali
    networks: [edge]
    volumes:
      - ./data/label:/label:ro
    init: true
    environment:
      http_proxy: "http://proxy:8081"
      HTTP_PROXY: "http://proxy:8081"
      FSL_TARGET: "http://shop.com"
      FSL_TARGET_HOST: "shop.com"

  proxy:
    platform: linux/amd64
    build: ./deploy/proxy
    container_name: fsl-proxy
    networks: [edge, edge-br, edge-hk, edge-us]
    volumes:
      - ./data/label:/label

  platform:
    platform: linux/amd64
    build: ./platform
    container_name: fsl-platform
    depends_on:
      elasticsearch: {condition: service_healthy}
    networks: [edge, edge-br, edge-hk, edge-us, estate, mgmt]
    ports:
      - "${FSL_PUBLISH:-127.0.0.1}:8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      ELASTIC_URL: "http://elasticsearch:9200"
      ELASTIC_INDEX: "fsl-logs-*"
      DJANGO_DB_PATH: "/data/db.sqlite3"
      TARGET_URL: "http://shop.com"
      PUBLIC_TARGET_URL: "http://shop.com"
      WARGAME_CASES_DIR: "/app/redteam/cases"
      FSL_SOURCE: "/src"
    env_file:
      - path: ./openstack.env
        required: false
        format: raw
    volumes:
      - ./platform:/app
      - ./redteam:/app/redteam:ro
      - ./deploy/elastic:/app/deploy/elastic:ro
      - ./deploy:/src/deploy:ro
      - ./wargames:/src/wargames:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - platformdata:/data
