name: fsl

networks:
  fsl:
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  esdata:

services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: fsl-juice-shop
    networks: [fsl]
    healthcheck:
      # distroless 이미지라 셸도 wget 도 curl 도 없다. 유일한 바이너리인
      # node 를 절대 경로로 부른다 (PATH 에도 올라와 있지 않다).
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "require('http').get('http://localhost:3000/rest/admin/application-version',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: fsl-waf
    depends_on:
      juice-shop: {condition: service_healthy}
    networks: [fsl]
    ports:
      - "8080:8080"
    environment:
      BACKEND: "http://juice-shop:3000"
      PORT: "8080"
      MODSEC_RULE_ENGINE: "DetectionOnly"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG_FORMAT: "JSON"
      MODSEC_AUDIT_LOG_TYPE: "Serial"
      MODSEC_AUDIT_LOG: "/var/log/modsecurity/audit.log"
      MODSEC_AUDIT_LOG_PARTS: "ABIJDEFHZ"
      PARANOIA: "1"
      ANOMALY_INBOUND: "5"
    volumes:
      # 목적지가 아니라 템플릿 경로에 넣는다. 이미지가 envsubst 를 거쳐
      # /etc/modsecurity.d/ 로 복사하므로 목적지를 막으면 부팅이 실패한다.
      - ./deploy/nginx/modsecurity-overrides.conf:/etc/nginx/templates/modsecurity.d/modsecurity-override.conf.template:ro
      - ./deploy/nginx/logs:/var/log/modsecurity
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12

  suricata:
    image: jasonish/suricata:latest
    container_name: fsl-suricata
    depends_on:
      waf: {condition: service_started}
    # WAF 의 네트워크 네임스페이스에 들어가 그 eth0 를 스니핑한다.
    # host 모드는 Docker Desktop 에서 VM 네임스페이스에 붙어 동작이 갈린다.
    network_mode: "service:waf"
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    command: ["-c", "/etc/suricata/suricata.yaml", "-i", "eth0"]
    volumes:
      # 이미지 엔트리포인트가 /etc/suricata 를 chown 한다. :ro 면 부팅이 실패한다.
      - ./deploy/suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./deploy/suricata/rules:/var/lib/suricata/rules
      - ./deploy/suricata/logs:/var/log/suricata

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: fsl-elasticsearch
    networks: [fsl]
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: fsl-kibana
    depends_on:
      elasticsearch: {condition: service_healthy}
    networks: [fsl]
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: fsl-filebeat
    user: root
    depends_on:
      elasticsearch: {condition: service_healthy}
    networks: [fsl]
    command: ["--strict.perms=false", "-e"]
    volumes:
      - ./deploy/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./deploy/suricata/logs:/logs/suricata:ro
      - ./deploy/nginx/logs:/logs/modsecurity:ro

  # 레드팀 외부 도구. 일회성으로 `docker run` 되므로 up 에서는 뜨지 않는다.
  # 이미지를 만들기만 한다: docker compose --profile tools build
  redteam-tools:
    build: ./redteam
    image: fsl-redteam-tools
    profiles: ["tools"]
    networks: [fsl]
    command: ["sqlmap", "--version"]

  platform:
    build: ./platform
    container_name: fsl-platform
    depends_on:
      elasticsearch: {condition: service_healthy}
    networks: [fsl]
    ports:
      - "8000:8000"
    environment:
      ELASTIC_URL: "http://elasticsearch:9200"
      ELASTIC_INDEX: "fsl-logs-*"
      SURICATA_CONTAINER: "fsl-suricata"
      SURICATA_RULE_PATH: "/rules/local.rules"
      SURICATA_CANDIDATE_PATH: "/rules/candidate.rules"
      SURICATA_RULE_PATH_IN_IDS: "/var/lib/suricata/rules/local.rules"
      SURICATA_CANDIDATE_PATH_IN_IDS: "/var/lib/suricata/rules/candidate.rules"
      DJANGO_DB_PATH: "/data/db.sqlite3"
    volumes:
      - ./platform:/app
      - ./deploy/suricata/rules:/rules
      # 룰 검증·리로드를 IDS 컨테이너 안에서 실행하기 위한 소켓.
      # 컨테이너 탈출 경로다. 메인 레포에서는 사이드카로 교체한다.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
