name: cr

networks:
  mgmt:
    ipam:
      config:
        - subnet: 172.31.0.0/24
  store:
    internal: true

volumes:
  esdata:
  collectordata:
  platformdata:
  storedata:

secrets:
  openstack_password:
    file: ./openstack-password
  bots_launcher_key:
    file: ./bots-launcher-key
  claude_oauth_token:
    file: ./claude-oauth-token
  store_password:
    file: ./store-password

services:
  postgres:
    platform: linux/amd64
    image: postgres:18.4
    container_name: cr-postgres
    networks: [store]
    environment:
      POSTGRES_USER: cr
      POSTGRES_DB: cr
      POSTGRES_PASSWORD_FILE: /run/secrets/store_password
    secrets: [store_password]
    volumes:
      - storedata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U cr -d cr"]
      interval: 5s
      timeout: 5s
      retries: 30

  elasticsearch:
    platform: linux/amd64
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: cr-elasticsearch
    networks: [mgmt]
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - ./deploy/elastic/ingest-geoip:/usr/share/elasticsearch/config/ingest-geoip:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  collector:
    platform: linux/amd64
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: cr-collector
    user: root
    depends_on:
      elasticsearch: {condition: service_healthy}
    networks: [mgmt]
    ports:
      - "${CR_SYSLOG_PUBLISH:-127.0.0.1}:5140:5140/udp"
    entrypoint:
      - /usr/bin/tini
      - --
      - sh
      - -c
      - >-
        awk '/^- key: /{kept = ($$3 ~ /^(ecs|beat|cloud|docker|host|kubernetes|process|log)$$/)} kept'
        fields.yml > data/fields-lean.yml && exec /usr/local/bin/docker-entrypoint "$$@"
      - collector
    command: ["--strict.perms=false", "-e"]
    volumes:
      - ./deploy/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - collectordata:/usr/share/filebeat/data

  kibana:
    platform: linux/amd64
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: cr-kibana
    depends_on:
      elasticsearch: {condition: service_healthy}
    networks: [mgmt]
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      SERVER_NAME: kibana
      SERVER_BASEPATH: "/kibana"
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: "http://localhost:8000/kibana"
      TELEMETRY_ENABLED: "false"
      DATA_SEARCH_SESSIONS_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/kibana/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  platform:
    platform: linux/amd64
    build: {context: ., dockerfile: platform/Dockerfile}
    image: ghcr.io/nekonic/cr-platform:${CR_IMAGE_TAG:-dev}
    container_name: cr-platform
    depends_on:
      elasticsearch: {condition: service_healthy}
      postgres: {condition: service_healthy}
    networks:
      mgmt: {}
      store: {}
    ports:
      - "${CR_PUBLISH:-127.0.0.1}:8000:8000"
      - "${CR_PUBLISH:-127.0.0.1}:2222:2222"
      - "${CR_PUBLISH:-127.0.0.1}:51820-51919:51820-51919/udp"
    environment: &platform-environment
      ELASTIC_URL: "http://elasticsearch:9200"
      ELASTIC_INDEX: "logs-*"
      KIBANA_URL: "http://kibana:5601/kibana"
      CR_DB_HOST: "postgres"
      CR_REFILL_DIR: "/data/refill"
      CR_PROBES_OUT: "/data/probes"
      CR_JUMP_DIR: "/data/jump"
      CR_VPN_DIR: "/data/vpn"
      CR_SOURCE: "/src"
      CR_RETAIN_CLOSED_MINUTES: "${CR_RETAIN_CLOSED_MINUTES:-60}"
      CR_ALLOCATION_IDLE_MINUTES: "${CR_ALLOCATION_IDLE_MINUTES:-30}"
      CR_READ_IN_BACKGROUND: "1"
      CR_BOT_ROUND_USERS: "${CR_BOT_ROUND_USERS:-}"
    env_file: &platform-env-file
      - path: ./openstack.env
        required: false
        format: raw
    secrets: [openstack_password, bots_launcher_key, store_password]
    volumes: &platform-volumes
      - ./platform:/app
      - ./deploy:/src/deploy:ro
      - ./wargames:/src/wargames:ro
      - ./cases:/src/cases:ro
      - platformdata:/data

  refill:
    platform: linux/amd64
    image: ghcr.io/nekonic/cr-platform:${CR_IMAGE_TAG:-dev}
    container_name: cr-refill
    depends_on:
      platform: {condition: service_started}
      postgres: {condition: service_healthy}
    networks:
      mgmt: {}
      store: {}
    entrypoint: ["gosu", "cr", "python", "manage.py", "refill_slots"]
    environment:
      <<: *platform-environment
      CR_REFILL_EVERY_SECONDS: "${CR_REFILL_EVERY_SECONDS:-5}"
    env_file: *platform-env-file
    secrets: [openstack_password, store_password]
    volumes: *platform-volumes

  bots:
    platform: linux/amd64
    build: {context: ., dockerfile: bots/Dockerfile}
    image: ghcr.io/nekonic/cr-bots:${CR_IMAGE_TAG:-dev}
    container_name: cr-bots
    depends_on:
      platform: {condition: service_started}
    networks:
      mgmt: {}
    environment:
      CR_PLATFORM_URL: "http://platform:8000"
      CR_BOT_RUNS_MAX: "${CR_BOT_RUNS_MAX:-2}"
    secrets: [bots_launcher_key, claude_oauth_token]
