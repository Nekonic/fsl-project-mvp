components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        approved:
          type: boolean
        is_staff:
          type: boolean
        joined:
          type: string
          format: date-time
      required:
      - approved
      - id
      - is_staff
      - joined
      - username
    Alert:
      type: object
      properties:
        id:
          type: integer
        time:
          type: string
          format: date-time
        engine:
          type: string
        rule:
          type: string
        signature:
          type: string
        src_ip:
          type: string
          nullable: true
        request_id:
          type: string
          nullable: true
        uri:
          type: string
        blocked:
          type: boolean
      required:
      - blocked
      - engine
      - id
      - request_id
      - rule
      - signature
      - src_ip
      - time
      - uri
    Alerts:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        next:
          type: integer
      required:
      - alerts
      - next
    AppliedVersion:
      type: object
      properties:
        version:
          type: integer
        applied_at:
          type: string
          format: date-time
        tested:
          type: integer
          nullable: true
        same_as_tested:
          type: boolean
      required:
      - applied_at
      - same_as_tested
      - tested
      - version
    AttackBrief:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        body:
          type: string
      required:
      - body
      - summary
      - title
    AttackOrigin:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        ip:
          type: string
      required:
      - id
      - ip
      - label
    AttackState:
      type: object
      properties:
        round:
          type: integer
        matchup:
          type: string
        phase:
          type: string
        started:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        end_reason:
          type: string
        brief:
          $ref: '#/components/schemas/AttackBrief'
        target:
          $ref: '#/components/schemas/AttackTarget'
        objectives:
          type: array
          items:
            $ref: '#/components/schemas/ObjectiveLine'
        origins:
          type: array
          items:
            $ref: '#/components/schemas/OriginLine'
        hp:
          $ref: '#/components/schemas/HpBlock'
      required:
      - brief
      - end_reason
      - ends_at
      - hp
      - matchup
      - objectives
      - origins
      - phase
      - round
      - started
      - target
    AttackTarget:
      type: object
      properties:
        public_url:
          type: string
        hosts:
          type: array
          items:
            type: string
      required:
      - hosts
      - public_url
    AttackTerminal:
      type: object
      properties:
        ws_url:
          type: string
        ssh:
          $ref: '#/components/schemas/Ssh'
        hp:
          $ref: '#/components/schemas/HpBlock'
      required:
      - hp
      - ssh
      - ws_url
