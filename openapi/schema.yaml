components:
  schemas:
    Account:
      type: object
      properties:
        username:
          type: string
        approved:
          type: boolean
        is_staff:
          type: boolean
        joined:
          type: string
          format: date-time
      required:
      - approved
      - is_staff
      - joined
      - username
    Alert:
      type: object
      properties:
        id:
          type: integer
        time:
          type: string
          format: date-time
        engine:
          type: string
        rule:
          type: string
        signature:
          type: string
        src_ip:
          type: string
          nullable: true
        request_id:
          type: string
          nullable: true
        uri:
          type: string
        blocked:
          type: boolean
      required:
      - blocked
      - engine
      - id
      - request_id
      - rule
      - signature
      - src_ip
      - time
      - uri
    Alerts:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        next:
          type: integer
      required:
      - alerts
      - next
    AllocationDetail:
      type: object
      properties:
        allocation:
          type: integer
        wargame:
          type: string
        slot:
          type: integer
          nullable: true
        ready:
          type: boolean
        expires_at:
          type: string
          format: date-time
        closed:
          type: string
          format: date-time
          nullable: true
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/RoundLine'
      required:
      - allocation
      - closed
      - expires_at
      - ready
      - rounds
      - slot
      - wargame
    AllocationShown:
      type: object
      properties:
        allocation:
          type: integer
        wargame:
          type: string
        slot:
          type: integer
          nullable: true
        ready:
          type: boolean
        expires_at:
          type: string
          format: date-time
        closed:
          type: string
          format: date-time
          nullable: true
      required:
      - allocation
      - closed
      - expires_at
      - ready
      - slot
      - wargame
    AllowanceLine:
      type: object
      properties:
        operations:
          type: array
          items:
            type: string
        cases:
          type: array
          items:
            type: string
      required:
      - cases
      - operations
    AnalystSsh:
      type: object
      properties:
        host:
          type: string
        port:
          type: integer
        user:
          type: string
        private_key:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        target_host:
          type: string
        target_user:
          type: string
      required:
      - expires_at
      - host
      - port
      - private_key
      - target_host
      - target_user
      - user
    AppliedVersion:
      type: object
      properties:
        version:
          type: integer
        applied_at:
          type: string
          format: date-time
        tested:
          type: integer
          nullable: true
        same_as_tested:
          type: boolean
        sha:
          type: string
        source:
          $ref: '#/components/schemas/SourceEnum'
      required:
      - applied_at
      - same_as_tested
      - sha
      - source
      - tested
      - version
    AttackBrief:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        body:
          type: string
      required:
      - body
      - summary
      - title
    AttackOrigin:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        ip:
          type: string
      required:
      - id
      - ip
      - label
    AttackState:
      type: object
      properties:
        round:
          type: integer
        matchup:
          type: string
        phase:
          type: string
        started:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        end_reason:
          type: string
        brief:
          $ref: '#/components/schemas/AttackBrief'
        target:
          $ref: '#/components/schemas/AttackTarget'
        objectives:
          type: array
          items:
            $ref: '#/components/schemas/ObjectiveLine'
        origins:
          type: array
          items:
            $ref: '#/components/schemas/OriginLine'
        remaining:
          $ref: '#/components/schemas/Remaining'
      required:
      - brief
      - end_reason
      - ends_at
      - matchup
      - objectives
      - origins
      - phase
      - remaining
      - round
      - started
      - target
    AttackTarget:
      type: object
      properties:
        public_url:
          type: string
        hosts:
          type: array
          items:
            type: string
      required:
      - hosts
      - public_url
    AttackTerminal:
      type: object
      properties:
        ws_url:
          type: string
        ssh:
          $ref: '#/components/schemas/Ssh'
        remaining:
          $ref: '#/components/schemas/Remaining'
      required:
      - remaining
      - ssh
      - ws_url
    BaselineAskRequest:
      type: object
      properties:
        human_side:
          $ref: '#/components/schemas/PlayerSideEnum'
        step:
          type: string
          minLength: 1
          maxLength: 16
        rounds:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
      required:
      - human_side
      - step
    BaselineLine:
      type: object
      properties:
        baseline:
          type: integer
        human_side:
          $ref: '#/components/schemas/PlayerSideEnum'
        step:
          type: string
        status:
          $ref: '#/components/schemas/BaselineStatusEnum'
        profile_key:
          type: string
        counted:
          type: integer
        wanted:
          type: integer
        attempted:
          type: integer
        attempts_max:
          type: integer
        exits:
          type: object
          additionalProperties:
            type: integer
        spread:
          $ref: '#/components/schemas/SpreadLine'
      required:
      - attempted
      - attempts_max
      - baseline
      - counted
      - exits
      - human_side
      - profile_key
      - spread
      - status
      - step
      - wanted
    BaselineStatusEnum:
      enum:
      - running
      - current
      - stale
      - failed
      type: string
      description: |-
        * `running` - running
        * `current` - current
        * `stale` - stale
        * `failed` - failed
    Block:
      type: object
      properties:
        id:
          type: integer
        kind:
          $ref: '#/components/schemas/BlockKindEnum'
        value:
          type: string
        username:
          type: string
        reason:
          type: string
        failures:
          type: integer
        created:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
      required:
      - created
      - failures
      - id
      - kind
      - reason
      - until
      - username
      - value
    BlockKindEnum:
      enum:
      - address
      - fingerprint
      type: string
      description: |-
        * `address` - address
        * `fingerprint` - fingerprint
    BotAskRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        step:
          type: string
          minLength: 1
          maxLength: 16
    BotRunStatusEnum:
      enum:
      - queued
      - running
      - finished
      - failed
      type: string
      description: |-
        * `queued` - queued
        * `running` - running
        * `finished` - finished
        * `failed` - failed
    CardShown:
      type: object
      properties:
        id:
          type: string
        technique:
          type: string
        name:
          type: string
        quote:
          type: string
        url:
          type: string
        object_version:
          type: string
        release:
          type: string
        notice:
          type: string
      required:
      - id
      - name
      - notice
      - object_version
      - quote
      - release
      - technique
      - url
    CaseEntry:
      type: object
      properties:
        case:
          type: string
        kind:
          $ref: '#/components/schemas/CaseEntryKindEnum'
        malicious:
          type: boolean
        title:
          type: string
      required:
      - case
      - kind
      - malicious
      - title
    CaseEntryKindEnum:
      enum:
      - http
      - tool
      type: string
      description: |-
        * `http` - http
        * `tool` - tool
    CaseLine:
      type: object
      properties:
        case:
          type: string
        verdict:
          $ref: '#/components/schemas/VerdictEnum'
        alerts:
          type: integer
        corroborated:
          type: boolean
          nullable: true
      required:
      - alerts
      - case
      - corroborated
      - verdict
    CaseVerdict:
      type: object
      properties:
        case:
          type: string
        malicious:
          type: boolean
        verdict:
          $ref: '#/components/schemas/VerdictEnum'
        corroborated:
          type: boolean
          nullable: true
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/ProbeAlert'
        recorded_run:
          type: boolean
      required:
      - alerts
      - case
      - corroborated
      - malicious
      - recorded_run
      - verdict
    Change:
      type: object
      properties:
        case:
          type: string
        was:
          $ref: '#/components/schemas/VerdictEnum'
        now:
          $ref: '#/components/schemas/VerdictEnum'
      required:
      - case
      - now
      - was
    ClaimAskRequest:
      type: object
      properties:
        restarted:
          type: boolean
          default: false
        launcher:
          type: object
          additionalProperties: {}
    Claimed:
      type: object
      properties:
        run:
          type: integer
        round:
          type: integer
        side:
          $ref: '#/components/schemas/PlayerSideEnum'
        step:
          type: string
        token:
          type: string
        model:
          type: string
        budget_usd:
          type: number
          format: double
        max_turns:
          type: integer
        pace:
          $ref: '#/components/schemas/PaceLine'
        allowance:
          $ref: '#/components/schemas/AllowanceLine'
        card:
          allOf:
          - $ref: '#/components/schemas/StanceShown'
          nullable: true
        prompt:
          $ref: '#/components/schemas/PromptParts'
      required:
      - allowance
      - budget_usd
      - card
      - max_turns
      - model
      - pace
      - prompt
      - round
      - run
      - side
      - step
      - token
    Closed:
      type: object
      properties:
        closed:
          type: string
          format: date-time
      required:
      - closed
    CreateRoundRequest:
      type: object
      properties:
        problem:
          type: integer
        matchup:
          $ref: '#/components/schemas/MatchupEnum'
        players:
          $ref: '#/components/schemas/PlayersAskRequest'
      required:
      - matchup
      - players
      - problem
    Created:
      type: object
      properties:
        round:
          type: integer
        players:
          type: array
          items:
            $ref: '#/components/schemas/PlayerLine'
        bot_tokens:
          type: object
          additionalProperties:
            type: string
      required:
      - bot_tokens
      - players
      - round
    CredentialsRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          minLength: 1
          maxLength: 4096
      required:
      - password
      - username
    CsrfIssued:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
    Debrief:
      type: object
      properties:
        round:
          type: integer
        matchup:
          type: string
        pending:
          type: boolean
        steps:
          type: object
          additionalProperties:
            type: string
            nullable: true
        card:
          allOf:
          - $ref: '#/components/schemas/CardShown'
          nullable: true
        bots:
          type: array
          items: {}
        objectives:
          type: array
          items: {}
        timeline:
          type: array
          items: {}
        score: {}
      required:
      - bots
      - card
      - matchup
      - objectives
      - pending
      - round
      - score
      - steps
      - timeline
    DefenceBrief:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        body:
          type: string
      required:
      - body
      - summary
      - title
    DefenceState:
      type: object
      properties:
        round:
          type: integer
        matchup:
          type: string
        phase:
          type: string
        started:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        end_reason:
          type: string
        brief:
          $ref: '#/components/schemas/DefenceBrief'
        target:
          $ref: '#/components/schemas/DefenceTarget'
        objectives:
          type: array
          items:
            $ref: '#/components/schemas/ObjectiveState'
        ids:
          $ref: '#/components/schemas/Version'
        waf:
          $ref: '#/components/schemas/Version'
        alerts_total:
          type: integer
      required:
      - alerts_total
      - brief
      - end_reason
      - ends_at
      - ids
      - matchup
      - objectives
      - phase
      - round
      - started
      - target
      - waf
    DefenceTarget:
      type: object
      properties:
        public_url:
          type: string
        hosts:
          type: array
          items:
            type: string
      required:
      - hosts
      - public_url
    DefenceTerminal:
      type: object
      properties:
        ws_url:
          type: string
        ssh:
          $ref: '#/components/schemas/AnalystSsh'
      required:
      - ssh
      - ws_url
    Document:
      type: object
      properties:
        problem:
          $ref: '#/components/schemas/ProblemFields'
        round:
          allOf:
          - $ref: '#/components/schemas/RoundSetup'
          nullable: true
        start_posture:
          allOf:
          - $ref: '#/components/schemas/InlinePosture'
          nullable: true
      required:
      - problem
    DocumentRequest:
      type: object
      properties:
        problem:
          $ref: '#/components/schemas/ProblemFieldsRequest'
        round:
          allOf:
          - $ref: '#/components/schemas/RoundSetupRequest'
          nullable: true
        start_posture:
          allOf:
          - $ref: '#/components/schemas/InlinePostureRequest'
          nullable: true
      required:
      - problem
    Ended:
      type: object
      properties:
        ended:
          type: string
          format: date-time
        reason:
          $ref: '#/components/schemas/EndedReasonEnum'
      required:
      - ended
      - reason
    EndedReasonEnum:
      enum:
      - time_limit
      - all_objectives_lost
      - origins_spent
      - ended_by_operator
      - forfeit_attack
      - forfeit_defence
      - allocation_expired
      - bots_exited
      type: string
      description: |-
        * `time_limit` - time_limit
        * `all_objectives_lost` - all_objectives_lost
        * `origins_spent` - origins_spent
        * `ended_by_operator` - ended_by_operator
        * `forfeit_attack` - forfeit_attack
        * `forfeit_defence` - forfeit_defence
        * `allocation_expired` - allocation_expired
        * `bots_exited` - bots_exited
    Event:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
        at:
          type: string
          format: date-time
        player_side:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PlayerSideEnum'
          - $ref: '#/components/schemas/NullEnum'
        body:
          type: object
          additionalProperties: {}
      required:
      - at
      - body
      - id
      - kind
      - player_side
    Expiry:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
