      type: object
      properties:
        exit:
          type: string
          minLength: 1
          maxLength: 32
        cost_usd:
          type: number
          format: double
          nullable: true
        turns:
          type: integer
          minimum: 0
          nullable: true
        refusals:
          type: integer
          minimum: 0
          default: 0
        closing:
