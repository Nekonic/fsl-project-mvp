%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: "[5.188.10.0/24,177.54.144.0/24,103.152.220.0/24,175.45.176.0/24,172.30.0.0/24,172.31.0.0/24]"
    EXTERNAL_NET: "any"
  port-groups:
    HTTP_PORTS: "[80,3000]"

default-log-dir: /var/log/suricata/

unix-command:
  enabled: yes

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - http:
            extended: yes
            dump-all-headers: request

af-packet:
  - interface: eth0
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
  - interface: eth1
    cluster-id: 98
    cluster-type: cluster_flow
    defrag: yes
  - interface: eth2
    cluster-id: 97
    cluster-type: cluster_flow
    defrag: yes
  - interface: eth3
    cluster-id: 96
    cluster-type: cluster_flow
    defrag: yes
  - interface: eth4
    cluster-id: 95
    cluster-type: cluster_flow
    defrag: yes

app-layer:
  protocols:
    http:
      enabled: yes

default-rule-path: /var/lib/suricata/rules
rule-files:
  - local.rules

logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes

detect:
  guess-applayer-tx: yes
