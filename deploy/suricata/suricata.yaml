%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: "[172.20.0.0/16]"
    EXTERNAL_NET: "any"
  port-groups:
    HTTP_PORTS: "8080"

default-log-dir: /var/log/suricata/

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            payload: no
            http: yes
            metadata: yes
        - http:
            extended: yes
            # Ground truth correlation hangs on this one line. Without it
            # the marker is logged nowhere and every attack counts as missed.
            #
            # custom: [X-FSL-Case] had no effect on Suricata 8.0.7 - verified
            # against the real stack. dump-all-headers does work.
            dump-all-headers: request

af-packet:
  - interface: eth0
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes

app-layer:
  protocols:
    http:
      enabled: yes

default-rule-path: /var/lib/suricata/rules
rule-files:
  - local.rules

logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes
