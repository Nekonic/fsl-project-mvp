# 이 파일은 CRS 이미지의 템플릿 경로로 마운트된다. 이미지가 부팅할 때
# envsubst 를 거쳐 /etc/modsecurity.d/modsecurity-override.conf 로 복사하므로
# 목적지에 직접 마운트하면 부팅이 실패한다.
#
# SecRuleEngine / SecAuditEngine / SecAuditLog* 는 compose 의 MODSEC_* 환경변수가
# 만든다. 여기에는 환경변수로 표현할 수 없는 룰 수준 조정만 둔다.

# 마커 헤더를 CRS 가 이상 헤더로 보지 않도록 한다. 오탐 채점의 기준선이
# 우리가 심은 헤더 때문에 흔들리면 안 된다.
SecRuleUpdateTargetById 920273 "!REQUEST_HEADERS:X-FSL-Case"
