# Mounted at the CRS image's TEMPLATE path. On boot the image runs envsubst
# and copies the result to /etc/modsecurity.d/modsecurity-override.conf, so
# mounting over the destination makes the container fail to start.
#
# SecRuleEngine / SecAuditEngine / SecAuditLog* come from the MODSEC_*
# environment variables in compose. Only rule-level tweaks that no environment
# variable can express belong here.

# Keep CRS from treating our marker as an anomalous header. The false-positive
# baseline must not move because of a header we planted ourselves.
SecRuleUpdateTargetById 920273 "!REQUEST_HEADERS:X-FSL-Case"
