modsecurity on;
modsecurity_rules_file /etc/nginx/modsecurity/modsecurity.conf;
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $status $refused {
    400 true;
    403 true;
    default false;
}

map $http_x_request_id $logged_marker {
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
    default "";
}

log_format access escape=json '{"time":"$time_iso8601","client_ip":"$remote_addr","vhost":"$host","request":"$request","status":$status,"refused":$refused,"request_id":"$logged_marker"}';
access_log /var/log/nginx/access.json access;
error_log /var/log/nginx/error.log warn;

include /etc/nginx/defence/http.conf;

server {
    listen 80 default_server;
    server_name board.com;
    include /etc/nginx/defence/board.com.conf;

    location = /healthz {
        access_log off;
        return 200 "OK";
    }

    location /internal/ {
        proxy_pass http://board:8000/not-found/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location / {
        client_max_body_size 0;
        proxy_pass http://board:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}

server {
    listen 80;
    server_name corp.com;
    include /etc/nginx/defence/corp.com.conf;

    location /internal/ {
        return 404;
    }

    location / {
        client_max_body_size 0;
        proxy_pass http://corp-wp:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
