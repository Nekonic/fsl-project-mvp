module(load="imtcp")
module(load="imfile")
input(type="imtcp" address="@log_server@" port="514" ruleset="relayed")
input(type="imfile" File="/var/log/suricata/eve.json" Tag="suricata" Facility="local2" Severity="info" reopenOnTruncate="on" freshStartTail="on" ruleset="sensed")
template(name="waf-modsecurity" type="string" string="<%PRI%>1 %TIMESTAMP:::date-rfc3339% waf-@slot@ modsecurity %PROCID% %MSGID% %STRUCTURED-DATA% %msg%\n")
template(name="waf-nginx" type="string" string="<%PRI%>1 %TIMESTAMP:::date-rfc3339% waf-@slot@ nginx %PROCID% %MSGID% %STRUCTURED-DATA% %msg%\n")
template(name="infra-suricata" type="string" string="<%PRI%>1 %TIMESTAMP:::date-rfc3339% infra-@slot@ suricata %PROCID% %MSGID% %STRUCTURED-DATA% %msg%\n")
ruleset(name="relayed") {
    if $programname == "modsecurity" then {
        action(type="omfwd" Target="@collector@" Port="5140" Protocol="udp" Template="waf-modsecurity")
        stop
    }
    if $programname == "nginx" then {
        action(type="omfwd" Target="@collector@" Port="5140" Protocol="udp" Template="waf-nginx")
        stop
    }
    stop
}
ruleset(name="sensed") {
    action(type="omfwd" Target="@collector@" Port="5140" Protocol="udp" Template="infra-suricata")
    stop
}
