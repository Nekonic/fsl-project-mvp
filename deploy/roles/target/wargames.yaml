fronts:
  board: 8000
  corp-wp: 80

contained:
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: "no"

healthcheck:
  interval: 60s

extra_hosts:
  corp-wp: ["corp.com:127.0.0.1"]

limits:
  board:
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    mem_limit: 512m
    pids_limit: 256
  board-db:
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    mem_limit: 768m
    pids_limit: 256
  corp-wp:
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE]
    mem_limit: 768m
    pids_limit: 256
  corp-db:
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    mem_limit: 768m
    pids_limit: 256
