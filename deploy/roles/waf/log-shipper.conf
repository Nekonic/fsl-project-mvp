module(load="imfile")
input(type="imfile" File="/var/log/modsecurity/audit/audit.log" Tag="modsecurity" Facility="local2" Severity="info" reopenOnTruncate="on" freshStartTail="on" ruleset="waf-logs")
input(type="imfile" File="/var/log/nginx/access.json" Tag="nginx-access" Facility="local2" Severity="info" reopenOnTruncate="on" freshStartTail="on" ruleset="waf-logs")
ruleset(name="waf-logs") {
    action(type="omfwd" Target="@log_server@" Port="514" Protocol="tcp" Template="RSYSLOG_SyslogProtocol23Format" action.resumeRetryCount="-1")
    stop
}
