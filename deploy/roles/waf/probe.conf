load_module /usr/lib/nginx/modules/ngx_http_modsecurity_module.so;
user www-data;
worker_processes 1;
pid @prefix@/run/nginx.pid;
error_log @prefix@/logs/error.log;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path @prefix@/run/client_body;
    proxy_temp_path @prefix@/run/proxy;
    fastcgi_temp_path @prefix@/run/fastcgi;
    uwsgi_temp_path @prefix@/run/uwsgi;
    scgi_temp_path @prefix@/run/scgi;

    modsecurity on;
    modsecurity_rules_file @prefix@/modsecurity/modsecurity.conf;

    server {
        listen 127.0.0.1:@port@ default_server;
        server_name _;

        location / {
            client_max_body_size 16m;
            client_body_buffer_size 16m;
            proxy_max_temp_file_size 0;
            proxy_pass http://127.0.0.1:@upstream_port@;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }
    }
}
