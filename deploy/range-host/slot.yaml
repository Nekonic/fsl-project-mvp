name: s@slot@

x-contained: &contained
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: "no"

x-sensor: &sensor
  image: jasonish/suricata@sha256:7ca2546f7f2735f621b981b6a5ec84fb962984636f7629a1a2fa6a324d4b6840
  cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
  security_opt: ["no-new-privileges:true"]
  restart: "no"
  mem_limit: 768m
  pids_limit: 256
  environment:
    PGID: "4"
  healthcheck:
    test: ["CMD", "suricatasc", "-c", "uptime"]
    interval: 60s
    timeout: 5s
    retries: 24
    start_interval: 1s
    start_period: 60s

x-rsyslog: &rsyslog
  <<: *contained
  image: rsyslog/rsyslog-minimal@sha256:1b2cd946cc590e38ffa189f6a01e38d49029dff92aabd8cb09968ef4a1063d1b
  user: "0:4"
  entrypoint: ["rsyslogd", "-n", "-f", "/etc/rsyslog.conf", "-i", "/tmp/rsyslogd.pid"]
  mem_limit: 64m
  pids_limit: 32

x-wargames:
  healthcheck:
    interval: 60s
  fronts:
    board: 59
    corp-wp: 60
  extra_hosts:
    corp-wp: ["corp.com:127.0.0.1"]
  limits:
    board:
      cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
      mem_limit: 512m
      pids_limit: 256
    board-db:
      cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
      mem_limit: 768m
      pids_limit: 256
    corp-wp:
      cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE]
      mem_limit: 768m
      pids_limit: 256
    corp-db:
      cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
      mem_limit: 768m
      pids_limit: 256

services:
  kali:
    <<: *contained
    image: ghcr.io/nekonic/cr-kali:${CR_IMAGE_TAG:-dev}
    build: {context: .., dockerfile: kali/Dockerfile}
    container_name: s@slot@-kali
    hostname: kali
    cap_add: [NET_RAW, NET_ADMIN, SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL, AUDIT_WRITE]
    mem_limit: 1g
    pids_limit: 512
    networks:
      internet:
        ipv4_address: "172.30.@slot@.10"
    extra_hosts:
      - "board.com:@estate@.247"
      - "corp.com:@estate@.247"

  edge:
    <<: *contained
    image: ghcr.io/nekonic/cr-edge:${CR_IMAGE_TAG:-dev}
    build: ../edge
    container_name: s@slot@-edge
    hostname: edge
    cap_add: [NET_ADMIN]
    mem_limit: 64m
    pids_limit: 32
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    networks:
      internet:
        ipv4_address: "172.30.@slot@.1"
        interface_name: wan
      estate:
        ipv4_address: "@estate@.1"
        interface_name: lan

  waf:
    <<: *contained
    image: ghcr.io/nekonic/cr-waf:${CR_IMAGE_TAG:-dev}
    build: {context: .., dockerfile: waf/Dockerfile}
    container_name: s@slot@-waf
    hostname: waf
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    mem_limit: 512m
    pids_limit: 256
    networks:
      estate:
        ipv4_address: "@estate@.247"
      web:
        ipv4_address: "@web@.247"
    extra_hosts:
      - "board:@web@.59"
      - "corp-wp:@web@.60"
    volumes:
      - /var/log/cr/s@slot@/waf/audit.log:/var/log/modsecurity/audit/audit.log

  edge-sensor:
    <<: *sensor
    container_name: s@slot@-edge-sensor
    command: ["-c", "/etc/suricata/suricata.yaml", "--af-packet=sniff"]
    networks:
      internet:
        interface_name: sniff
      mgmt:
        ipv4_address: "172.29.@slot@.11"
        interface_name: mgmt
    volumes:
      - /opt/cr/s@slot@/edge-sensor.yaml:/etc/suricata/suricata.yaml
      - /opt/cr/s@slot@/edge-rules:/var/lib/suricata/rules
      - /var/log/cr/s@slot@/edge:/var/log/suricata
    depends_on: [edge]

  edge-sensor-shipper:
    <<: *rsyslog
    container_name: s@slot@-edge-sensor-shipper
    network_mode: "service:edge-sensor"
    volumes:
      - /opt/cr/s@slot@/rsyslog/edge-sensor-shipper.conf:/etc/rsyslog.conf:ro
      - /var/log/cr/s@slot@/edge:/var/log/cr/s@slot@/edge:ro
    depends_on: [edge-sensor, log-server]

  estate-sensor:
    <<: *sensor
    container_name: s@slot@-estate-sensor
    command: ["-c", "/etc/suricata/suricata.yaml", "--af-packet=sniff"]
    networks:
      web:
        interface_name: sniff
      mgmt:
        ipv4_address: "172.29.@slot@.12"
        interface_name: mgmt
    volumes:
      - /opt/cr/s@slot@/estate-sensor.yaml:/etc/suricata/suricata.yaml
      - /opt/cr/s@slot@/estate-rules:/var/lib/suricata/rules
      - /var/log/cr/s@slot@/estate:/var/log/suricata
    depends_on: [waf]

  estate-sensor-shipper:
    <<: *rsyslog
    container_name: s@slot@-estate-sensor-shipper
    network_mode: "service:estate-sensor"
    volumes:
      - /opt/cr/s@slot@/rsyslog/estate-sensor-shipper.conf:/etc/rsyslog.conf:ro
      - /var/log/cr/s@slot@/estate:/var/log/cr/s@slot@/estate:ro
    depends_on: [estate-sensor, log-server]

  waf-shipper:
    <<: *rsyslog
    container_name: s@slot@-waf-shipper
    hostname: waf-shipper
    networks:
      mgmt:
        ipv4_address: "172.29.@slot@.13"
    volumes:
      - /opt/cr/s@slot@/rsyslog/waf-shipper.conf:/etc/rsyslog.conf:ro
      - /var/log/cr/s@slot@/waf/audit.log:/var/log/cr/s@slot@/waf/audit.log:ro
    depends_on: [log-server]

  log-server:
    <<: *rsyslog
    container_name: s@slot@-log-server
    hostname: log-server
    networks:
      mgmt:
        ipv4_address: "172.29.@slot@.10"
    volumes:
      - /opt/cr/s@slot@/rsyslog/log-server.conf:/etc/rsyslog.conf:ro

networks:
  internet:
    name: s@slot@_internet
    internal: true
    driver_opts:
      com.docker.network.bridge.name: s@slot@-inet
      com.docker.network.driver.mtu: "@mtu@"
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: "172.30.@slot@.0/24"
          gateway: "172.30.@slot@.254"
  estate:
    name: s@slot@_estate
    internal: true
    driver_opts:
      com.docker.network.bridge.name: s@slot@-estate
      com.docker.network.driver.mtu: "@mtu@"
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: "@estate@.0/24"
          gateway: "@estate@.254"
  web:
    name: s@slot@_web
    internal: true
    driver_opts:
      com.docker.network.bridge.name: s@slot@-web
      com.docker.network.driver.mtu: "@mtu@"
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: "@web@.0/24"
          gateway: "@web@.254"
  mgmt:
    name: s@slot@_mgmt
    driver_opts:
      com.docker.network.bridge.name: s@slot@-mgmt
      com.docker.network.driver.mtu: "@mtu@"
    ipam:
      config:
        - subnet: "172.29.@slot@.0/24"
          gateway: "172.29.@slot@.254"
