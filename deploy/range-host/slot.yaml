name: s@slot@

x-contained: &contained
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: "no"

x-sensor: &sensor
  image: jasonish/suricata@sha256:7ca2546f7f2735f621b981b6a5ec84fb962984636f7629a1a2fa6a324d4b6840
  network_mode: host
  userns_mode: host
  cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
  security_opt: ["no-new-privileges:true"]
  restart: "no"
  mem_limit: 768m
  pids_limit: 256
  environment:
    PGID: "4"
  healthcheck:
    test: ["CMD", "suricatasc", "-c", "uptime"]
    interval: 5s
    timeout: 5s
    retries: 24
    start_interval: 1s
    start_period: 60s

x-wargames:
  fronts:
    board: 59
    corp-wp: 60
  extra_hosts:
    corp-wp: ["corp.com:127.0.0.1"]
  limits:
    board:
      cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
      mem_limit: 512m
      pids_limit: 256
    board-db:
      cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
      mem_limit: 768m
      pids_limit: 256
    corp-wp:
      cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE]
      mem_limit: 768m
      pids_limit: 256
    corp-db:
      cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
      mem_limit: 768m
      pids_limit: 256

services:
  kali:
    <<: *contained
    image: ghcr.io/nekonic/cr-kali:${CR_IMAGE_TAG:-dev}
    build: {context: .., dockerfile: kali/Dockerfile}
    container_name: s@slot@-kali
    hostname: kali
    cap_add: [NET_RAW, NET_ADMIN, SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL, AUDIT_WRITE]
    mem_limit: 1g
    pids_limit: 512
    networks:
      internet:
        ipv4_address: "172.30.@slot@.10"
    extra_hosts:
      - "board.com:@estate@.247"
      - "corp.com:@estate@.247"
      - "board:@estate@.59"
      - "corp-wp:@estate@.60"

  edge:
    <<: *contained
    image: ghcr.io/nekonic/cr-edge:${CR_IMAGE_TAG:-dev}
    build: ../edge
    container_name: s@slot@-edge
    hostname: edge
    cap_add: [NET_ADMIN]
    mem_limit: 64m
    pids_limit: 32
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    networks:
      internet:
        ipv4_address: "172.30.@slot@.1"
        interface_name: wan
      estate:
        ipv4_address: "@estate@.1"
        interface_name: lan

  waf:
    <<: *contained
    image: ghcr.io/nekonic/cr-waf:${CR_IMAGE_TAG:-dev}
    build: {context: .., dockerfile: waf/Dockerfile}
    container_name: s@slot@-waf
    hostname: waf
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    mem_limit: 512m
    pids_limit: 256
    networks:
      estate:
        ipv4_address: "@estate@.247"
    extra_hosts:
      - "board:@estate@.59"
      - "corp-wp:@estate@.60"
    volumes:
      - /opt/cr/s@slot@/waf-audit:/var/log/modsecurity/audit

  edge-sensor:
    <<: *sensor
    container_name: s@slot@-edge-sensor
    command: ["-c", "/etc/suricata/suricata.yaml", "--af-packet=s@slot@-inet"]
    volumes:
      - /opt/cr/s@slot@/edge-sensor.yaml:/etc/suricata/suricata.yaml:ro
      - /opt/cr/s@slot@/edge-rules:/var/lib/suricata/rules
      - /opt/cr/s@slot@/edge-log:/var/log/suricata
    depends_on: [edge]

  estate-sensor:
    <<: *sensor
    container_name: s@slot@-estate-sensor
    command: ["-c", "/etc/suricata/suricata.yaml", "--af-packet=s@slot@-estate"]
    volumes:
      - /opt/cr/s@slot@/estate-sensor.yaml:/etc/suricata/suricata.yaml:ro
      - /opt/cr/s@slot@/estate-rules:/var/lib/suricata/rules
      - /opt/cr/s@slot@/estate-log:/var/log/suricata
    depends_on: [waf]

networks:
  internet:
    name: s@slot@_internet
    internal: true
    driver_opts:
      com.docker.network.bridge.name: s@slot@-inet
      com.docker.network.driver.mtu: "@mtu@"
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: "172.30.@slot@.0/24"
          gateway: "172.30.@slot@.254"
  estate:
    name: s@slot@_estate
    internal: true
    driver_opts:
      com.docker.network.bridge.name: s@slot@-estate
      com.docker.network.driver.mtu: "@mtu@"
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: "@estate@.0/24"
          gateway: "@estate@.254"
