name: s${N:?slot number}-board

services:
  board:
    image: ghcr.io/nekonic/cr-board:${CR_IMAGE_TAG:?image tag}
    container_name: s${N}-board
    hostname: board
    depends_on:
      board-db: {condition: service_healthy}
    networks:
      estate:
        ipv4_address: "10.30.${N}.59"
      backend: {}
    environment:
      BOARD_DB_HOST: "board-db"
      BOARD_DB_NAME: "board"
      BOARD_DB_USER: "board"
      BOARD_DB_PASSWORD: "board"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 120s
      start_interval: 1s

  board-db:
    image: mysql@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
    container_name: s${N}-board-db
    networks: [backend]
    command: ["--innodb-rollback-segments=1"]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: "board"
      MYSQL_USER: "board"
      MYSQL_PASSWORD: "board"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uboard", "-pboard"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 120s
      start_interval: 1s

networks:
  estate:
    name: s${N}_estate
    external: true
  backend:
    internal: true
    driver_opts:
      com.docker.network.driver.mtu: "1442"
      com.docker.network.bridge.gateway_mode_ipv4: isolated
