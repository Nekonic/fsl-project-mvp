# The internal wiki's own record of what was read.
#
# It matters that this is the wiki's log and not the platform's opinion. The
# rule this range keeps is that the target decides whether it was beaten - the
# shop flips its own `solved` flag, and this writes its own access log. The
# platform reads the record; it never infers the deed.
log_format  read  '$time_iso8601 $remote_addr "$request" $status "$http_user_agent"';

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/read.log read;
}
