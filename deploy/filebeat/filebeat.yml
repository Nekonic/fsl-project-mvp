filebeat.inputs:
  - type: filestream
    id: suricata-eve
    enabled: true
    paths:
      - /logs/suricata/eve.json
    prospector.scanner.fingerprint.enabled: true
    file_identity.fingerprint: ~
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
    fields_under_root: true
    fields:
      fsl_source: suricata

  - type: filestream
    id: modsecurity-audit
    enabled: true
    paths:
      - /logs/modsecurity/audit.log
    prospector.scanner.fingerprint.enabled: true
    file_identity.fingerprint: ~
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
    fields_under_root: true
    fields:
      fsl_source: modsecurity

  - type: udp
    id: range-syslog
    host: "0.0.0.0:5140"
    max_message_size: 64KiB
    processors:
      - syslog:
          field: message
      - add_fields:
          target: ""
          fields:
            fsl_source: syslog
      - if:
          and:
            - equals:
                log.syslog.appname: suricata
            - regexp:
                message: '^\{'
        then:
          - decode_json_fields:
              fields: [message]
              target: ""
              overwrite_keys: true
              add_error_key: true
          - add_fields:
              target: ""
              fields:
                fsl_source: suricata
      - if:
          and:
            - equals:
                log.syslog.appname: modsecurity
            - regexp:
                message: '^\{'
        then:
          - decode_json_fields:
              fields: [message]
              target: ""
              overwrite_keys: true
              add_error_key: true
          - add_fields:
              target: ""
              fields:
                fsl_source: modsecurity

setup.template.name: fsl-logs
setup.template.pattern: fsl-logs-*
setup.ilm.enabled: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "fsl-logs-%{+yyyy.MM.dd}"
  pipeline: fsl-geoip

logging.level: warning
