filebeat.inputs:
  - type: filestream
    id: suricata-eve
    enabled: true
    paths:
      - /logs/suricata/eve.json
    prospector.scanner.fingerprint.enabled: true
    file_identity.fingerprint: ~
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
    fields_under_root: true
    fields:
      event:
        module: suricata

  - type: filestream
    id: modsecurity-audit
    enabled: true
    paths:
      - /logs/modsecurity/audit.log
    prospector.scanner.fingerprint.enabled: true
    file_identity.fingerprint: ~
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
    fields_under_root: true
    fields:
      event:
        module: modsecurity

  - type: udp
    id: range-syslog
    host: "0.0.0.0:5140"
    max_message_size: 64KiB
    read_buffer: 32MiB
    processors:
      - syslog:
          field: message
      - script:
          lang: javascript
          source: >
            function process(event) {
              var slot = /^[^.]*-(\d+)(\.|$)/.exec(event.Get("log.syslog.hostname") || "");
              event.Put("fsl_slot", slot ? slot[1] : "1");
            }
      - drop_fields:
          fields: [log.source.address]
          ignore_missing: true
      - if:
          and:
            - equals:
                log.syslog.appname: suricata
            - regexp:
                message: '^\{'
        then:
          - decode_json_fields:
              fields: [message]
              target: ""
              overwrite_keys: true
              add_error_key: true
          - add_fields:
              target: ""
              fields:
                event:
                  module: suricata
      - if:
          and:
            - equals:
                log.syslog.appname: modsecurity
            - regexp:
                message: '^\{'
        then:
          - decode_json_fields:
              fields: [message]
              target: ""
              overwrite_keys: true
              add_error_key: true
          - add_fields:
              target: ""
              fields:
                event:
                  module: modsecurity
      - drop_event:
          when:
            not:
              has_fields: ["event.module"]

queue.mem.flush.timeout: 1s

setup.template.name: logs-sensors
setup.template.pattern: logs-*
setup.template.settings:
  index.default_pipeline: geoip
setup.ilm.enabled: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "logs-${FSL_SESSION:shared}-sensors"
  indices:
    - index: "logs-%{[fsl_slot]}-sensors"
      when.has_fields: ["fsl_slot"]
  pipeline: geoip

logging.level: warning
