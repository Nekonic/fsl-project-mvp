filebeat.inputs:
  - type: filestream
    id: suricata-eve
    enabled: true
    paths:
      - /logs/suricata/eve.json
    prospector.scanner.fingerprint.enabled: true
    file_identity.fingerprint: ~
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
    fields_under_root: true
    fields:
      fsl_source: suricata

  - type: filestream
    id: modsecurity-audit
    enabled: true
    paths:
      - /logs/modsecurity/audit.log
    prospector.scanner.fingerprint.enabled: true
    file_identity.fingerprint: ~
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
    fields_under_root: true
    fields:
      fsl_source: modsecurity

  - type: udp
    id: range-syslog
    host: "0.0.0.0:5140"
    max_message_size: 64KiB
    read_buffer: 32MiB
    processors:
      - syslog:
          field: message
      - add_fields:
          target: ""
          fields:
            fsl_source: syslog
      - script:
          lang: javascript
          source: >
            function process(event) {
              var slot = /^[^.]*-(\d+)(\.|$)/.exec(event.Get("log.syslog.hostname") || "");
              event.Put("fsl_slot", slot ? slot[1] : "1");
            }
      - if:
          and:
            - equals:
                log.syslog.appname: suricata
            - regexp:
                message: '^\{'
        then:
          - decode_json_fields:
              fields: [message]
              target: ""
              overwrite_keys: true
              add_error_key: true
          - add_fields:
              target: ""
              fields:
                fsl_source: suricata
      - if:
          and:
            - equals:
                log.syslog.appname: modsecurity
            - regexp:
                message: '^\{'
        then:
          - decode_json_fields:
              fields: [message]
              target: ""
              overwrite_keys: true
              add_error_key: true
          - add_fields:
              target: ""
              fields:
                fsl_source: modsecurity

queue.mem.flush.timeout: 1s

setup.template.name: fsl-logs
setup.template.pattern: fsl-logs-*
setup.template.settings:
  index.default_pipeline: fsl-geoip
setup.ilm.enabled: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "fsl-logs-${FSL_SESSION:shared}-%{+yyyy.MM.dd}"
  indices:
    - index: "fsl-logs-slot%{[fsl_slot]}-%{+yyyy.MM.dd}"
      when.has_fields: ["fsl_slot"]
  pipeline: fsl-geoip

logging.level: warning
