<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Map</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
  #said { margin: 16px; }
  #map { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<p id="said">Signing in read-only...</p>
<script>
const MARGIN = 24;
const ZOOM_STEP = 0.1;
const SMALLEST = 0.3;
const WAIT_MS = 20000;
const FONTS_MS = 5000;
const STILL_MS = 400;
const STILL_SAMPLES = 3;
const SETTLE_MS = 250;
const CLICK_MS = 60;
const CLOSE_ENOUGH = 2;
const PAN_TRIES = 4;
const FIT_TRIES = 3;
const LEAST_ROOM = 2 * MARGIN + 40;

const VIEW_ONLY = `
  html, body { overflow: hidden !important; }
  #project-titlebar, #project-toolbar, app-project-map-menu, app-nodes-menu, app-template,
  app-context-menu, app-context-console-menu, app-topology-summary, app-notification-center,
  app-console-wrapper, app-web-console-inline, app-ai-chat, app-log-console, .inline-taskbar,
  .project-notifications, .cdk-overlay-container, mat-dialog-container { display: none !important; }
  svg.map * { pointer-events: none !important; }
  svg.map { cursor: grab; }
  svg.map:active { cursor: grabbing; }
`;
const BLOCKED = ["contextmenu", "dblclick", "click", "auxclick", "keydown", "keypress", "keyup",
  "dragstart", "dragover", "drop", "touchstart", "paste", "cut", "copy"];

const sleep = (ms) => new Promise((done) => setTimeout(done, ms));

function viewOnly(map) {
  const style = map.document.createElement("style");
  style.id = "view-only";
  style.textContent = VIEW_ONLY;
  map.document.head.append(style);
  const refused = (event) => {
    if (!event.isTrusted) return;
    event.preventDefault();
    event.stopImmediatePropagation();
  };
  BLOCKED.forEach((type) => map.addEventListener(type, refused, {capture: true, passive: false}));
  map.addEventListener("mousedown", (event) => {
    const panning = event.button === 0 && event.target instanceof map.Element && event.target.matches("svg.map");
    if (!panning) refused(event);
  }, {capture: true, passive: false});
}

function button(map, icon) {
  return [...map.document.querySelectorAll("button")].find((found) => {
    const shown = found.querySelector("mat-icon");
    return shown && shown.textContent.trim() === icon;
  });
}

const canvasOf = (map) => map.document.querySelector("svg.map g.canvas");
const transformOf = (map) => {
  const canvas = canvasOf(map);
  return canvas ? canvas.getAttribute("transform") || "" : "";
};

function picture(map) {
  const canvas = canvasOf(map);
  if (!canvas) return null;
  const counted = ["g.node", "g.link", "g.drawing"].map((kind) => canvas.querySelectorAll(kind).length);
  if (!counted[0]) return null;
  const box = canvas.getBBox();
  return {canvas, said: [...counted, box.x, box.y, box.width, box.height].map(Math.round).join()};
}

async function fontsReady(map) {
  const fonts = map.document.fonts;
  if (!fonts || !fonts.ready) return;
  await Promise.race([fonts.ready, sleep(FONTS_MS)]);
}

async function drawn(map) {
  const until = Date.now() + WAIT_MS;
  await fontsReady(map);
  let last = "";
  let still = 0;
  while (Date.now() < until) {
    const now = picture(map);
    const ready = now && ["zoom_out", "adjust", "zoom_out_map"].every((icon) => button(map, icon));
    still = ready && now.said === last ? still + 1 : 0;
    last = now ? now.said : "";
    if (still >= STILL_SAMPLES - 1) return now.canvas;
    await sleep(STILL_MS);
  }
  return null;
}

async function summaryClosed(map) {
  const until = Date.now() + 5000;
  while (Date.now() < until) {
    if (map.document.querySelector("app-topology-summary") && button(map, "account_tree")) {
      button(map, "account_tree").click();
      return;
    }
    await sleep(250);
  }
}

function dragged(map, dx, dy) {
  const svg = map.document.querySelector("svg.map");
  if (!svg) return false;
  const at = {clientX: Math.round(map.innerWidth / 2), clientY: Math.round(map.innerHeight / 2)};
  const mouse = (type, target, moved) => target.dispatchEvent(new map.MouseEvent(type, {
    bubbles: true, cancelable: true, view: map, button: 0, buttons: 1, ...at, ...moved,
  }));
  const before = transformOf(map);
  mouse("mousedown", svg, {});
  mouse("mousemove", svg, {movementX: dx, movementY: dy});
  mouse("mouseup", map.document, {buttons: 0});
  return transformOf(map) !== before;
}

async function panning(map) {
  for (let attempt = 0; attempt < 2; attempt++) {
    if (dragged(map, 1, 0)) {
      dragged(map, -1, 0);
      return true;
    }
    const toggle = button(map, "zoom_out_map");
    if (!toggle) return false;
    toggle.click();
    await sleep(CLICK_MS);
  }
  return false;
}

function shownBox(map) {
  const canvas = canvasOf(map);
  if (!canvas) return null;
  const rects = [...canvas.querySelectorAll("g.node, g.link, g.drawing")].map((part) => part.getBoundingClientRect())
    .filter((rect) => rect.width > 0 && rect.height > 0);
  if (!rects.length) return null;
  const left = Math.min(...rects.map((rect) => rect.left));
  const top = Math.min(...rects.map((rect) => rect.top));
  const right = Math.max(...rects.map((rect) => rect.right));
  const bottom = Math.max(...rects.map((rect) => rect.bottom));
  return {left, top, width: right - left, height: bottom - top};
}

async function scaled(map, room) {
  button(map, "adjust").click();
  await sleep(SETTLE_MS);
  const shown = shownBox(map);
  if (!shown) return;
  const wanted = Math.min(1, (room.width - 2 * MARGIN) / shown.width, (room.height - 2 * MARGIN) / shown.height);
  const steps = Math.min(Math.ceil((1 - wanted) / ZOOM_STEP - 1e-9), Math.round((1 - SMALLEST) / ZOOM_STEP));
  for (let step = 0; step < steps; step++) {
    button(map, "zoom_out").click();
    await sleep(CLICK_MS);
  }
  await sleep(SETTLE_MS);
}

function offCentre(map, room) {
  const now = shownBox(map);
  if (!now) return null;
  return {dx: Math.round(room.width / 2 - (now.left + now.width / 2)),
          dy: Math.round(room.height / 2 - (now.top + now.height / 2))};
}

const near = (off) => off && Math.abs(off.dx) <= CLOSE_ENOUGH && Math.abs(off.dy) <= CLOSE_ENOUGH;

async function centred(map, room) {
  for (let attempt = 0; attempt < PAN_TRIES; attempt++) {
    const off = offCentre(map, room);
    if (!off) return false;
    if (near(off)) return true;
    if (!dragged(map, off.dx, off.dy) && !(await panning(map))) return false;
    await sleep(CLICK_MS);
  }
  return near(offCentre(map, room));
}

function insideRoom(map, room) {
  const shown = shownBox(map);
  return Boolean(shown) && shown.left >= 0 && shown.top >= 0
    && shown.left + shown.width <= room.width && shown.top + shown.height <= room.height;
}

async function fitOnce(map) {
  const room = {width: map.innerWidth, height: map.innerHeight};
  if (room.width < LEAST_ROOM || room.height < LEAST_ROOM) return null;
  let done = false;
  for (let attempt = 0; attempt < FIT_TRIES && !done; attempt++) {
    map.scrollTo(0, 0);
    await panning(map);
    await scaled(map, room);
    await centred(map, room);
    done = insideRoom(map, room);
  }
  return done;
}

const LOCATE_EVERY_MS = 150;
const view = {map: null, canvas: null, fitting: Promise.resolve(), queued: false, told: false, timer: null,
              refit: null, asked: null, last: "", links: null};

function announced(done) {
  if (done === null) return;
  const said = view.told ? "fitted" : "drawn";
  view.told = true;
  window.parent.postMessage({map: said}, "*");
}

function fitted(map) {
  if (view.queued) return view.fitting;
  view.queued = true;
  view.fitting = view.fitting.then(() => {
    view.queued = false;
    return fitOnce(map);
  }).catch(() => false).then((done) => {
    announced(done);
    return done;
  });
  return view.fitting;
}

function refitSoon() {
  clearTimeout(view.refit);
  view.refit = setTimeout(() => {
    if (view.map) fitted(view.map);
  }, SETTLE_MS);
}

const boxOf = (element) => {
  const rect = element.getBoundingClientRect();
  return {x: rect.left, y: rect.top, w: rect.width, h: rect.height};
};
const centreOf = (box) => ({x: box.x + box.w / 2, y: box.y + box.h / 2});
const inside = (point, box) => point.x >= box.x && point.x <= box.x + box.w && point.y >= box.y && point.y <= box.y + box.h;
const union = (boxes) => {
  const shown = boxes.filter((box) => box && box.w && box.h);
  if (!shown.length) return null;
  const left = Math.min(...shown.map((box) => box.x));
  const top = Math.min(...shown.map((box) => box.y));
  const right = Math.max(...shown.map((box) => box.x + box.w));
  const bottom = Math.max(...shown.map((box) => box.y + box.h));
  return {x: left, y: top, w: right - left, h: bottom - top};
};
const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function nodeNamed(doc, name) {
  return [...doc.querySelectorAll("g.node")].find((node) => {
    const label = node.querySelector("text.label");
    return label && label.textContent.trim() === name;
  }) || null;
}

function iconBox(node) {
  const icon = node.querySelector("image") || node.querySelector("svg");
  return boxOf(icon || node);
}

function nodeBox(doc, name) {
  const node = nodeNamed(doc, name);
  if (!node) return null;
  const label = node.querySelector("text.label");
  return union([iconBox(node), label ? boxOf(label) : null]);
}

function pathEnds(path) {
  if (!path.getTotalLength || !path.getScreenCTM) return null;
  const length = path.getTotalLength();
  const matrix = path.getScreenCTM();
  if (!length || !matrix) return null;
  const screen = (point) => ({x: matrix.a * point.x + matrix.c * point.y + matrix.e,
                              y: matrix.b * point.x + matrix.d * point.y + matrix.f});
  return [screen(path.getPointAtLength(0)), screen(path.getPointAtLength(length))];
}

function linkPath(doc, a, b) {
  const one = nodeNamed(doc, a);
  const other = nodeNamed(doc, b);
  if (!one || !other) return null;
  const ends = [centreOf(iconBox(one)), centreOf(iconBox(other))];
  let best = null;
  doc.querySelectorAll("g.link path, path.link").forEach((path) => {
    const at = pathEnds(path);
    if (!at) return;
    const apart = Math.min(distance(at[0], ends[0]) + distance(at[1], ends[1]),
                           distance(at[0], ends[1]) + distance(at[1], ends[0]));
    if (!best || apart < best.apart) best = {path, apart, at};
  });
  const reach = distance(ends[0], ends[1]);
  return best && best.apart < Math.max(80, reach * 0.6) ? {...best, ends} : null;
}

function linkBox(doc, a, b) {
  const found = linkPath(doc, a, b);
  if (!found) return null;
  const box = boxOf(found.path);
  const thick = 8;
  return {x: box.x - (box.w < thick ? (thick - box.w) / 2 : 0), y: box.y - (box.h < thick ? (thick - box.h) / 2 : 0),
          w: Math.max(box.w, thick), h: Math.max(box.h, thick)};
}

async function linksRead() {
  if (view.links) return view.links;
  const project = new URLSearchParams(location.search).get("project");
  const stored = JSON.parse(localStorage.getItem("controller-1") || "{}");
  const asked = (tail) => fetch(`/v3/projects/${encodeURIComponent(project)}/${tail}`, {
    headers: {Authorization: `Bearer ${stored.authToken}`},
  }).then((answer) => (answer.ok ? answer.json() : []));
  try {
    const [nodes, links] = await Promise.all([asked("nodes"), asked("links")]);
    const named = new Map(nodes.map((node) => [node.node_id, node.name]));
    view.links = links.map((link) => (link.nodes || []).map((end) => ({
      name: named.get(end.node_id), text: ((end.label && end.label.text) || "").trim(),
    })));
  } catch (error) {
    view.links = [];
  }
  return view.links;
}

function labelBox(doc, host, other) {
  const node = nodeNamed(doc, host);
  if (!node) return null;
  const centre = centreOf(iconBox(node));
  const labels = [...doc.querySelectorAll("text.interface_label")].filter((label) => label.textContent.trim());
  const link = (view.links || []).find((ends) => ends.some((end) => end.name === host) && ends.some((end) => end.name === other));
  const end = link && link.find((one) => one.name === host);
  let candidates = end && end.text ? labels.filter((label) => label.textContent.trim() === end.text) : [];
  if (!candidates.length) {
    const found = linkPath(doc, host, other);
    if (!found) return null;
    const [from, to] = found.ends;
    const along = {x: to.x - from.x, y: to.y - from.y};
    const span = Math.hypot(along.x, along.y) || 1;
    candidates = labels.filter((label) => {
      const at = centreOf(boxOf(label));
      const share = ((at.x - from.x) * along.x + (at.y - from.y) * along.y) / (span * span);
      const off = Math.abs((at.x - from.x) * along.y - (at.y - from.y) * along.x) / span;
      return share > -0.15 && share < 0.5 && off < Math.max(40, span * 0.3);
    });
  }
  const nearest = candidates.sort((a, b) => distance(centreOf(boxOf(a)), centre) - distance(centreOf(boxOf(b)), centre))[0];
  return nearest ? boxOf(nearest) : null;
}

function zoneBox(doc, name) {
  const node = nodeNamed(doc, name);
  if (!node) return null;
  const centre = centreOf(iconBox(node));
  const zones = [...doc.querySelectorAll("g.drawing rect")].map(boxOf)
    .filter((box) => box.w > 0 && box.h > 0 && inside(centre, box));
  zones.sort((a, b) => a.w * a.h - b.w * b.h);
  return zones[0] || null;
}

function withInterfaces(doc, box) {
  if (!box) return null;
  const reach = Math.max(box.w, box.h) * 0.4;
  const near = {x: box.x - reach, y: box.y - reach, w: box.w + 2 * reach, h: box.h + 2 * reach};
  const touching = (label) => {
    const at = boxOf(label);
    return at.x < near.x + near.w && near.x < at.x + at.w && at.y < near.y + near.h && near.y < at.y + at.h;
  };
  const labels = [...doc.querySelectorAll("text.interface_label")].filter((label) => label.textContent.trim() && touching(label));
  return union([box, ...labels.map(boxOf)]);
}

function located(spec) {
  const doc = view.map && view.map.document;
  if (!doc || !spec) return null;
  if (spec.node) return withInterfaces(doc, nodeBox(doc, spec.node));
  if (Array.isArray(spec.link)) return linkBox(doc, spec.link[0], spec.link[1]);
  if (Array.isArray(spec.label)) return labelBox(doc, spec.label[0], spec.label[1]);
  if (spec.zone) return zoneBox(doc, spec.zone);
  return null;
}

function rounded(box) {
  return box ? {x: Math.round(box.x), y: Math.round(box.y), w: Math.round(box.w), h: Math.round(box.h)} : null;
}

function textRects() {
  const doc = view.map && view.map.document;
  if (!doc) return [];
  const nodes = [...doc.querySelectorAll("g.node")].map((node) => {
    const label = node.querySelector("text.label");
    return union([iconBox(node), label ? boxOf(label) : null]);
  });
  const interfaces = [...doc.querySelectorAll("text.interface_label")].filter((label) => label.textContent.trim()).map(boxOf);
  const captions = [...doc.querySelectorAll("g.drawing text")].filter((caption) => caption.textContent.trim()).map(boxOf);
  return [...nodes, ...interfaces, ...captions].filter(Boolean).map(rounded);
}

function zoneRects() {
  const doc = view.map && view.map.document;
  if (!doc) return [];
  return [...doc.querySelectorAll("g.drawing rect")].map(boxOf)
    .filter((box) => box.w > 0 && box.h > 0).map(rounded);
}

function answerLocate(always) {
  if (!view.asked) return;
  const rect = rounded(located(view.asked.spec));
  const zones = zoneRects();
  const text = textRects();
  const said = JSON.stringify([rect, zones, text]);
  if (!always && said === view.last) return;
  view.last = said;
  view.asked.to.postMessage({located: view.asked.id, rect, zones, text}, view.asked.origin);
}

async function locateAsked(event) {
  const spec = event.data.locate;
  clearInterval(view.timer);
  if (!spec) {
    view.asked = null;
    return;
  }
  view.asked = {spec, id: event.data.id, to: event.source, origin: event.origin || "*"};
  view.last = "";
  if (Array.isArray(spec.label)) await linksRead();
  if (!view.canvas) return;
  answerLocate(true);
  view.timer = setInterval(() => answerLocate(false), LOCATE_EVERY_MS);
}

window.addEventListener("resize", refitSoon);
if (typeof ResizeObserver === "function") new ResizeObserver(refitSoon).observe(document.documentElement);

window.addEventListener("message", (event) => {
  if (event.source !== window.parent) return;
  const said = event.data;
  const asksFit = said === "fit" || (said && typeof said === "object" && said.fit);
  if (asksFit && view.map) fitted(view.map);
  if (said && typeof said === "object" && "locate" in said) locateAsked(event);
});

(async () => {
  const auditor = __FSL_AUDITOR__;
  const said = document.getElementById("said");
  const port = parseInt(location.port, 10) || (location.protocol === "https:" ? 443 : 80);
  const answer = await fetch("/v3/access/users/authenticate", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(auditor),
  });
  if (!answer.ok) {
    said.textContent = "The map server refused the read-only sign-in (" + answer.status + ").";
    return;
  }
  const token = (await answer.json()).access_token;
  localStorage.setItem("controller-1", JSON.stringify({
    id: 1, name: "local", location: "bundled", host: location.hostname, port: port,
    protocol: location.protocol, authToken: token, username: auditor.username, tokenExpired: false,
  }));
  localStorage.setItem("controllerIds", "controller-1");
  localStorage.setItem("showInterfaceLabels", "true");
  localStorage.setItem("integrateLinkLabelsToLinks", "false");
  localStorage.setItem("statistics_command", "false");
  const project = new URLSearchParams(location.search).get("project");
  const opened = "/static/web-ui/controller/1/" + (project ? "project/" + encodeURIComponent(project) : "projects");
  if (!project) {
    location.replace(opened);
    return;
  }
  const frame = document.createElement("iframe");
  frame.id = "map";
  frame.title = "Map";
  frame.addEventListener("load", async () => {
    const map = frame.contentWindow;
    viewOnly(map);
    const canvas = await drawn(map);
    await summaryClosed(map);
    if (!canvas) return;
    view.map = map;
    view.canvas = canvas;
    await fitted(map);
    if (view.asked) {
      answerLocate(true);
      clearInterval(view.timer);
      view.timer = setInterval(() => answerLocate(false), LOCATE_EVERY_MS);
    }
  }, {once: true});
  frame.src = opened;
  said.remove();
  document.body.append(frame);
})();
</script>
</body>
</html>
