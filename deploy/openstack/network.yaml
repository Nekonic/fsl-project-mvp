# Cyber range — network addressing, the real deployment (as drawn in the topology diagram).
# A picture of the network for people. The values that configure it are in
# cloud.yaml (copied from cloud.example.yaml); the provider/host values are the live cloud's
# (the cloud the product moved to on 2026-10-20; the tenant MTU there is 1442, OVN Geneve).

provider:                         # the external network (flat) — physical, where floating IPs live
  cidr: 192.168.2.0/24
  gateway: 192.168.2.1
  floating_pool: 192.168.2.200-192.168.2.250   # the platform's floating IP is 192.168.2.247
  openstack_hosts:                # kolla-ansible on KVM, ML2/OVN; every public endpoint is http://10.0.0.10:<port>
    api_vip: 10.0.0.10
    con01: 10.0.0.11              # controller
    com01: 10.0.0.31              # the one compute node
    stg01: 10.0.0.41              # storage (Cinder LVM; the product does not use it)
  operator: "reaches 10.0.0.0/24 and the provider network through a VPN"

tenant:                           # fsl-range — VMs on `com01`, reached via the Neutron router + floating IPs
  project: fsl-range
  router:                         # Neutron tenant router (virtual)
    gateway: 10.20.0.1            # the cr-platform subnet gateway
    nat: "FIP 192.168.2.247 -> platform 10.20.0.143"
  networks:
    cr-platform: 10.20.0.0/24    # the scorer VM's net; the floating IP terminates here
    cr-internet: "30 origin /24 (simulated), default ru 5.188.10.0/24"
    cr-estate:   10.30.0.0/24    # the targets + the WAF; the edge is 10.30.0.1
    cr-mgmt:     10.31.0.0/24    # out-of-band management (no gateway, fabric.py NO_DEFAULT_ROUTE)
  hosts:
    cr-platform:                 # scorer, multi-homed
      ens3: 10.20.0.143           # cr-platform -> FIP 192.168.2.247 (operator console :8000)
      ens7: 10.31.0.183           # cr-mgmt -> ssh to range hosts, syslog :5140 collector
    cr-edge:                     # OPNsense edge firewall + Suricata (IDS)
      wan:  "cr-internet — holds the .1 gateway of each of the 30 origin /24s"
      opt1: "cr-estate"
      mgmt: 10.31.0.103
    cr-kali:     { cr-internet: "origin source IPs (30 countries, per-country SNAT)", mgmt: 10.31.0.40 }
    cr-waf:      { cr-estate: 10.30.0.71, mgmt: 10.31.0.235 }   # ModSecurity reverse-proxy, fronts the targets
    cr-wargame-host: { cr-estate: 10.30.0.231, mgmt: 10.31.0.204 }   # Docker: board :8000, corp-wp :80 published; board-db, corp-db inside
  paths:
    external: "operator (through the VPN) -> FIP 192.168.2.247 -> platform (console :8000)"
    attack:   "cr-kali -> cr-internet (spoofed origin) -> OPNsense WAN -> cr-estate -> WAF -> board/corp"
    mgmt:     "platform ens7 10.31.0.183 -> cr-mgmt -> ssh / syslog to every host (out-of-band)"
  collector_port: 5140            # syslog UDP: OPNsense + WAF -> platform Filebeat -> Elasticsearch -> Kibana
  security_groups: [cr-range, cr-reach, cr-platform]
