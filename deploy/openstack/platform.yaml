heat_template_version: 2021-04-16

description: >
  The platform VM: the stock Ubuntu 24.04 cloud image whose first boot installs
  Docker, clones the repo and brings the whole platform up with docker compose
  from images prebuilt on ghcr.io. Every parameter comes from cloud.yaml
  (bin/platform-rebuild); the API password and the range ssh key are added
  over ssh. With floating_ip_id set the stack only associates that floating
  IP, so deleting the stack disassociates it and leaves it in the project.

parameters:
  keystone:
    type: string
  user:
    type: string
  domain:
    type: string
  region:
    type: string
  interface:
    type: string
  image:
    type: string
  flavor:
    type: string
  key_name:
    type: string
  external_network:
    type: string
  floating_address:
    type: string
  floating_ip_id:
    type: string
  availability_zone:
    type: string
  cidr:
    type: string
  dns:
    type: comma_delimited_list
  repository:
    type: string
  ref:
    type: string
  range_flavor:
    type: string
  build_flavor:
    type: string
  role_flavors:
    type: string
  subnets:
    type: string
  range_mtu:
    type: string
  opnsense:
    type: string
  slots:
    type: string

conditions:
  zoned: {not: {equals: [{get_param: availability_zone}, ""]}}
  reserved: {not: {equals: [{get_param: floating_ip_id}, ""]}}
  allocated: {equals: [{get_param: floating_ip_id}, ""]}

resources:
  network:
    type: OS::Neutron::Net
    properties:
      name: fsl-platform

  subnet:
    type: OS::Neutron::Subnet
    properties:
      name: fsl-platform
      network: {get_resource: network}
      cidr: {get_param: cidr}
      dns_nameservers: {get_param: dns}

  router:
    type: OS::Neutron::Router
    properties:
      name: fsl-platform
      external_gateway_info:
        network: {get_param: external_network}

  router_interface:
    type: OS::Neutron::RouterInterface
    properties:
      router: {get_resource: router}
      subnet: {get_resource: subnet}

  security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      name: fsl-platform
      rules:
        - {protocol: tcp, port_range_min: 22, port_range_max: 22}
        - {protocol: tcp, port_range_min: 8000, port_range_max: 8000}
        - {protocol: tcp, port_range_min: 8002, port_range_max: 8002}
        - {protocol: icmp}

  port:
    type: OS::Neutron::Port
    properties:
      network: {get_resource: network}
      fixed_ips: [{subnet: {get_resource: subnet}}]
      security_groups: [{get_resource: security_group}]

  floating_ip:
    type: OS::Neutron::FloatingIP
    condition: allocated
    depends_on: router_interface
    properties:
      floating_network: {get_param: external_network}
      port_id: {get_resource: port}

  floating_ip_association:
    type: OS::Neutron::FloatingIPAssociation
    condition: reserved
    depends_on: router_interface
    properties:
      floatingip_id: {get_param: floating_ip_id}
      port_id: {get_resource: port}

  server:
    type: OS::Nova::Server
    properties:
      name: fsl-platform
      image: {get_param: image}
      flavor: {get_param: flavor}
      key_name: {get_param: key_name}
      availability_zone: {if: [zoned, {get_param: availability_zone}, null]}
      networks: [{port: {get_resource: port}}]
      config_drive: true
      user_data_format: RAW
      user_data:
        str_replace:
          params:
            "%keystone%": {get_param: keystone}
            "%user%": {get_param: user}
            "%domain%": {get_param: domain}
            "%region%": {get_param: region}
            "%interface%": {get_param: interface}
            "%image%": {get_param: image}
            "%availability_zone%": {get_param: availability_zone}
            "%range_flavor%": {get_param: range_flavor}
            "%build_flavor%": {get_param: build_flavor}
            "%role_flavors%": {get_param: role_flavors}
            "%subnets%": {get_param: subnets}
            "%range_mtu%": {get_param: range_mtu}
            "%opnsense%": {get_param: opnsense}
            "%slots%": {get_param: slots}
            "%project%": {get_param: "OS::project_id"}
            "%repository%": {get_param: repository}
            "%ref%": {get_param: ref}
            "%mtu%": {get_attr: [network, mtu]}
            "%fixed_ip%": {get_attr: [port, fixed_ips, 0, ip_address]}
            "%floating_ip%": {if: [reserved, {get_param: floating_address}, {get_attr: [floating_ip, floating_ip_address]}]}
            "%network%": {get_resource: network}
          template: |
            #cloud-config
            package_update: true
            packages: [docker.io, docker-compose-v2, git]
            swap:
              filename: /swapfile
              size: 4G
            write_files:
              - path: /etc/docker/daemon.json
                content: |
                  {"mtu": %mtu%, "default-network-opts": {"bridge": {"com.docker.network.driver.mtu": "%mtu%"}}}
              - path: /root/openstack.env
                permissions: "0600"
                content: |
                  FSL_SUBSTRATE=range.openstack.connect
                  DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,[::1],%floating_ip%
                  FSL_TOOL_IMAGE=fsl-kali
                  FSL_OPENSTACK_KEYSTONE=%keystone%
                  FSL_OPENSTACK_USER=%user%
                  FSL_OPENSTACK_DOMAIN=%domain%
                  FSL_OPENSTACK_PROJECT=%project%
                  FSL_OPENSTACK_REGION=%region%
                  FSL_OPENSTACK_INTERFACE=%interface%
                  FSL_OPENSTACK_BASE_IMAGE=%image%
                  FSL_OPENSTACK_FLAVOR=%range_flavor%
                  FSL_OPENSTACK_BUILD_FLAVOR=%build_flavor%
                  FSL_OPENSTACK_ROLE_FLAVORS=%role_flavors%
                  FSL_OPENSTACK_AVAILABILITY_ZONE=%availability_zone%
                  FSL_OPENSTACK_SUBNETS=%subnets%
                  FSL_OPENSTACK_MTU=%range_mtu%
                  FSL_OPNSENSE=%opnsense%
                  FSL_OPENSTACK_SLOTS=%slots%
                  FSL_OPENSTACK_SSH_USER=ubuntu
                  FSL_OPENSTACK_SSH_KEY=/data/ssh/id_ed25519
                  FSL_OPENSTACK_BUILD_NETWORK=%network%
              - path: /etc/systemd/network/90-fsl-attached.network
                content: |
                  [Match]
                  Name=en*
                  [Network]
                  DHCP=ipv4
                  [DHCPv4]
                  UseRoutes=false
                  UseDNS=false
              - path: /root/compose.env
                content: |
                  FSL_PUBLISH=%fixed_ip%
                  FSL_SYSLOG_PUBLISH=0.0.0.0
              - path: /etc/systemd/system/fsl-platform.service
                content: |
                  [Unit]
                  Requires=docker.service
                  After=docker.service network-online.target
                  Wants=network-online.target
                  [Service]
                  Type=oneshot
                  RemainAfterExit=yes
                  TimeoutStartSec=0
                  ExecStartPre=-/usr/bin/docker compose -f /opt/fsl/compose.yaml pull --quiet
                  ExecStartPre=-/usr/bin/docker compose -f /opt/fsl/session.yaml pull --quiet
                  ExecStart=/usr/bin/docker compose -f /opt/fsl/compose.yaml up -d
                  [Install]
                  WantedBy=multi-user.target
            runcmd:
              - [git, clone, --branch, "%ref%", "%repository%", /opt/fsl]
              - [mv, /root/openstack.env, /opt/fsl/openstack.env]
              - [mv, /root/compose.env, /opt/fsl/.env]
              - [sh, -c, "echo FSL_IMAGE_TAG=$(git -C /opt/fsl rev-parse HEAD) >> /opt/fsl/.env"]
              - [python3, /opt/fsl/bin/fetch-geoip]
              - [sh, -c, "echo FSL_OPENSTACK_PLATFORM=$(cloud-init query instance_id) >> /opt/fsl/openstack.env"]
              - [networkctl, reload]
              - [chown, -R, "ubuntu:ubuntu", /opt/fsl]
              - [usermod, -aG, docker, ubuntu]
              - [systemctl, daemon-reload]
              - [systemctl, enable, --now, fsl-platform.service]

outputs:
  address:
    description: The floating IP the platform is reached at, by ssh.
    value: {if: [reserved, {get_param: floating_address}, {get_attr: [floating_ip, floating_ip_address]}]}
