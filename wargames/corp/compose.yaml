services:
  corp-wp:
    platform: linux/amd64
    build: ./app
    image: ghcr.io/nekonic/cr-corp:${CR_IMAGE_TAG:-dev}
    depends_on:
      corp-db: {condition: service_healthy}
    networks: [estate]
    environment:
      WORDPRESS_DB_HOST: "corp-db"
      WORDPRESS_DB_NAME: "wordpress"
      WORDPRESS_DB_USER: "wordpress"
      WORDPRESS_DB_PASSWORD: "wordpress"
      CR_WP_URL: "http://corp.com"
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /tmp/cr-corp-ready && wp core is-installed --allow-root --path=/var/www/html && wp plugin is-active ultimate-member --allow-root --path=/var/www/html"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
      start_interval: 1s

  corp-db:
    platform: linux/amd64
    build: ./db
    image: ghcr.io/nekonic/cr-corp-db:${CR_IMAGE_TAG:-dev}
    networks: [estate]
    command: ["--binlog-format=ROW", "--log-bin=binlog", "--server-id=1", "--innodb-rollback-segments=1"]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: "wordpress"
      MYSQL_USER: "wordpress"
      MYSQL_PASSWORD: "wordpress"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uwordpress", "-pwordpress"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
      start_interval: 1s
