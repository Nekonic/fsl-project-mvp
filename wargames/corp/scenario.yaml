name: Corporate site
description: >-
  A WordPress company site on MySQL behind a WAF and an IDS. Three unpatched
  plugins have access-control vulnerabilities (CVEs) that need no login and that
  the default rules do not detect. An objective counts as reached only when the
  site's own database shows the change.
