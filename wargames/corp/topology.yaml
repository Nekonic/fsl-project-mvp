lans:
  internet: [121.134.88.40/29]
  dmz: [10.30.0.0/24]
  web-outer: [10.30.128.0/24]
  web-inner: [10.30.128.0/24]
  mgmt: [172.29.0.0/24]

nodes:
  cr-kali:
    role: kali
    ports:
      - {lan: internet, device: cr-kali, origins: true}
  cr-infra:
    role: infra
    ports:
      - {lan: internet, device: cr-edge, address: 121.134.88.42, as: wan}
      - {lan: dmz, device: cr-edge, address: 10.30.0.1, as: lan, forwards: true}
      - {lan: web-outer, device: cr-ids, address: 10.30.128.251, ids: true}
      - {lan: web-inner, device: cr-ids, address: 10.30.128.252, ids: true, sniffed: true}
      - {lan: mgmt, device: log-server, address: 172.29.0.10}
  cr-waf:
    role: waf
    ports:
      - {lan: dmz, device: cr-waf, address: 10.30.0.247}
      - {lan: web-outer, device: cr-waf, address: 10.30.128.247}
      - {lan: mgmt, device: cr-waf, address: 172.29.0.12}
  cr-target:
    role: target
    ports:
      - {lan: web-inner, device: corp-wp, address: 10.30.128.60}

devices:
  cr-kali: {node: cr-kali, roles: [attacker, proxy]}
  cr-edge: {node: cr-infra, roles: [edge], forwards: {80: cr-waf}}
  cr-ids:
    node: cr-infra
    roles: [sensor]
    rules: /var/lib/suricata/rules/local.rules
    reload: suricatasc -c reload-rules
    logs: {suricata: /var/log/suricata/eve.json}
  log-server: {node: cr-infra, roles: [log-server]}
  cr-waf:
    node: cr-waf
    roles: [gateway]
    names: [board.com, corp.com]
    rules: /etc/nginx/modsecurity/crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
    reload: nginx -t 2>&1 && nginx -s reload 2>&1
    pid: /run/nginx.pid
    logs: {modsecurity: /var/log/modsecurity/audit/audit.log, nginx: /var/log/nginx/refused.log}
    upstreams: {board: 10.30.128.59, corp-wp: 10.30.128.60}
  cr-target: {node: cr-target, roles: [wargames]}
  corp-wp: {node: cr-target, container: corp-wp, roles: [corp], publish: [80], extra_hosts: ["corp.com:127.0.0.1"]}
  corp-db: {node: cr-target, container: corp-db, roles: [corp-db]}

watches:
  sensor: gateway
