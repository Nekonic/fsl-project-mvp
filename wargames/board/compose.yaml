services:
  board:
    platform: linux/amd64
    build: ./app
    container_name: fsl-board
    depends_on:
      board-db: {condition: service_healthy}
    networks: [estate]
    environment:
      BOARD_DB_HOST: "board-db"
      BOARD_DB_NAME: "board"
      BOARD_DB_USER: "board"
      BOARD_DB_PASSWORD: "board"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 40s

  board-db:
    platform: linux/amd64
    image: mysql@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
    container_name: fsl-board-db
    networks: [estate]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: "board"
      MYSQL_USER: "board"
      MYSQL_PASSWORD: "board"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uboard", "-pboard"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
