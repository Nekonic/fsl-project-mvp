{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}커뮤니티 게시판{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'post_list' %}">커뮤니티 게시판</a>
      <form class="d-flex" role="search" action="{% url 'search' %}" method="get">
        <input class="form-control me-2" type="search" name="q" placeholder="검색" value="{{ query|default:'' }}">
        <button class="btn btn-outline-light" type="submit">검색</button>
      </form>
      <div class="ms-3">
        {% if user.is_authenticated %}
          <a class="btn btn-primary btn-sm" href="{% url 'post_new' %}">글쓰기</a>
          <form class="d-inline" action="{% url 'logout' %}" method="post">{% csrf_token %}
            <button class="btn btn-outline-light btn-sm" type="submit">로그아웃</button>
          </form>
        {% else %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">로그인</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
