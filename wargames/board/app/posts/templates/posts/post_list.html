{% extends "posts/base.html" %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">게시글</h1>
    {% with current=request.GET.sort|default:"-created_at" %}
      <form class="d-flex align-items-center" action="{% url 'post_list' %}" method="get">
        <label class="form-label mb-0 me-2 text-nowrap" for="sort">정렬</label>
        <select class="form-select form-select-sm" id="sort" name="sort" onchange="this.form.submit()">
          <option value="-created_at"{% if current == "-created_at" %} selected{% endif %}>최신순</option>
          <option value="created_at"{% if current == "created_at" %} selected{% endif %}>오래된순</option>
          <option value="title"{% if current == "title" %} selected{% endif %}>제목순</option>
        </select>
        <noscript><button class="btn btn-outline-secondary btn-sm ms-2 text-nowrap" type="submit">적용</button></noscript>
      </form>
    {% endwith %}
  </div>
  <div class="list-group">
    {% for post in posts %}
      <a class="list-group-item list-group-item-action" href="{% url 'post_detail' post.pk %}">
        <div class="d-flex w-100 justify-content-between">
          <h2 class="h6 mb-1">{{ post.title }}</h2>
          <small>{{ post.created_at|date:"Y-m-d H:i" }}</small>
        </div>
        <small class="text-muted">{{ post.author.username }}</small>
      </a>
    {% empty %}
      <p class="text-muted">아직 글이 없습니다.</p>
    {% endfor %}
  </div>
{% endblock %}
