name: Community board
description: >-
  An ordinary Django board on MySQL, behind the WAF and the IDS. The attacker
  scores by exfiltrating its auth-user password hashes and proving possession
  against the platform's snapshot.
image: ghcr.io/nekonic/fsl-board
public_url: http://board.com
objective_model: loot_verified
case_file: board.yaml
category: sql-injection
difficulty: medium
minutes: 40
defense:
  minimal:
    waf: {paranoia: 4}
    suricata: local.rules
  full:
    waf: {paranoia: 1}
    suricata: local.rules
  ids:
    waf: {paranoia: 1}
    suricata: no-uri-sqli.rules
  missed:
    waf:
      paranoia: 1
      exclusions:
        - {rule_id: 949110}
        - {rule_id: 959100}
    suricata: local.rules
default_lesson: waf-exclusion
foundations:
  - id: f1
    order: 1
    text: lesson.range
    level: easy
    minutes: 10
    prerequisites: []
    defense: full
    cases: [board-normal-search]
    theory:
      - {id: map, shows: map}
    hints: [why_entry]
    steps:
      - id: map
        point: {panel: '.pane-tab[data-pane="topology"]'}
        check: {kind: click}
      - id: entry
        point: {pane: true, opens: topology}
        check: {kind: answer, of: entry}
      - id: logs
        point: {pane: true, opens: topology}
        check: {kind: answer, of: logs}
      - id: segment
        point: {pane: true, opens: topology}
        check: {kind: answer, of: segment}
  - id: f2
    order: 2
    text: lesson.follow
    level: easy
    minutes: 15
    prerequisites: [f1]
    defense: full
    cases: [board-normal-search]
    theory:
      - {id: path, shows: follow}
    hints: [why_source]
    steps:
      - id: search
        site: "/search/?q=\uC11C\uC6B8 \uB9DB\uC9D1 \uCD94\uCC9C"
        point: {panel: "#site-address", opens: site}
        check: {kind: sent, match: '[\uAC00-\uD7A3]'}
      - id: follow
        point: {panel: "#topology-request", opens: topology}
        check: {kind: click}
      - id: source
        point: {panel: "#topology-hops", opens: topology}
        check: {kind: answer, of: source, about: search}
      - id: port
        point: {panel: "#topology-hops", opens: topology}
        check: {kind: answer, of: port, about: search}
      - id: status
        point: {panel: "#topology-hops", opens: topology}
        check: {kind: answer, of: status, about: search}
  - id: f3
    order: 3
    text: lesson.http
    level: easy
    minutes: 10
    prerequisites: [f2]
    defense: full
    cases: [board-normal-search]
    theory:
      - {id: request, shows: method}
    hints: [why_parameter]
    steps:
      - id: search
        site: "/search/?q=\uC11C\uC6B8 \uB9DB\uC9D1 \uCD94\uCC9C"
        point: {panel: "#site-address", opens: site}
        check: {kind: sent, match: '[\uAC00-\uD7A3]'}
      - id: method
        point: {panel: "#site-dev-toggle", opens: site}
        check: {kind: answer, of: method, about: search}
      - id: path
        point: {panel: "#site-address", opens: site}
        check: {kind: answer, of: path, about: search}
      - id: parameter
        point: {panel: "#site-address", opens: site}
        check: {kind: answer, of: parameter, about: search}
      - id: meaning
        point: {panel: "#site-dev-toggle", opens: site}
        check: {kind: choice, of: status_class, about: search, options: [2xx, 3xx, 4xx, 5xx]}
  - id: f4
    order: 4
    text: lesson.logs
    level: easy
    minutes: 15
    prerequisites: [f3]
    defense: full
    cases: [board-normal-search]
    theory:
      - {id: records, shows: engine}
    hints: [why_one_engine]
    steps:
      - id: search
        site: "/search/?q=\uC11C\uC6B8 \uB9DB\uC9D1 \uCD94\uCC9C"
        point: {panel: "#site-address", opens: site}
        check: {kind: sent, match: '[\uAC00-\uD7A3]'}
      - id: engine
        point: {pane: true, opens: elk}
        query: 'event_type : "http" and url : *search*'
        records: all
        check: {kind: choice, of: engine, about: search, options: [modsecurity, suricata]}
      - id: probe
        site: "/search/?q=<script>alert(1)</script>"
        point: {panel: "#site-address", opens: site}
        check: {kind: sent, match: script}
      - id: find
        point: {kibana: '[data-test-subj="docTableExpandToggleColumn"]', opens: elk}
        query: "url : *script* and status : 403"
        check: {kind: click}
      - id: verdict
        point: {kibana: '[data-test-subj="field-status"]', first: '[data-test-subj="docTableExpandToggleColumn"]', opens: elk}
        check: {kind: answer, of: status, about: probe}
      - id: address
        point: {kibana: '[data-test-subj="field-source_ip"]', first: '[data-test-subj="docTableExpandToggleColumn"]', opens: elk}
        check: {kind: answer, of: waf_source, about: probe}
  - id: f5
    order: 5
    text: lesson.attack
    level: easy
    minutes: 25
    prerequisites: [f4]
    defense: full
    cases: [board-normal-search]
    theory:
      - {id: attack, shows: stopped}
    hints: [why_total, why_count]
    steps:
      - id: attack
        site: "/search/?q=' OR 1=1--"
        point: {panel: "#site-address", opens: site}
        check: {kind: sent, match: "1=1"}
      - id: follow
        point: {panel: "#topology-request", opens: topology}
        check: {kind: click}
      - id: stopped
        point: {panel: "#topology-hops", opens: topology}
        check: {kind: answer, of: stopped_at, about: attack}
      - id: rule
        point: {panel: "#topology-hops", opens: topology}
        check: {kind: answer, of: rule, marker: browse, path: "1=1", known: ["949110"]}
      - id: sqlmap
        point: {pane: true}
        check: {kind: kali, case: board-sqli-orderby-sqlmap}
      - id: requests
        point: {pane: true}
        check: {kind: answer, of: requests, about: sqlmap}
  - id: f6
    order: 6
    text: lesson.miss
    level: medium
    minutes: 25
    prerequisites: [f5]
    defense: missed
    cases: [board-normal-search]
    theory:
      - {id: cost, shows: lost}
    hints: [why_leak]
    steps:
      - id: excluded
        point: {pane: true, opens: waf}
        command: cat {waf_rules}
        check: {kind: answer, of: excluded}
      - id: sqlmap
        point: {pane: true}
        check: {kind: kali, case: board-sqli-orderby-sqlmap}
      - id: loot
        point: {pane: true}
        check: {kind: loot, about: sqlmap}
      - id: leaked
        point: {pane: true}
        check: {kind: answer, of: leaked, about: sqlmap}
      - id: lost
        point: {pane: true}
        check: {kind: answer, of: lost}
lessons:
  - id: waf-exclusion
    order: 2
    text: lesson.board
    level: easy
    minutes: 40
    prerequisites: [read-the-block]
    defense: minimal
    cases:
      - board-sqli-orderby-sqlmap
      - board-sqli-orderby-sqlmap-tamper
      - board-normal-search
      - board-normal-search-with-apostrophe
      - board-normal-post-list
      - board-normal-sort
    theory:
      - {id: paranoia}
      - {id: scoring, shows: find}
      - {id: culprit, shows: rule}
      - {id: fixes}
      - {id: anatomy, shows: exclude}
    hints: [why_rule, why_target, why_file]
    steps:
      - id: search
        site: "/search/?q=O'Brien"
        point: {panel: "#site-address", opens: site}
        check: {kind: alert, marker: browse, path: "O'Brien"}
      - id: find
        point: {kibana: '[data-test-subj="docTableExpandToggleColumn"]', opens: elk}
        query: "url : *Brien* and status : 403"
        check: {kind: click}
      - id: rule
        point: {kibana: '[data-test-subj="field-rule"]', opens: elk}
        check: {kind: answer, accept: ["920273"], known: ["949110"]}
      - id: target
        point:
          kibana: '[data-test-subj="field-transaction.messages.details.data"]'
          first: '[data-test-subj="field-rule"]'
          opens: elk
        check:
          kind: choice
          options: ["ARGS:q", "REQUEST_URI", "REQUEST_COOKIES", "REQUEST_HEADERS"]
          accept: ["ARGS:q"]
      - id: exclude
        point: {pane: true, opens: waf}
        command: |-
          F={waf_rules}
          cp "$F" "$F.bak"
          grep -v '"id:10100,' "$F.bak" > "$F"
          cat >> "$F" <<'EOF'
          SecRule REQUEST_FILENAME "@beginsWith /search/" "id:10100,phase:1,pass,nolog,ctl:ruleRemoveTargetById=920273;ARGS:q"
          EOF
          tail -n 1 "$F"
          if {waf_reload}; then echo reloaded; else cp "$F.bak" "$F"; echo "nginx refused the rule; the previous file is back"; fi
        check:
          kind: waf
          rule_id: 920273
          target: "ARGS:q"
          path: /search/
          case: board-normal-search-with-apostrophe
      - id: retry
        site: "/search/?q=O'Brien"
        point: {panel: "#site-address", opens: site}
        check: {kind: served, case: board-normal-search-with-apostrophe, path: "O'Brien"}
      - id: sqlmap
        point: {pane: true}
        check: {kind: replay, case: board-sqli-orderby-sqlmap, expect: held}
      - id: verify
        point: {panel: "#lesson-verify", tab: check}
        check: {kind: verify}
  - id: console-tour
    order: 0
    text: lesson.tour
    level: easy
    minutes: 15
    prerequisites: []
    defense: full
    cases:
      - board-normal-search
      - board-sqli-search
    theory:
      - {id: panes}
      - {id: record, shows: find}
      - {id: rule, shows: rule}
    hints: [why_403, why_two]
    steps:
      - id: search
        site: "/search/?q=' OR 1=1--"
        point: {panel: "#site-address", opens: site}
        check: {kind: alert, marker: browse, path: "1=1"}
      - id: find
        point: {kibana: '[data-test-subj="docTableExpandToggleColumn"]', opens: elk}
        query: "url : *1=1* and status : 403"
        check: {kind: click}
      - id: rule
        point: {kibana: '[data-test-subj="field-rule"]', opens: elk}
        check: {kind: answer, of: rule, marker: browse, path: "1=1", known: ["949110"]}
      - id: engine
        point: {kibana: '[data-test-subj="field-fsl_source"]', first: '[data-test-subj="field-rule"]', opens: elk}
        check: {kind: choice, options: [modsecurity, suricata], accept: [modsecurity]}
  - id: read-the-block
    order: 1
    text: lesson.read
    level: easy
    minutes: 20
    prerequisites: [console-tour]
    defense: minimal
    cases:
      - board-normal-search-with-apostrophe
      - board-normal-search
    theory:
      - {id: anomaly, shows: total}
      - {id: fields, shows: target}
    hints: [why_total, why_variable]
    steps:
      - id: search
        site: "/search/?q=O'Brien"
        point: {panel: "#site-address", opens: site}
        check: {kind: alert, marker: browse, path: "O'Brien"}
      - id: find
        point: {kibana: '[data-test-subj="docTableExpandToggleColumn"]', opens: elk}
        query: "url : *Brien* and status : 403"
        check: {kind: click}
      - id: rule
        point: {kibana: '[data-test-subj="field-rule"]', opens: elk}
        check: {kind: answer, of: rule, path: "O'Brien", known: ["949110"]}
      - id: target
        point:
          kibana: '[data-test-subj="field-transaction.messages.details.data"]'
          first: '[data-test-subj="field-rule"]'
          opens: elk
        check: {kind: answer, of: target, path: "O'Brien"}
      - id: total
        point: {kibana: '[data-test-subj="field-rule"]', opens: elk}
        check: {kind: choice, options: [total, sqli, charset], accept: [total]}
  - id: choose-the-level
    order: 3
    text: lesson.level
    level: medium
    minutes: 30
    prerequisites: [read-the-block]
    defense: minimal
    controls: [paranoia]
    solved_at: {paranoia: 2}
    cases:
      - board-normal-search-korean
      - board-normal-search-with-apostrophe
      - board-normal-search
      - board-normal-post-list
      - board-normal-sort
      - board-sqli-orderby-sqlmap
      - board-sqli-orderby-sqlmap-tamper
    theory:
      - {id: levels}
      - {id: tradeoff, shows: level}
      - {id: highest}
    hints: [why_korean, why_highest, why_no_exclusion]
    steps:
      - id: search
        site: "/search/?q=\uC11C\uC6B8 \uB9DB\uC9D1 \uCD94\uCC9C"
        point: {panel: "#site-address", opens: site}
        check: {kind: alert, marker: browse, path: "\uC11C\uC6B8"}
      - id: find
        point: {kibana: '[data-test-subj="docTableExpandToggleColumn"]', opens: elk}
        query: "url : *search* and status : 403"
        check: {kind: click}
      - id: rule
        point: {kibana: '[data-test-subj="field-rule"]', opens: elk}
        check: {kind: answer, of: rule, marker: browse, path: "\uC11C\uC6B8", known: ["949110"]}
      - id: level
        point: {panel: "#lesson-level", tab: check}
        check: {kind: level}
      - id: verify
        point: {panel: "#lesson-verify", tab: check}
        check: {kind: verify}
  - id: ids-signature
    order: 4
    text: lesson.ids
    level: medium
    minutes: 45
    prerequisites: [console-tour]
    defense: ids
    detected_by: suricata
    controls: [rules]
    cases:
      - board-normal-sort
      - board-normal-post-list
      - board-sqli-orderby-sqlmap
      - board-sqli-orderby-sqlmap-tamper
    theory:
      - {id: signature, shows: write}
      - {id: buffers}
      - {id: allow, shows: write}
      - {id: corroborate, shows: stock}
      - {id: detect_only}
    hints: [why_quote, why_tamper, why_msg]
    steps:
      - id: payloads
        point: {kibana: '[data-test-subj="docTableExpandToggleColumn"]', opens: elk}
        query: "url : *sort=posts_post.id* and status : 403"
        check: {kind: click}
      - id: write
        point: {panel: "#lesson-rules", tab: check}
        rule: >-
          alert http $EXTERNAL_NET any -> $HOME_NET any (msg:"FSL SQLi attempt - sort is not a column name";
          flow:established,to_server; http.uri; pcre:"/[?&]sort=[-\w.]*[^-\w.&]/i";
          classtype:web-application-attack; sid:9000101; rev:1;)
        check: {kind: rules}
      - id: stock
        check: {kind: detect, case: board-sqli-orderby-sqlmap, expect: alert}
      - id: tamper
        check: {kind: detect, case: board-sqli-orderby-sqlmap-tamper, expect: alert}
      - id: sort
        check: {kind: detect, case: board-normal-sort, expect: quiet}
      - id: verify
        point: {panel: "#lesson-verify", tab: check}
        check: {kind: verify}
  - id: ids-body-xss
    order: 5
    text: lesson.xss
    level: medium
    minutes: 30
    prerequisites: [ids-signature]
    defense: full
    detected_by: suricata
    controls: [rules]
    cases:
      - board-normal-comment
      - board-normal-search
      - board-xss-img-onerror-in-comment
    theory:
      - {id: body, shows: buffer}
      - {id: handlers, shows: write}
    hints: [why_body, why_handler]
    steps:
      - id: buffer
        point: {panel: "#lesson-rules", tab: check}
        check:
          kind: choice
          options: [http.uri, http.request_body, http.header, http.cookie]
          accept: [http.uri]
      - id: write
        point: {panel: "#lesson-rules", tab: check}
        rule: >-
          alert http $EXTERNAL_NET any -> $HOME_NET any (msg:"FSL XSS attempt - script or event handler in request body";
          flow:established,to_server; http.request_body; pcre:"/(<script|javascript:|\bon[a-z]+[\s+]*=)/i";
          classtype:web-application-attack; sid:9000102; rev:1;)
        check: {kind: rules}
      - id: xss
        check: {kind: detect, case: board-xss-img-onerror-in-comment, expect: alert}
      - id: comment
        check: {kind: detect, case: board-normal-comment, expect: quiet}
      - id: verify
        point: {panel: "#lesson-verify", tab: check}
        check: {kind: verify}
  - id: assessment
    order: 7
    text: lesson.exam
    level: hard
    minutes: 40
    prerequisites: [waf-exclusion, choose-the-level]
    defense: minimal
    mode: self
    cases:
      - board-normal-search-with-apostrophe
      - board-normal-search-korean
      - board-normal-search
      - board-normal-post-list
      - board-normal-sort
      - board-sqli-orderby-sqlmap
      - board-sqli-orderby-sqlmap-tamper
