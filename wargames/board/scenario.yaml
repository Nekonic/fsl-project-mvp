name: Community board
description: >-
  An ordinary Django board on MySQL, behind the WAF and the IDS. The attacker
  scores by exfiltrating its auth-user password hashes and proving possession
  against the platform's snapshot.
image: fsl/board:mvp
public_url: http://board.com
objective_model: loot_verified
case_file: board.yaml
category: sql-injection
difficulty: medium
minutes: 40
defense:
  minimal:
    waf: {paranoia: 4}
    suricata: local.rules
  full:
    waf: {paranoia: 1}
    suricata: local.rules
lesson:
  text: lesson.board
  cases:
    - board-sqli-orderby-sqlmap
    - board-sqli-orderby-sqlmap-tamper
    - board-normal-search
    - board-normal-search-with-apostrophe
    - board-normal-post-list
    - board-normal-sort
  steps:
    - id: search
      site: "/search/?q=O'Brien"
      check: {kind: alert, marker: browse, path: "O'Brien"}
    - id: find
      query: "url : *Brien* and status : 403"
      check: {kind: click}
    - id: rule
      check: {kind: answer, accept: ["920273"], known: ["949110"]}
    - id: target
      check:
        kind: choice
        options: ["ARGS:q", "REQUEST_URI", "REQUEST_COOKIES", "REQUEST_HEADERS"]
        accept: ["ARGS:q"]
    - id: exclude
      command: |-
        grep -q 'ruleRemoveTargetById=920273;ARGS:q' /etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf || cat >> /etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf <<'EOF'
        SecRule REQUEST_FILENAME "@beginsWith /search/" "id:10001,phase:1,pass,nolog,ctl:ruleRemoveTargetById=920273;ARGS:q"
        EOF
        tail -n 1 /etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
        nginx -t && nginx -s reload
      check:
        kind: waf
        rule_id: 920273
        target: "ARGS:q"
        path: /search/
        case: board-normal-search-with-apostrophe
    - id: retry
      site: "/search/?q=O'Brien"
      check: {kind: served, case: board-normal-search-with-apostrophe, path: "O'Brien"}
    - id: verify
      check: {kind: verify}
