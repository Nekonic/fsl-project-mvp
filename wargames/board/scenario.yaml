name: Community board
description: >-
  An ordinary Django board on MySQL, behind the WAF and the IDS. The attacker
  scores by exfiltrating its auth-user password hashes and proving possession
  against the platform's snapshot.
image: ghcr.io/nekonic/fsl-board
public_url: http://board.com
objective_model: loot_verified
case_file: board.yaml
category: sql-injection
difficulty: medium
minutes: 40
defense:
  minimal:
    waf: {paranoia: 4}
    suricata: local.rules
  full:
    waf: {paranoia: 1}
    suricata: local.rules
  ids:
    waf: {paranoia: 1}
    suricata: no-uri-sqli.rules
  missed:
    waf:
      paranoia: 1
      exclusions:
        - {rule_id: 949110}
        - {rule_id: 959100}
    suricata: local.rules
  level2:
    waf: {paranoia: 2}
    suricata: local.rules
  level3:
    waf: {paranoia: 3}
    suricata: local.rules
  inherited:
    waf:
      paranoia: 2
      exclusions:
        - {rule_id: 949110}
        - {rule_id: 959100}
    suricata: local.rules
  untuned:
    waf:
      paranoia: 3
      thresholds: {inbound: 10000, outbound: 10000}
    suricata: local.rules
  broken-rule:
    waf: {paranoia: 1}
    suricata: broken-sort.rules
  spelled:
    waf: {paranoia: 1}
    suricata: spaced-sort.rules
default_lesson: waf-exclusion
scenarios:
  - id: "1.1"
    order: 1
    text: scenario.shift
    task_class: judgement
    guidance: worked
    minutes: 15
    window_minutes: 3
    briefing: {situation: scenario.shift.situation, goal: scenario.shift.goal, measured_by: scenario.shift.measured_by}
    defense: level2
    traffic: {profile: community, rate: 2}
    attacks:
      - {at: 150, case: board-sqli-orderby-sqlmap, origin: ru}
    completion: {judged: all}
    cards:
      - {id: evidence, when: start}
      - {id: alert, when: alert}
      - {id: blocked, when: blocked}
      - {id: window, when: window}
    hints: [source, verdict, loot]
    steps:
      - id: open
        point: {panel: '.pane-tab[data-pane="triage"]'}
        check: {kind: click}
      - id: customer
        point: {panel: "#triage-list", opens: triage}
        check: {kind: triage, judged: customer}
      - id: attack
        point: {panel: "#triage-list", opens: triage}
        check: {kind: triage, judged: attack}
      - id: all
        point: {panel: "#triage-list", opens: triage}
        check: {kind: triage, judged: all}
      - id: done
        point: {panel: "#scenario-done"}
        check: {kind: click}
  - id: "2.1"
    order: 4
    text: scenario.korean
    task_class: availability
    guidance: faded
    minutes: 20
    window_minutes: 4
    briefing: {situation: scenario.korean.situation, goal: scenario.korean.goal, measured_by: scenario.korean.measured_by}
    defense: level3
    traffic: {profile: readers, rate: 2}
    attacks:
      - {at: 240, case: board-sqli-orderby-sqlmap, origin: ru}
    completion: {served: all, held: all}
    cards:
      - {id: blocked, when: blocked}
      - {id: narrow, when: alert}
      - {id: window, when: window}
    hints: [find, target, referer, level]
  - id: "1.2"
    order: 2
    text: scenario.inherited
    task_class: judgement
    guidance: faded
    minutes: 15
    window_minutes: 3
    briefing: {situation: scenario.inherited.situation, goal: scenario.inherited.goal, measured_by: scenario.inherited.measured_by}
    defense: inherited
    traffic: {profile: community, rate: 2}
    attacks:
      - {at: 120, case: board-sqli-orderby-sqlmap, origin: ru}
      - {at: 300, case: board-sqli-search, origin: ru}
    completion: {judged: all}
    cards:
      - {id: records, when: start}
      - {id: logged, when: alert}
      - {id: window, when: window}
    hints: [logged, objectives, tried]
  - id: "1.3"
    order: 3
    text: scenario.busy
    task_class: judgement
    guidance: none
    minutes: 20
    window_minutes: 4
    briefing: {situation: scenario.busy.situation, goal: scenario.busy.goal, measured_by: scenario.busy.measured_by}
    defense: inherited
    traffic: {profile: community, rate: 4}
    attacks:
      - {at: 90, case: board-sqli-orderby-sqlmap, origin: kr}
      - {at: 210, case: board-sqli-search, origin: kr}
      - {at: 260, case: board-xss-script-tag-in-search, origin: kr}
      - {at: 330, case: board-sqli-orderby-sqlmap-tamper, origin: kr}
      - {at: 480, case: board-sqli-login-bypass, origin: kr}
      - {at: 540, case: board-sqli-union-search, origin: kr}
      - {at: 600, case: board-path-traversal-static, origin: kr}
      - {at: 660, case: board-xss-img-onerror-in-comment, origin: kr}
    completion: {judged: all, pattern: judged}
    hints: [kinds, succeeded]
  - id: "2.2"
    order: 5
    text: scenario.markup
    task_class: availability
    guidance: faded
    minutes: 20
    window_minutes: 4
    briefing: {situation: scenario.markup.situation, goal: scenario.markup.goal, measured_by: scenario.markup.measured_by}
    defense: level2
    traffic: {profile: community, rate: 2}
    attacks:
      - {at: 240, case: board-sqli-orderby-sqlmap, origin: ru}
    completion: {served: all, held: all}
    cards:
      - {id: blocked, when: blocked}
      - {id: sort, when: alert}
      - {id: window, when: window}
    hints: [rules, scope, sqlmap]
  - id: "2.3"
    order: 6
    text: scenario.threshold
    task_class: availability
    guidance: none
    minutes: 30
    window_minutes: 5
    briefing: {situation: scenario.threshold.situation, goal: scenario.threshold.goal, measured_by: scenario.threshold.measured_by}
    defense: untuned
    traffic: {profile: plain, rate: 2}
    attacks:
      - {at: 600, case: board-sqli-orderby-sqlmap, origin: ru}
    completion: {served: all, held: all, thresholds: {inbound: 5, outbound: 4}}
    hints: [iterate, body]
  - id: "3.1"
    order: 7
    text: scenario.fixrule
    task_class: detection
    guidance: worked
    minutes: 15
    window_minutes: 3
    briefing: {situation: scenario.fixrule.situation, goal: scenario.fixrule.goal, measured_by: scenario.fixrule.measured_by}
    defense: broken-rule
    traffic: {profile: plain, rate: 2}
    attacks:
      - {at: 120, case: board-sqli-orderby-sqlmap, origin: ru}
    completion: {detected_by: suricata}
    cards:
      - {id: detect, when: start}
      - {id: window, when: window}
    hints: [buffer, apply]
    steps:
      - id: rules
        point: {panel: '.pane-tab[data-pane="rules"]'}
        check: {kind: click}
      - id: buffer
        point: {panel: "#lesson-rules", opens: rules}
        check: {kind: choice, options: [http.uri, http.request_body, http.header, http.cookie], accept: [http.uri]}
      - id: fix
        point: {panel: "#lesson-rules", opens: rules}
        rule: >-
          alert http $EXTERNAL_NET any -> $HOME_NET any (msg:"FSL SQLi attempt - sort is not a column name";
          flow:established,to_server; http.uri; pcre:"/[?&]sort=[-\w.]*[^-\w.&]/i";
          classtype:web-application-attack; sid:9000102; rev:1;)
        check: {kind: rules}
      - id: done
        point: {panel: "#scenario-done"}
        check: {kind: click}
  - id: "3.2"
    order: 8
    text: scenario.writerule
    task_class: detection
    guidance: faded
    minutes: 20
    window_minutes: 4
    briefing: {situation: scenario.writerule.situation, goal: scenario.writerule.goal, measured_by: scenario.writerule.measured_by}
    defense: ids
    traffic: {profile: plain, rate: 2}
    attacks:
      - {at: 120, case: board-sqli-orderby-sqlmap, origin: ru}
    completion: {detected_by: suricata}
    cards:
      - {id: missed, when: alert}
      - {id: sort, when: start}
      - {id: window, when: window}
    hints: [where, allow, msg]
  - id: "3.3"
    order: 9
    text: scenario.tamper
    task_class: detection
    guidance: faded
    minutes: 20
    window_minutes: 4
    briefing: {situation: scenario.tamper.situation, goal: scenario.tamper.goal, measured_by: scenario.tamper.measured_by}
    defense: spelled
    traffic: {profile: plain, rate: 2}
    attacks:
      - {at: 120, case: board-sqli-orderby-sqlmap, origin: ru}
      - {at: 300, case: board-sqli-orderby-sqlmap-tamper, origin: ru}
    completion: {detected_by: suricata}
    cards:
      - {id: variant, when: alert}
      - {id: window, when: window}
    hints: [compare, allow]
  - id: "3.4"
    order: 10
    text: scenario.body
    task_class: detection
    guidance: none
    minutes: 15
    window_minutes: 3
    briefing: {situation: scenario.body.situation, goal: scenario.body.goal, measured_by: scenario.body.measured_by}
    defense: full
    traffic: {profile: plain, rate: 2}
    attacks:
      - {at: 120, case: board-xss-img-onerror-in-comment, origin: ru}
      - {at: 240, case: board-xss-script-tag-in-search, origin: ru}
    completion: {detected_by: suricata}
    hints: [buffer, handler]
  - id: "4.1"
    order: 11
    text: scenario.unknown
    task_class: unknown
    guidance: none
    minutes: 25
    window_minutes: 5
    briefing: {situation: scenario.unknown.situation, goal: scenario.unknown.goal, measured_by: scenario.unknown.measured_by}
    defense: full
    traffic: {profile: club, rate: 2}
    attacks:
      - {at: 300, case: board-sqli-orderby-sqlmap-versioned, origin: us}
      - {at: 600, case: board-sqli-orderby-sqlmap, origin: us}
    completion: {served: all, held: all}
foundations:
  - id: f1
    order: 1
    text: lesson.range
    level: easy
    minutes: 10
    prerequisites: []
    defense: full
    cases: [board-normal-search]
    theory:
      - {id: map, shows: map}
    hints: [why_entry]
    steps:
      - id: map
        point: {panel: '.pane-tab[data-pane="topology"]'}
        check: {kind: click}
      - id: entry
        point: {pane: true, opens: topology}
        check: {kind: answer, of: entry}
      - id: logs
        point: {pane: true, opens: topology}
        check: {kind: answer, of: logs}
      - id: segment
        point: {pane: true, opens: topology}
        check: {kind: answer, of: segment}
  - id: f2
    order: 2
    text: lesson.follow
    level: easy
    minutes: 15
    prerequisites: [f1]
    defense: full
    cases: [board-normal-search]
    theory:
      - {id: path, shows: follow}
    hints: [why_source]
    steps:
      - id: search
        site: "/search/?q=\uC11C\uC6B8 \uB9DB\uC9D1 \uCD94\uCC9C"
        point: {panel: "#site-address", opens: site}
        check: {kind: sent, match: '[\uAC00-\uD7A3]'}
      - id: follow
        point: {panel: "#topology-request", opens: topology}
        check: {kind: click}
      - id: source
        point: {panel: "#topology-hops", opens: topology}
        check: {kind: answer, of: source, about: search}
      - id: port
        point: {panel: "#topology-hops", opens: topology}
        check: {kind: answer, of: port, about: search}
      - id: status
        point: {panel: "#topology-hops", opens: topology}
        check: {kind: answer, of: status, about: search}
  - id: f3
    order: 3
    text: lesson.http
    level: easy
    minutes: 10
    prerequisites: [f2]
    defense: full
    cases: [board-normal-search]
    theory:
      - {id: request, shows: method}
    hints: [why_parameter]
    steps:
      - id: search
        site: "/search/?q=\uC11C\uC6B8 \uB9DB\uC9D1 \uCD94\uCC9C"
        point: {panel: "#site-address", opens: site}
        check: {kind: sent, match: '[\uAC00-\uD7A3]'}
      - id: method
        point: {panel: "#site-dev-toggle", opens: site}
        check: {kind: answer, of: method, about: search}
      - id: path
        point: {panel: "#site-address", opens: site}
        check: {kind: answer, of: path, about: search}
      - id: parameter
        point: {panel: "#site-address", opens: site}
        check: {kind: answer, of: parameter, about: search}
      - id: meaning
        point: {panel: "#site-dev-toggle", opens: site}
        check: {kind: choice, of: status_class, about: search, options: [2xx, 3xx, 4xx, 5xx]}
  - id: f4
    order: 4
    text: lesson.logs
    level: easy
    minutes: 15
    prerequisites: [f3]
    defense: full
    cases: [board-normal-search]
    theory:
      - {id: records, shows: engine}
    hints: [why_one_engine]
    steps:
      - id: search
        site: "/search/?q=\uC11C\uC6B8 \uB9DB\uC9D1 \uCD94\uCC9C"
        point: {panel: "#site-address", opens: site}
        check: {kind: sent, match: '[\uAC00-\uD7A3]'}
      - id: engine
        point: {pane: true, opens: elk}
        query: 'event_type : "http" and url : *search*'
        records: all
        check: {kind: choice, of: engine, about: search, options: [modsecurity, suricata]}
      - id: probe
        site: "/search/?q=<script>alert(1)</script>"
        point: {panel: "#site-address", opens: site}
        check: {kind: sent, match: script}
      - id: find
        point: {kibana: '[data-test-subj="docTableExpandToggleColumn"]', opens: elk}
        query: "url : *script* and status : 403"
        check: {kind: click}
      - id: verdict
        point: {kibana: '[data-test-subj="field-status"]', first: '[data-test-subj="docTableExpandToggleColumn"]', opens: elk}
        check: {kind: answer, of: status, about: probe}
      - id: address
        point: {kibana: '[data-test-subj="field-source_ip"]', first: '[data-test-subj="docTableExpandToggleColumn"]', opens: elk}
        check: {kind: answer, of: waf_source, about: probe}
  - id: f5
    order: 5
    text: lesson.attack
    level: easy
    minutes: 25
    prerequisites: [f4]
    defense: full
    cases: [board-normal-search]
    theory:
      - {id: attack, shows: stopped}
    hints: [why_total, why_count]
    steps:
      - id: attack
        site: "/search/?q=' OR 1=1--"
        point: {panel: "#site-address", opens: site}
        check: {kind: sent, match: "1=1"}
      - id: follow
        point: {panel: "#topology-request", opens: topology}
        check: {kind: click}
      - id: stopped
        point: {panel: "#topology-hops", opens: topology}
        check: {kind: answer, of: stopped_at, about: attack}
      - id: rule
        point: {panel: "#topology-hops", opens: topology}
        check: {kind: answer, of: rule, marker: browse, path: "1=1", known: ["949110"]}
      - id: sqlmap
        point: {pane: true}
        check: {kind: kali, case: board-sqli-orderby-sqlmap}
      - id: requests
        point: {pane: true}
        check: {kind: answer, of: requests, about: sqlmap}
  - id: f6
    order: 6
    text: lesson.miss
    level: medium
    minutes: 25
    prerequisites: [f5]
    defense: missed
    cases: [board-normal-search]
    theory:
      - {id: cost, shows: lost}
    hints: [why_leak]
    steps:
      - id: excluded
        point: {pane: true, opens: waf}
        command: cat {waf_rules}
        check: {kind: answer, of: excluded}
      - id: sqlmap
        point: {pane: true}
        check: {kind: kali, case: board-sqli-orderby-sqlmap}
      - id: loot
        point: {pane: true}
        check: {kind: loot, about: sqlmap}
      - id: leaked
        point: {pane: true}
        check: {kind: answer, of: leaked, about: sqlmap}
      - id: lost
        point: {pane: true}
        check: {kind: answer, of: lost}
lessons:
  - id: waf-exclusion
    order: 2
    text: lesson.board
    level: easy
    minutes: 40
    prerequisites: [read-the-block]
    defense: minimal
    cases:
      - board-sqli-orderby-sqlmap
      - board-sqli-orderby-sqlmap-tamper
      - board-normal-search
      - board-normal-search-with-apostrophe
      - board-normal-post-list
      - board-normal-sort
    theory:
      - {id: paranoia}
      - {id: scoring, shows: find}
      - {id: culprit, shows: rule}
      - {id: fixes}
      - {id: anatomy, shows: exclude}
    hints: [why_rule, why_target, why_file]
    steps:
      - id: search
        site: "/search/?q=O'Brien"
        point: {panel: "#site-address", opens: site}
        check: {kind: alert, marker: browse, path: "O'Brien"}
      - id: find
        point: {kibana: '[data-test-subj="docTableExpandToggleColumn"]', opens: elk}
        query: "url : *Brien* and status : 403"
        check: {kind: click}
      - id: rule
        point: {kibana: '[data-test-subj="field-rule"]', opens: elk}
        check: {kind: answer, accept: ["920273"], known: ["949110"]}
      - id: target
        point:
          kibana: '[data-test-subj="field-transaction.messages.details.data"]'
          first: '[data-test-subj="field-rule"]'
          opens: elk
        check:
          kind: choice
          options: ["ARGS:q", "REQUEST_URI", "REQUEST_COOKIES", "REQUEST_HEADERS"]
          accept: ["ARGS:q"]
      - id: exclude
        point: {pane: true, opens: waf}
        command: |-
          F={waf_rules}
          cp "$F" "$F.bak"
          grep -v '"id:10100,' "$F.bak" > "$F"
          cat >> "$F" <<'EOF'
          SecRule REQUEST_FILENAME "@beginsWith /search/" "id:10100,phase:1,pass,nolog,ctl:ruleRemoveTargetById=920273;ARGS:q"
          EOF
          tail -n 1 "$F"
          if {waf_reload}; then echo reloaded; else cp "$F.bak" "$F"; echo "nginx refused the rule; the previous file is back"; fi
        check:
          kind: waf
          rule_id: 920273
          target: "ARGS:q"
          path: /search/
          case: board-normal-search-with-apostrophe
      - id: retry
        site: "/search/?q=O'Brien"
        point: {panel: "#site-address", opens: site}
        check: {kind: served, case: board-normal-search-with-apostrophe, path: "O'Brien"}
      - id: sqlmap
        point: {pane: true}
        check: {kind: replay, case: board-sqli-orderby-sqlmap, expect: held}
      - id: verify
        point: {panel: "#lesson-verify", tab: check}
        check: {kind: verify}
  - id: console-tour
    order: 0
    text: lesson.tour
    level: easy
    minutes: 15
    prerequisites: []
    defense: full
    cases:
      - board-normal-search
      - board-sqli-search
    theory:
      - {id: panes}
      - {id: record, shows: find}
      - {id: rule, shows: rule}
    hints: [why_403, why_two]
    steps:
      - id: search
        site: "/search/?q=' OR 1=1--"
        point: {panel: "#site-address", opens: site}
        check: {kind: alert, marker: browse, path: "1=1"}
      - id: find
        point: {kibana: '[data-test-subj="docTableExpandToggleColumn"]', opens: elk}
        query: "url : *1=1* and status : 403"
        check: {kind: click}
      - id: rule
        point: {kibana: '[data-test-subj="field-rule"]', opens: elk}
        check: {kind: answer, of: rule, marker: browse, path: "1=1", known: ["949110"]}
      - id: engine
        point: {kibana: '[data-test-subj="field-fsl_source"]', first: '[data-test-subj="field-rule"]', opens: elk}
        check: {kind: choice, options: [modsecurity, suricata], accept: [modsecurity]}
  - id: read-the-block
    order: 1
    text: lesson.read
    level: easy
    minutes: 20
    prerequisites: [console-tour]
    defense: minimal
    cases:
      - board-normal-search-with-apostrophe
