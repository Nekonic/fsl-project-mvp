# The board's customers: a Korean community whose readers browse, search,
# sign in and comment for as long as a session runs. Korean text is written as
# \u escapes (CLAUDE.md keeps Korean out of repo files other than four).
#
# Searches and comments go through the board's own forms. Sign-in and comments
# are form posts that carry the page's CSRF token, as a browser sends them; a
# JSON post is refused by Django's CSRF check (403, measured 2026-10-13).
# The unusual searches are ones real readers type; at paranoia level 2 CRS
# refuses the markup (941320) and the link (931130) and serves C++ & C#
# (measured 2026-10-13). The code comments are a security
# club's questions about SQL and templates; CRS refuses them at paranoia level
# 1 (942100, 942190, 941100, 941110, 941160 on ARGS:body, measured 2026-10-13).

