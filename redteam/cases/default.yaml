# Attack and benign traffic live in one file. Splitting them makes it easy to
# forget the benign half, and without it a block-everything rule scores 100%.
#
# `expect` is what should be able to detect the attack: a substring of the
# alert signature, matched case-insensitively against everything attributed to
# the case. A true positive whose only evidence fails this is detected for the
# wrong reason, and the score says so instead of taking the credit. The values
# were read off the signatures both engines actually produce, not guessed -
# Suricata says "SQLi", ModSecurity says "SQL Injection", so "SQL" covers both.

# -- attacks ---------------------------------------------------------------
- name: sqli-login-bypass
  malicious: true
  technique: SQLi
  expect: "SQL"
  correlation: marker
  request:
    method: POST
    path: /rest/user/login
    json:
      email: "' OR 1=1--"
      password: "anything"

# Nine columns because that is what the products query selects; with the wrong
# count Juice Shop errors, the IDS still alerts, and the attack takes nothing.
# An attack that trips a rule and achieves nothing is not an attack.
- name: sqli-union-user-table
  malicious: true
  technique: SQLi
  expect: "SQL"
  takes: unionSqlInjectionChallenge
  correlation: marker
  request:
    method: GET
    path: /rest/products/search
    params:
      q: "')) UNION SELECT id,email,password,'4','5','6','7','8','9' FROM Users--"

- name: xss-script-tag-in-search
  malicious: true
  technique: XSS
  expect: "XSS"
  correlation: marker
  request:
    method: GET
    path: /rest/products/search
    params:
      q: "<script>alert(1)</script>"

- name: xss-img-onerror
  malicious: true
  technique: XSS
  expect: "XSS"
  correlation: marker
  request:
    method: GET
    path: /rest/products/search
    params:
      q: "<img src=x onerror=alert(1)>"

# A literal `..` makes requests normalise the path before sending, so nothing
# attacks anything. %2e%2e is sent verbatim and the WAF and IDS read it the same.
- name: path-traversal-ftp
  malicious: true
  technique: PathTraversal
  expect: "traversal"
  correlation: marker
  request:
    method: GET
    path: /ftp/%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2fetc/passwd

# External tool: run as a container instead of building the request here. The
# harness substitutes {target}, since inside the fsl network localhost is not it.
- name: sqlmap-boolean-blind
  malicious: true
  technique: SQLi
  expect: "SQL"
  correlation: marker
  tool: sqlmap
  args:
    - "-u"
    - "{target}/rest/products/search?q=1"
    - "--batch"
    - "--level=1"
    - "--risk=1"
    - "--technique=B"
    - "--flush-session"
    - "--disable-coloring"

# -- benign ----------------------------------------------------------------
# The basis for scoring false positives. Deliberately seeded with strings CRS
# tends to over-react to.
# Objectives the target judges for itself. These take something rather than
# only tripping a rule, which is the difference between an attack and noise.
# Every `takes` value was read off the live catalogue - Juice Shop's keys and
# its display names disagree, so "Confidential Document" is directoryListing.

# No `expect` on the next two, and not by omission: both are plain GETs of
# files the shop should not serve, so there is no mechanism a signature could
# name. They go undetected, which is the honest answer and the most useful
# thing on the board - an objective taken with nobody watching.
- name: confidential-document-access
  malicious: true
  technique: BrokenAccessControl
  takes: directoryListingChallenge
  correlation: marker
  request:
    method: GET
    path: /ftp/acquisitions.md

- name: metrics-endpoint-scrape
  malicious: true
  technique: SensitiveDataExposure
  takes: exposedMetricsChallenge
  correlation: marker
  request:
    method: GET
    path: /metrics

# %2500 is a double-encoded null byte: the path arrives as package.json.bak%00.md
# and the extension whitelist is fooled into serving the backup. Sent verbatim -
# see check_path_preserved.
- name: backup-file-null-byte
  malicious: true
  technique: NullByte
  expect: "Restricted File"
  takes: forgottenDevBackupChallenge
  correlation: marker
  request:
    method: GET
    path: /ftp/package.json.bak%2500.md

- name: normal-product-search
  malicious: false
  correlation: marker
  request:
    method: GET
    path: /rest/products/search
    params:
      q: "apple juice"

- name: normal-login-attempt
  malicious: false
