# Attack and benign traffic live in one file. Splitting them makes it easy to
# forget the benign half, and without it a block-everything rule scores 100%.

# -- attacks ---------------------------------------------------------------
- name: sqli-login-bypass
  malicious: true
  technique: SQLi
  correlation: marker
  request:
    method: POST
    path: /rest/user/login
    json:
      email: "' OR 1=1--"
      password: "anything"

- name: sqli-union-in-search
  malicious: true
  technique: SQLi
  correlation: marker
  request:
    method: GET
    path: /rest/products/search
    params:
      q: "apple')) UNION SELECT NULL,NULL,NULL--"

- name: xss-script-tag-in-search
  malicious: true
  technique: XSS
  correlation: marker
  request:
    method: GET
    path: /rest/products/search
    params:
      q: "<script>alert(1)</script>"

- name: xss-img-onerror
  malicious: true
  technique: XSS
  correlation: marker
  request:
    method: GET
    path: /rest/products/search
    params:
      q: "<img src=x onerror=alert(1)>"

# A literal `..` makes requests normalise the path before sending, so nothing
# attacks anything. %2e%2e is sent verbatim and the WAF and IDS read it the same.
- name: path-traversal-ftp
  malicious: true
  technique: PathTraversal
  correlation: marker
  request:
    method: GET
    path: /ftp/%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2fetc/passwd

# External tool: run as a container instead of building the request here. The
# harness substitutes {target}, since inside the fsl network localhost is not it.
- name: sqlmap-boolean-blind
  malicious: true
  technique: SQLi
  correlation: marker
  tool: sqlmap
  args:
    - "-u"
    - "{target}/rest/products/search?q=1"
    - "--batch"
    - "--level=1"
    - "--risk=1"
    - "--technique=B"
    - "--flush-session"
    - "--disable-coloring"

# -- benign ----------------------------------------------------------------
# The basis for scoring false positives. Deliberately seeded with strings CRS
# tends to over-react to.
- name: normal-product-search
  malicious: false
  correlation: marker
  request:
    method: GET
    path: /rest/products/search
    params:
      q: "apple juice"

- name: normal-login-attempt
  malicious: false
  correlation: marker
  request:
    method: POST
    path: /rest/user/login
    json:
      email: "customer@juice-sh.op"
      password: "correct horse battery staple"

- name: normal-search-with-apostrophe
  malicious: false
  correlation: marker
  request:
    method: GET
    path: /rest/products/search
    params:
      q: "O'Brien's lemonade"

- name: normal-search-select-as-a-word
  malicious: false
  correlation: marker
  request:
    method: GET
    path: /rest/products/search
    params:
      q: "select the best juice for me"

- name: normal-product-reviews
  malicious: false
  correlation: marker
  request:
    method: GET
    path: /rest/products/1/reviews

- name: normal-application-version
  malicious: false
  correlation: marker
  request:
    method: GET
    path: /rest/admin/application-version
