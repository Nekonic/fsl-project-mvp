# The community board is an ordinary Django site on MySQL. It ships no
# challenges and keeps no score, and no case here carries `takes:`. Most of
# these attacks fail against the app itself: the ORM parameterises queries and
# the templates escape output. The exception is the `?sort=` order_by injection
# (CVE-2021-35042), which reaches the raw ORDER BY. board-sqli-orderby-sqlmap
# fires sqlmap at it as a detected probe; sqlmap's stock payloads do not finish
# the dump there, so extraction and submission to /loot/ are manual.
#
# Benign cases matter as much as the attacks. Without them a rule that blocks
# everything scores perfectly. `normal-search-with-apostrophe` is the one that
# separates a rule keyed on a quote from one keyed on injection.

# -- attacks ---------------------------------------------------------------
- name: board-sqli-search
  malicious: true
  stage: initial-compromise
  technique: T1190
  pattern: CAPEC-66
  expect: "SQL"
  correlation: marker
  request:
    method: GET
    path: /search/
    params:
      q: "' OR 1=1--"

- name: board-sqli-login-bypass
  malicious: true
  stage: initial-compromise
  technique: T1190
  pattern: CAPEC-66
  expect: "SQL"
  correlation: marker
  request:
    method: POST
    path: /accounts/login/
    json:
      username: "' OR 1=1--"
      password: "anything"

- name: board-sqli-union-search
  malicious: true
  stage: initial-compromise
  technique: T1190
  pattern: CAPEC-66
  expect: "SQL"
  correlation: marker
  request:
    method: GET
    path: /search/
    params:
      q: "x' UNION SELECT username,password,3 FROM auth_user--"

- name: board-sqli-orderby-sqlmap
  malicious: true
  stage: initial-compromise
  technique: T1190
  pattern: CAPEC-66
  expect: "SQL"
  correlation: marker
  tool: sqlmap
  args: ["-u", "{target}/?sort=created_at", "-p", "sort",
         "--technique=BT", "--dbms=mysql", "--level=3",
         "--dump", "-T", "auth_user", "-C", "username,password", "--batch"]

- name: board-xss-script-tag-in-search
  malicious: true
  stage: initial-compromise
  technique: T1190
  pattern: CAPEC-63
  expect: "XSS"
  correlation: marker
  request:
    method: GET
    path: /search/
    params:
      q: "<script>alert(1)</script>"

- name: board-xss-img-onerror-in-comment
  malicious: true
  stage: initial-compromise
  technique: T1190
  pattern: CAPEC-63
  expect: "XSS"
  correlation: marker
  request:
    method: POST
    path: /posts/1/comments/
    json:
      body: "<img src=x onerror=alert(1)>"

- name: board-path-traversal-static
  malicious: true
  stage: complete-mission
  technique: T1190
  pattern: CAPEC-126
  expect: "traversal"
  correlation: marker
  request:
    method: GET
    path: /static/%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2fetc/passwd

# -- benign ----------------------------------------------------------------
- name: board-normal-search
  malicious: false
  correlation: marker
  request:
    method: GET
    path: /search/
    params:
      q: "release notes"

- name: board-normal-search-with-apostrophe
  malicious: false
  correlation: marker
  request:
    method: GET
    path: /search/
    params:
      q: "O'Brien"

- name: board-normal-post-list
  malicious: false
  correlation: marker
  request:
    method: GET
    path: /
