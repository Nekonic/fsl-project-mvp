- name: corp-normal-home
  malicious: false
  correlation: marker
  request:
    method: GET
    path: /

- name: corp-normal-registration-page
  malicious: false
  correlation: marker
  request:
    method: GET
    path: /wp-login.php
    params:
      action: register

- name: corp-normal-search
  malicious: false
  correlation: marker
  request:
    method: GET
    path: /
    params:
      s: "quarterly report"

- name: corp-normal-registration
  malicious: false
  correlation: marker
  request:
    method: POST
    path: /register/
    prefetch:
      from: /register/
      pattern: 'name="_wpnonce" value="([a-f0-9]+)"'
    data:
      form_id: "4"
      _wpnonce: "{nonce}"
      um_request: ""
      _wp_http_referer: "/register/"
      "user_login-4": "newcomer"
      "first_name-4": "New"
      "last_name-4": "Comer"
      "user_email-4": "newcomer@example.com"
      "user_password-4": "Welcome-2026-aA"
      "confirm_user_password-4": "Welcome-2026-aA"

