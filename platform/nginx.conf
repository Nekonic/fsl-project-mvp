worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {}

http {
    access_log off;
    client_max_body_size 10m;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    include /tmp/pf-resolved.conf;

    server {
        listen 8080;

        location / {
            if ($pf_cookie = "") { return 503; }
            proxy_pass $pf_upstream$request_uri;
            proxy_set_header Host $pf_host;
            proxy_set_header Cookie $pf_cookie;
            proxy_set_header Referer "";
            proxy_set_header Accept-Encoding "";
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Set-Cookie;
            sub_filter 'if (top != self) {top.location.href = self.location.href;}' '';
            sub_filter_once off;
            proxy_read_timeout 1h;
        }
    }

    server {
        listen 8000 default_server;

        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 1h;
        }

        location /kibana/ {
            set $kibana http://kibana:5601;
            proxy_pass $kibana;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 1h;
        }

        location /vm-terminal/fsl-kali/ {
            auth_request /terminal-allowed;
            proxy_pass http://127.0.0.1:7691;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 1d;
        }

        location /vm-terminal/fsl-waf/ {
            auth_request /terminal-allowed;
            proxy_pass http://127.0.0.1:7692;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 1d;
        }

        location /terminal/ {
            auth_request /terminal-allowed;
            set $terminal http://kali:7681;
            proxy_pass $terminal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 1d;
        }

        location = /terminal-allowed {
            internal;
            proxy_pass http://127.0.0.1:8001/api/attacker/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
