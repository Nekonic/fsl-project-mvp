worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {}

http {
    access_log off;
    client_max_body_size 10m;
    client_body_buffer_size 1m;
    proxy_max_temp_file_size 0;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    map $request_uri $site_uri {
        ~^/site/\d+/[^/?]+(?<site_tail>/[^?]*(\?.*)?)$ $site_tail;
        default /;
    }

    server {
        listen 8000 default_server;

        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 1h;
        }

        location /site-proxy/ {
            return 404;
        }

        location ~ ^/kibana/s/(?<kibana_current>[a-z0-9-]+)/api/spaces/space$ {
            if ($request_method != GET) {
                return 403;
            }
            default_type application/json;
            return 200 '[{"id":"$kibana_current","name":"SOC","disabledFeatures":[]}]';
        }

        location ~ ^/kibana/(?:s/[^/]+/)?(?:api/(?:console|ingest_pipelines|index_management|snapshot_restore|transform|rollup|remote_clusters|license|upgrade_assistant|index_lifecycle_management|watcher|data_views|index_patterns(?!/has_user_index_pattern(?:/|$))|security|spaces|kibana/settings|kibana/management|saved_objects/_import|saved_objects/_export|saved_objects/_resolve_import_errors)(?:/|$)|internal/(?:index_management|ingest_pipelines|snapshot_restore|transform|rollup|remote_clusters|license_management|upgrade_assistant|ilm|watcher)(?:/|$)|internal/spaces/(?!_active_space)) {
            return 403;
        }

        location ~ ^/kibana/(?:s/[^/]+/)?internal/kibana/settings$ {
            limit_except GET {
                deny all;
            }
            set $kibana http://kibana:5601;
            proxy_pass $kibana;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        location ~ ^/kibana/(?:app|spaces)(?:/|$) {
            return 403;
        }

        location ~ ^/kibana/(?<kibana_space>s/[^/]+/)?app/(management|dev_tools|home)(/|$) {
            absolute_redirect off;
            return 302 /kibana/${kibana_space}app/discover;
        }

        location /kibana/ {
            if ($args ~* "(^|&)namespaces=") {
                return 403;
            }
            set $kibana http://kibana:5601;
            proxy_pass $kibana;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 1h;
        }

        location /vm-terminal/kali/ {
            auth_request /terminal-allowed;
            proxy_pass http://127.0.0.1:7691;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 1d;
        }

        location /vm-terminal/waf/ {
            auth_request /terminal-allowed;
            proxy_pass http://127.0.0.1:7692;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 1d;
        }

        location ~ ^/terminal/(?<session>\d+)/(?<rest>.*)$ {
            auth_request /terminal-allowed;
            set $terminal http://fsl-$session-kali-1:7681;
            proxy_pass $terminal/terminal/$rest$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 1d;
        }

        location ~ ^/waf-terminal/(?<session>\d+)/(?<rest>.*)$ {
            auth_request /terminal-allowed;
            proxy_pass http://127.0.0.1:7693/waf-terminal/$rest?arg=$session;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 1d;
        }

        location /terminal/ {
            auth_request /terminal-allowed;
            set $terminal http://kali:7681;
            proxy_pass $terminal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 1d;
        }

        location = /terminal-allowed {
            internal;
            proxy_pass http://127.0.0.1:8001/api/attacker/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    server {
        listen 8002;
        absolute_redirect off;

        location ~ ^/site/(?<session>\d+)/(?<site>[a-z0-9.-]+)(/.*)?$ {
            auth_request /terminal-allowed;
            proxy_pass http://127.0.0.1:8001/site-proxy/$session/$site/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Site-Uri $site_uri;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Cookie "";
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Set-Cookie;
            add_header Content-Security-Policy "sandbox allow-forms allow-scripts allow-same-origin" always;
            proxy_redirect ~^https?://[^/]+(/.*)?$ /site/$session/$site$1;
            proxy_redirect ~^(/.*)$ /site/$session/$site$1;
            sub_filter_once off;
            sub_filter 'http://$site/' '/site/$session/$site/';
            sub_filter 'http://$site"' '/site/$session/$site/"';
            sub_filter 'http:\/\/$site\/' '\/site\/$session\/$site\/';
            sub_filter 'href="/' 'href="/site/$session/$site/';
            sub_filter 'src="/' 'src="/site/$session/$site/';
            sub_filter 'action="/' 'action="/site/$session/$site/';
            sub_filter '</body>' '<script>(function(){var p=parent,w=null,id=null,at=null,f=0;function own(o){try{var a=location.ancestorOrigins;return a&&a.length?o===a[0]:new URL(o).hostname===location.hostname}catch(e){return false}}function near(e,r){var o=[],l=document.body.querySelectorAll("*"),i,c,b,g;for(i=0;i<l.length&&o.length<60;i++){c=l[i];if(c===e||c.firstElementChild||e.contains(c)||["SCRIPT","STYLE","NOSCRIPT"].indexOf(c.tagName)>=0)continue;if(["INPUT","IMG","SELECT","TEXTAREA"].indexOf(c.tagName)>=0)b=c.getBoundingClientRect();else{g=document.createRange();g.selectNodeContents(c);b=g.getBoundingClientRect()}if(b.width>0&&b.height>0&&(c.textContent.trim()||["INPUT","IMG","SELECT","TEXTAREA"].indexOf(c.tagName)>=0)&&b.bottom>r.top-200&&b.top<r.bottom+200)o.push({x:b.left,y:b.top,w:b.width,h:b.height})}return o}function send(){f=0;if(!w)return;var e=document.querySelector(w),r=e&&e.getBoundingClientRect();p.postMessage({located:id,rect:r?{x:r.left,y:r.top,w:r.width,h:r.height}:null,text:r?near(e,r):[]},at)}function soon(){if(w&&!f){f=1;requestAnimationFrame(send)}}addEventListener("message",function(m){var d=m.data;if(m.source!==p||!d||typeof d!=="object"||!("locate" in d)||!own(m.origin))return;w=null;if(typeof d.locate!=="string"||!d.locate)return;id=d.id;at=m.origin;try{document.querySelector(d.locate);w=d.locate}catch(e){p.postMessage({located:id,rect:null},at);return}send()});var base="/site/$session/$site/",named="http://$site/";function named_link(a){var h=a.getAttribute("href");if(h&&h.indexOf(base)===0)a.setAttribute("href",named+h.slice(base.length))}function anchor(e){return e.target&&e.target.closest?e.target.closest("a[href]"):null}Array.prototype.forEach.call(document.querySelectorAll("a[href]"),named_link);["mouseover","focusin"].forEach(function(n){addEventListener(n,function(e){var a=anchor(e);if(a)named_link(a)},true)});addEventListener("click",function(e){var a=anchor(e),h=a&&a.getAttribute("href");if(!h||e.defaultPrevented||e.button||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey||h.indexOf(named)!==0)return;e.preventDefault();location.href=base+h.slice(named.length)},true);addEventListener("scroll",soon,true);addEventListener("resize",soon);addEventListener("keydown",function(e){if(e.key==="F12"){e.preventDefault();p.postMessage({key:"F12"},"*")}});p.postMessage({site:location.pathname+location.search},"*")})()</script></body>';
            proxy_read_timeout 1m;
        }

        location = /terminal-allowed {
            internal;
            proxy_pass http://127.0.0.1:8001/api/attacker/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location / {
            return 404;
        }
    }
}
