worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {}

http {
    access_log off;
    client_max_body_size 10m;
    client_body_buffer_size 1m;
    proxy_max_temp_file_size 0;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    proxy_cache_path /tmp/nginx-signed-in levels=1 keys_zone=signed_in:1m max_size=16m inactive=1m use_temp_path=off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    map $request_uri $site_uri {
        ~^/site/\d+/[^/?]+(?<site_tail>/[^?]*(\?.*)?)$ $site_tail;
        default /;
    }

    map $request_uri $session_asked {
        ~^/site/(?<asked_site>\d+)/ site:$asked_site;
        ~^/vm-terminal/[^?]*\?(?<asked_query>.*)$ terminal:$asked_query;
        ~^/vm-terminal/ terminal:;
        ~*^/kibana/s/(?<asked_space>[^/?]+) kibana:$asked_space;
        default "";
    }

    geo $from_the_platform_host {
        default 0;
        127.0.0.0/8 1;
        172.31.0.1 1;
        include /tmp/nginx-platform-addresses.conf;
    }

    map $from_the_platform_host $limited_address {
        1 "";
        default $binary_remote_addr;
    }

    map "$from_the_platform_host:$cookie_cr_session" $limited_client {
        ~^1: "";
        "0:" $binary_remote_addr;
        default $cookie_cr_session;
    }

    map "$from_the_platform_host:$request_method" $limited_poster {
        "0:POST" $binary_remote_addr;
        default "";
    }

    limit_req_zone $limited_poster zone=sign_in:1m rate=5r/m;
    limit_req_zone $limited_poster zone=sign_up:1m rate=1r/m;
    limit_req_zone $limited_client zone=api_client:10m rate=20r/s;
    limit_req_zone $limited_address zone=api_address:10m rate=100r/s;
    limit_conn_zone $limited_client zone=held_open:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 8000 default_server;
        error_page 429 = @too-many;

        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 1h;
        }

        location /api/ {
            limit_req zone=api_client burst=40 nodelay;
            limit_req zone=api_address burst=200 nodelay;
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 1h;
        }

        location = /api/auth/login/ {
            limit_req zone=sign_in burst=5 nodelay;
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location = /api/auth/signup/ {
            limit_req zone=sign_up burst=3 nodelay;
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location @too-many {
            default_type application/json;
            return 429 '{"detail": "too many requests from this client; slow down", "throttled": true}';
        }

        location /static/map/ {
            alias /app/console/static/map/;
            types {
                text/javascript js;
                image/svg+xml svg;
            }
            default_type text/plain;
            add_header X-Content-Type-Options nosniff;
            expires 1h;
        }

        location /site-proxy/ {
            return 404;
        }

        location /auth-check/ {
            return 404;
        }

        location @sign-in {
            return 302 /login/?next=$request_uri;
        }

        location /kibana-gate/ {
            return 404;
        }

        location ~* ^/kibana/(?:(?:app|spaces|api|internal)(?:/|$)|s/default(?:/|$)|s/[^/]+/s/) {
            error_page 403 /kibana-refused/;
            return 403;
        }

        location ~ ^/kibana/s/(?<kibana_current>[a-z0-9-]+)/api/spaces/space$ {
            if ($request_method != GET) {
                return 403;
            }
            default_type application/json;
            return 200 '[{"id":"$kibana_current","name":"SOC","disabledFeatures":[]}]';
        }

        location ~* ^/kibana/s/[^/]+/(?:api|internal)(?:/|$) {
            set $kibana_gate http://127.0.0.1:8001/kibana-gate/;
            proxy_pass $kibana_gate;
            proxy_set_header X-Kibana-Uri $request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 5m;
        }

        location ~ ^/kibana/(?<kibana_space>s/[^/]+/)app/(management|dev_tools|home|observability|security|kibana_overview)(/|$) {
            absolute_redirect off;
            return 302 /kibana/${kibana_space}app/discover;
        }

        location /kibana/ {
            if ($args ~* "(^|&)namespaces=") {
                return 403;
            }
            if ($request_uri ~ "^[^?]*(%|/\.|\x5c)") {
                return 403;
            }
            auth_request /signed-in;
            error_page 401 = @sign-in;
            error_page 403 /kibana-refused/;
            set $kibana http://kibana:5601;
            proxy_pass $kibana;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 1h;
        }

        location /vm-terminal/kali/ {
            limit_conn held_open 10;
            auth_request /signed-in;
            error_page 401 = @sign-in;
            proxy_pass http://127.0.0.1:7691;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 1d;
        }

        location /vm-terminal/waf/ {
            limit_conn held_open 10;
            auth_request /signed-in;
            error_page 401 = @sign-in;
            proxy_pass http://127.0.0.1:7692;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 1d;
        }

        location = /signed-in {
            internal;
            proxy_pass http://127.0.0.1:8001/auth-check/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_cache signed_in;
            proxy_set_header X-Original-URI $request_uri;
            proxy_cache_key "$cookie_cr_session|$remote_addr|$session_asked";
            proxy_cache_valid 204 401 5s;
            proxy_ignore_headers Vary;
        }
    }

    server {
        listen 8002;
        absolute_redirect off;

        location ~ ^/site/(?<session>\d+)/(?<site>[a-z0-9.-]+)(/.*)?$ {
            limit_conn held_open 10;
            auth_request /signed-in;
            error_page 401 = @sign-in;
            proxy_pass http://127.0.0.1:8001/site-proxy/$session/$site/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Site-Uri $site_uri;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Cookie "";
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Set-Cookie;
            add_header Content-Security-Policy "sandbox allow-forms allow-scripts allow-same-origin" always;
            proxy_redirect ~^https?://[^/]+(/.*)?$ /site/$session/$site$1;
            proxy_redirect ~^(/.*)$ /site/$session/$site$1;
            sub_filter_once off;
            sub_filter 'http://$site/' '/site/$session/$site/';
            sub_filter 'http://$site"' '/site/$session/$site/"';
            sub_filter 'http:\/\/$site\/' '\/site\/$session\/$site\/';
            sub_filter 'href="/' 'href="/site/$session/$site/';
            sub_filter 'src="/' 'src="/site/$session/$site/';
            sub_filter 'action="/' 'action="/site/$session/$site/';
            sub_filter '</body>' '<script>(function(){var p=parent,w=null,id=null,at=null,f=0;function own(o){try{var a=location.ancestorOrigins;return a&&a.length?o===a[0]:new URL(o).hostname===location.hostname}catch(e){return false}}function near(e,r){var o=[],l=document.body.querySelectorAll("*"),i,c,b,g;for(i=0;i<l.length&&o.length<60;i++){c=l[i];if(c===e||c.firstElementChild||e.contains(c)||["SCRIPT","STYLE","NOSCRIPT"].indexOf(c.tagName)>=0)continue;if(["INPUT","IMG","SELECT","TEXTAREA"].indexOf(c.tagName)>=0)b=c.getBoundingClientRect();else{g=document.createRange();g.selectNodeContents(c);b=g.getBoundingClientRect()}if(b.width>0&&b.height>0&&(c.textContent.trim()||["INPUT","IMG","SELECT","TEXTAREA"].indexOf(c.tagName)>=0)&&b.bottom>r.top-200&&b.top<r.bottom+200)o.push({x:b.left,y:b.top,w:b.width,h:b.height})}return o}function send(){f=0;if(!w)return;var e=document.querySelector(w),r=e&&e.getBoundingClientRect();p.postMessage({located:id,rect:r?{x:r.left,y:r.top,w:r.width,h:r.height}:null,text:r?near(e,r):[]},at)}function soon(){if(w&&!f){f=1;requestAnimationFrame(send)}}addEventListener("message",function(m){var d=m.data;if(m.source!==p||!d||typeof d!=="object"||!("locate" in d)||!own(m.origin))return;w=null;if(typeof d.locate!=="string"||!d.locate)return;id=d.id;at=m.origin;try{document.querySelector(d.locate);w=d.locate}catch(e){p.postMessage({located:id,rect:null},at);return}send()});var base="/site/$session/$site/",named="http://$site/";function named_link(a){var h=a.getAttribute("href");if(h&&h.indexOf(base)===0)a.setAttribute("href",named+h.slice(base.length))}function anchor(e){return e.target&&e.target.closest?e.target.closest("a[href]"):null}Array.prototype.forEach.call(document.querySelectorAll("a[href]"),named_link);["mouseover","focusin"].forEach(function(n){addEventListener(n,function(e){var a=anchor(e);if(a)named_link(a)},true)});addEventListener("click",function(e){var a=anchor(e),h=a&&a.getAttribute("href");if(!h||e.defaultPrevented||e.button||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey||h.indexOf(named)!==0)return;e.preventDefault();location.href=base+h.slice(named.length)},true);addEventListener("scroll",soon,true);addEventListener("resize",soon);addEventListener("keydown",function(e){if(e.key==="F12"){e.preventDefault();p.postMessage({key:"F12"},"*")}});p.postMessage({site:location.pathname+location.search},"*")})()</script></body>';
            proxy_read_timeout 1m;
        }

        location = /signed-in {
            internal;
            proxy_pass http://127.0.0.1:8001/auth-check/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_cache signed_in;
            proxy_set_header X-Original-URI $request_uri;
            proxy_cache_key "$cookie_cr_session|$remote_addr|$session_asked";
            proxy_cache_valid 204 401 5s;
            proxy_ignore_headers Vary;
        }

        location @sign-in {
            return 302 http://$host:8000/login/?next=http://$http_host$request_uri;
        }

        location / {
            return 404;
        }
    }
}
