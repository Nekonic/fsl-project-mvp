<!DOCTYPE html>
<html lang="ko" class="bg-slate-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Blue team console{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 font-sans">
  <header class="border-b border-slate-800">
    <nav class="max-w-5xl mx-auto px-6 py-4 flex gap-6 text-sm items-center">
      <span class="font-semibold text-slate-100">FSL blue team</span>
      <a href="/" class="hover:text-white">Score</a>
      <a href="/detections/" class="hover:text-white">Alerts</a>
      <a href="/rules/" class="hover:text-white">Rules</a>
      <label class="ml-auto flex items-center gap-2">
        <span class="text-slate-400">Session</span>
        <input id="session-id" type="number" min="1"
               class="w-20 bg-slate-900 border border-slate-700 rounded px-2 py-1">
      </label>
    </nav>
  </header>
  <main class="max-w-5xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>
  <script>
    // The session number follows you between pages.
    const sessionInput = document.getElementById("session-id");
    sessionInput.value = localStorage.getItem("fsl-session") || "1";
    sessionInput.addEventListener("change", () => {
      localStorage.setItem("fsl-session", sessionInput.value);
      window.dispatchEvent(new Event("fsl:session-changed"));
    });
    const sessionId = () => sessionInput.value;

    async function api(path, options) {
      const response = await fetch(path, options);
      const body = await response.json().catch(() => ({}));
      return { ok: response.ok, status: response.status, body };
    }
  </script>
  {% block script %}{% endblock %}
</body>
</html>
