{% extends "blueteam/base.html" %}
{% block title %}Alerts{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold text-slate-100 mb-6">Alerts</h1>
<table class="w-full text-sm">
  <thead class="text-slate-400 border-b border-slate-800">
    <tr><th class="text-left py-2">Time</th><th class="text-left">Source</th>
        <th class="text-left">Signature</th><th class="text-left">From</th>
        <th class="text-left">Marker</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<p id="empty" class="text-slate-500 text-sm mt-4 hidden">
  No alerts ingested. Re-ingest from the Score page.
</p>
{% endblock %}
{% block script %}
<script>
  async function render() {
    const result = await api(`/api/sessions/${sessionId()}/detections/`);
    const rows = document.getElementById("rows");
    const empty = document.getElementById("empty");
    if (!result.ok) { rows.innerHTML = ""; empty.classList.remove("hidden"); return; }

    empty.classList.toggle("hidden", result.body.length > 0);
    rows.innerHTML = result.body.map((d) => `
      <tr class="border-b border-slate-900">
        <td class="py-2 text-slate-400">${d.timestamp}</td>
        <td>${d.source}</td>
        <td class="text-slate-100">${d.signature}</td>
        <td>${d.src_ip || "-"}</td>
        <td class="${d.marker ? "text-emerald-400" : "text-slate-600"}">
          ${d.marker ? d.marker.slice(0, 8) : "none"}</td>
      </tr>`).join("");
  }

  window.addEventListener("fsl:session-changed", render);
  render();
</script>
{% endblock %}
