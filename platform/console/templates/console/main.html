{% extends "console/base.html" %}
{% block title %}FSL{% endblock %}
{% block content %}
<div class="flex flex-wrap items-end justify-between gap-3 mb-6">
  <div>
    <h1 data-t="main.title" class="text-[22px] font-bold text-heading"></h1>
    <p data-t="main.subtitle" class="text-muted mt-1"></p>
  </div>
  <div id="capacity" class="label"></div>
</div>
<p id="sessions-error" class="text-danger text-[13px] mb-6 hidden"></p>

<section id="range-state" class="mb-6 hidden card border-warning-soft bg-warning-soft p-5">
  <h2 data-t="range.not_ready" class="font-semibold text-warning mb-2"></h2>
  <ul id="range-blocked" class="text-body text-[13px] list-disc pl-5 space-y-1"></ul>
</section>

<section id="range-pipeline" class="mb-8 hidden">
  <button id="canary" data-t="range.canary" class="btn btn-sm btn-ghost"></button>
  <span id="canary-out" class="text-[13px] ml-2"></span>
</section>

<section id="running-panel" class="mb-8 hidden">
  <h2 data-t="main.running" class="font-semibold text-heading mb-3"></h2>
  <div id="running" class="card divide-y divide-line-subdued"></div>
</section>

<h2 data-t="main.scenarios" class="font-semibold text-heading mb-3"></h2>
<div id="wargames" class="grid gap-4 md:grid-cols-2 mb-8"></div>
<p id="start-error" class="text-danger text-[13px] mb-8 hidden"></p>

<section id="finished-panel" class="hidden">
  <h2 data-t="main.finished" class="font-semibold text-heading mb-3"></h2>
  <div class="card overflow-x-auto">
    <table class="w-full text-[13px]">
      <thead class="table-head">
        <tr>
          <th data-t="main.col.session" class="pl-5"></th>
          <th data-t="main.col.kind"></th>
          <th data-t="main.col.scenario"></th>
          <th data-t="main.col.result"></th>
          <th data-t="main.col.took"></th>
          <th data-t="main.col.ended"></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="finished"></tbody>
    </table>
  </div>
</section>
{% endblock %}
{% block script %}
<script>
  let catalogue = [];
  let running = [];
  let capacity = null;
  let starting = false;
  let rangeReady = true;
  const operatorView = new URLSearchParams(location.search).has("operator");

  const field = (id) => document.getElementById(id);

  function showError(text, panelId = "start-error") {
    const panel = field(panelId);
    panel.classList.remove("hidden");
    panel.textContent = text;
  }

  const scenarioOf = (id) => catalogue.find((wargame) => wargame.id === id);
  const scenarioName = (id) => {
    const wargame = scenarioOf(id);
    return localized(`wargame.${id}.name`, wargame ? wargame.name : id);
  };
  const kindBadge = (session) => badge(t(`kind.${session.kind}`), session.kind === "lesson" ? "blue" : "neutral");
  const lessonOf = (session) => {
    const wargame = scenarioOf(session.scenario);
    return wargame && session.lesson_id ? (wargame.foundations || []).find((taught) => taught.id === session.lesson_id) : null;
  };

  function foundationsBlock(wargame) {
    const id = esc(wargame.id);
    const units = (wargame.foundations || []).map((taught, index) => `
      <li class="flex flex-col gap-1" data-foundation="${esc(taught.id)}">
        <div class="flex items-center gap-2">
          <span class="badge badge-blue">${esc(t("main.lesson_number", index + 1))}</span>
          <h4 class="font-semibold text-heading flex-1 min-w-0">${esc(t(taught.title))}</h4>
          ${taught.minutes ? `<span class="text-[12px] text-muted shrink-0">${esc(t("main.minutes", taught.minutes))}</span>` : ""}
        </div>
        <p class="text-body leading-relaxed"><span class="text-muted">${esc(t("main.foundation.learns"))}</span> ${esc(t(taught.learns))}</p>
        <button data-wargame="${id}" data-lesson="true" data-lesson-id="${esc(taught.id)}"
          data-defense="${esc(taught.defense || "")}" class="start self-start btn btn-sm btn-blue">${esc(t("main.foundation.start"))}</button>
        <p class="hidden text-[12px]" data-last="${id}/${esc(taught.id)}"></p>
      </li>`).join("");
    return units ? `
      <section class="pt-4 mt-4 border-t border-line-subdued" data-foundations="${id}">
        <h4 class="text-[15px] font-bold text-heading">${esc(t("main.group.foundations"))}</h4>
        <p class="text-[12px] text-muted mt-0.5">${esc(t("main.group.foundations.note"))}</p>
        <ol class="mt-3 flex flex-col gap-4">${units}</ol>
      </section>` : "";
  }

  function scenariosBlock(wargame) {
    const id = esc(wargame.id);
    const runs = (wargame.scenarios || []).map((one) => `
      <li class="flex flex-col gap-1" data-course-scenario="${esc(one.id)}">
        <div class="flex flex-wrap items-center gap-2">
          <span class="badge badge-blue">${esc(one.id)}</span>
          <h4 class="font-semibold text-heading flex-1 min-w-0">${esc(t(one.title))}</h4>
          <span class="text-[12px] text-muted shrink-0">${esc(t("main.minutes", one.minutes))}</span>
        </div>
        <div class="flex flex-wrap gap-1.5">
          ${badge(t(`scenario.class.${one.task_class}`), "neutral")}
          ${badge(t(`scenario.guidance.${one.guidance}`), "muted")}
        </div>
        <p class="text-body leading-relaxed"><span class="text-muted">${esc(t("main.scenario.practise"))}</span> ${esc(t(one.practise))}</p>
        <button data-wargame="${id}" data-course="${esc(one.id)}" class="start self-start btn btn-sm btn-blue">${esc(t("main.scenario.start"))}</button>
        <p class="hidden text-[12px]" data-last-scenario="${esc(one.id)}"></p>
      </li>`).join("");
    return runs ? `
      <section class="pt-4 mt-4 border-t border-line-subdued" data-scenarios="${id}">
        <h4 class="text-[15px] font-bold text-heading">${esc(t("main.group.scenarios"))}</h4>
        <p class="text-[12px] text-muted mt-0.5">${esc(t("main.group.scenarios.note"))}</p>
        <ol class="mt-3 flex flex-col gap-4">${runs}</ol>
      </section>` : "";
  }

  function scenarioCard(wargame) {
    const id = esc(wargame.id);
    const counted = typeof wargame.attacks === "number";
    const kind = wargame.category ? badge(localized(`category.${wargame.category}`, wargame.category), "neutral") : "";
    return `
      <div class="card p-5 flex flex-col" data-scenario="${id}">
        <div class="flex flex-wrap items-center gap-2 mb-2">
          ${kind}
          ${wargame.difficulty ? badge(t(`difficulty.${wargame.difficulty}`), "neutral") : ""}
          ${wargame.minutes ? `<span class="text-muted text-[12px] ml-auto">${esc(t("main.minutes", wargame.minutes))}</span>` : ""}
        </div>
        <h3 class="text-[16px] font-bold text-heading">${esc(scenarioName(wargame.id))}</h3>
        <p class="text-muted mt-1 leading-relaxed">${esc(localized(`wargame.${wargame.id}.description`, wargame.description))}</p>
        ${counted && operatorView ? `<p class="text-[12px] text-muted mt-3">${
          esc(t("main.counts", wargame.attacks, wargame.benign, wargame.objectives))}</p>` : ""}
        ${foundationsBlock(wargame)}
        ${scenariosBlock(wargame)}
        <div class="mt-auto pt-4">
          <div class="pt-4 border-t border-line-subdued" data-wargame-start="${id}">
            <button data-wargame="${id}" class="start btn btn-ghost w-full">${esc(t("main.start"))}</button>
            <p class="text-[12px] text-muted mt-1.5">${esc(t("main.start.note"))}</p>
          </div>
        </div>
        <div class="hidden mt-3 rounded-lg bg-danger-soft border border-danger-soft px-3 py-2.5 text-[13px]"
             data-failure="${id}">
          <div class="flex flex-wrap items-start gap-2">
            <span class="text-danger font-bold">!</span>
            <p data-failure-text class="flex-1 text-danger min-w-0"></p>
            <button data-close-open class="btn btn-sm btn-ghost hidden">${esc(t("main.close_open"))}</button>
          </div>
          <div data-open-list class="hidden mt-2 space-y-1"></div>
        </div>
      </div>`;
  }

  async function renderWargames() {
    const result = await api("/api/wargames/");
    if (!result.ok || !Array.isArray(result.body)) {
      showError(t("main.unavailable", t("main.the_scenarios"), detail(result)));
      return;
    }
    catalogue = result.body;
    field("wargames").innerHTML = catalogue.map(scenarioCard).join("");
    field("wargames").querySelectorAll(".start").forEach((button) =>
      button.addEventListener("click", () => start(button)));
    field("wargames").querySelectorAll("[data-close-open]").forEach((button) =>
      button.addEventListener("click", () => listOpen(button.closest("[data-failure]"))));
    renderRunning();
    renderFinished(finishedRows);
    renderMine();
  }

  async function renderMine() {
    const opened = openedSessions();
    if (!opened.length) return;
    const read = await api(`/api/sessions/?ids=${opened.join(",")}`);
    if (!read.ok || !Array.isArray(read.body)) return;
    document.querySelectorAll("[data-last-scenario]").forEach((line) => {
      const last = read.body.filter((session) => session.course_scenario === line.dataset.lastScenario)
        .sort((a, b) => b.id - a.id)[0];
      if (!last) return;
      const verdict = last.result && last.result.scenario;
      const state = !last.ended_at ? esc(t("main.last.open"))
        : verdict ? badge(verdict.passed ? "PASS" : "FAIL", verdict.passed ? "ok-strong" : "red-strong")
          : esc(t("main.last.unverified"));
      line.innerHTML = `<a href="/session/${esc(last.id)}/" class="hover:underline">${
        esc(t("main.last", last.id, t(`kind.${last.kind}`)))}</a> ${state}`;
      line.classList.remove("hidden");
    });
    document.querySelectorAll("[data-last]").forEach((line) => {
      const [scenario, taught] = line.dataset.last.split("/");
      const last = read.body.filter((session) => session.scenario === scenario && session.lesson_id === taught)
        .sort((a, b) => b.id - a.id)[0];
      if (!last) return;
      const state = esc(t(last.ended_at ? "state.closed" : "main.last.open"));
      line.innerHTML = `<a href="/session/${esc(last.id)}/" class="hover:underline">${
        esc(t("main.last", last.id, t(`kind.${last.kind}`)))}</a> ${state}`;
      line.classList.remove("hidden");
    });
  }

  function opening(button) {
    const began = Date.now();
    const tick = () => {
      button.textContent = t("state.opening", Math.round((Date.now() - began) / 1000), OPENING_TAKES);
    };
    tick();
    return setInterval(tick, 1000);
  }

  async function start(button) {
    const card = button.closest("[data-scenario]");
    const failure = card.querySelector("[data-failure]");
    const label = button.textContent;
    failure.classList.add("hidden");
    starting = true;
    card.querySelectorAll(".start").forEach((each) => { each.disabled = true; });
    const ticking = opening(button);
    const defense = button.dataset.defense ? { defense: button.dataset.defense } : {};
    const settings = button.dataset.lesson ? { guidance: true, lesson: button.dataset.lessonId, ...defense } : {};
    const asked = button.dataset.course ? { scenario: button.dataset.course }
      : { scenario: button.dataset.wargame, ...settings };
    const started = await post("/api/sessions/", asked, PATIENCE_FOR_RANGE_WORK);
    clearInterval(ticking);
    starting = false;
    if (started.ok && started.body.id) {
      rememberSession(started.body.id);
      location.href = button.dataset.course ? `/blue/${started.body.id}/` : `/session/${started.body.id}/`;
      return;
    }
    button.textContent = label;
    card.querySelectorAll(".start").forEach((each) => { each.disabled = !rangeReady; });
    const full = started.status === 409 && capacity !== null && running.length >= capacity;
    failure.querySelector("[data-failure-text]").textContent = full
      ? t("main.start_failed.full", running.length, capacity)
      : t("main.start_failed", detail(started));
    failure.querySelector("[data-close-open]").classList.toggle("hidden", started.status !== 409);
    failure.querySelector("[data-open-list]").classList.add("hidden");
    failure.classList.remove("hidden");
    refreshSessions();
  }

  function listOpen(failure) {
    const list = failure.querySelector("[data-open-list]");
    list.classList.remove("hidden");
    list.innerHTML = running.length ? running.map((session) => `
      <div class="flex items-center gap-3 bg-panel rounded-md border border-line px-3 py-2">
        <span class="font-semibold text-heading">${esc(t("common.session", session.id))}</span>
        ${kindBadge(session)}
        <span class="text-body truncate">${esc(scenarioName(session.scenario))}</span>
        <span class="text-faint text-[12px] ml-auto">${esc(t("main.started_at", clock(session.started_at)))}</span>
        <button data-close="${esc(session.id)}" class="btn btn-sm btn-ghost">${esc(t("main.close_this"))}</button>
      </div>`).join("") : `<p class="text-muted">${esc(t("main.none_open"))}</p>`;
    list.querySelectorAll("[data-close]").forEach((button) =>
      button.addEventListener("click", () => closeOpen(button, failure)));
  }

  async function closeOpen(button, failure) {
    button.disabled = true;
    button.textContent = t("main.closing");
    const id = button.dataset.close;
    await post(`/api/sessions/${id}/ingest/`);
    const closed = await post(`/api/sessions/${id}/close/`);
    if (!closed.ok) {
      button.disabled = false;
      button.textContent = t("main.close_this");
      failure.querySelector("[data-failure-text]").textContent = t("session.close.failed", detail(closed));
      return;
    }
    await refreshSessions();
    failure.querySelector("[data-failure-text]").textContent = t("main.closed_now", id);
    failure.querySelector("[data-close-open]").classList.add("hidden");
    listOpen(failure);
  }

  function stateBadge(session) {
    return session.ready
      ? badge(t("state.ready"), "ok", true)
      : badge(t("state.opening", secondsSince(session.started_at), OPENING_TAKES), "warn", true);
  }

  function runningRow(session) {
    const taught = session.kind === "lesson" ? lessonOf(session) : null;
    const lessonTitle = taught ? ` · ${localized(taught.title, "")}` : "";
    const steps = taught && taught.steps
      ? `<span class="text-muted text-[13px] hidden sm:inline">${esc(t("main.step", lessonStep(session.id, session.lesson_id), taught.steps))}</span>` : "";
    return `
      <a href="/session/${esc(session.id)}/" class="flex flex-wrap items-center gap-x-4 gap-y-1 px-5 py-3.5 hover:bg-subdued">
        <span class="font-semibold text-heading w-20">${esc(t("common.session", session.id))}</span>
        ${kindBadge(session)}
        <span class="text-body">${esc(scenarioName(session.scenario) + lessonTitle)}</span>
        ${steps}
        <span class="ml-auto">${stateBadge(session)}</span>
        <span class="text-faint text-[13px] w-24 text-right">${esc(t("main.started_at", clock(session.started_at)))}</span>
        <span class="text-faint">›</span>
      </a>`;
  }

  function renderRunning() {
    field("running-panel").classList.toggle("hidden", running.length === 0);
    field("running").innerHTML = running.map(runningRow).join("");
    field("capacity").textContent = capacity === null || !operatorView ? "" : t("main.capacity", running.length, capacity);
  }

  function resultCell(session) {
    const result = session.result || {};
    const judged = result.scenario;
    if (judged) {
      return (judged.passed ? badge("PASS", "ok-strong") : badge("FAIL", "red-strong")) + (judged.helped || []).map((kind) =>
        ` <span class="text-muted text-[12px]">· ${esc(t(`result.helped.${kind}`))}</span>`).join("");
    }
    const objectives = result.objectives;
    if (!objectives || !objectives.total) return `<span class="text-faint">—</span>`;
    if (!objectives.lost) {
      return `<span class="font-semibold text-success">${esc(t("result.kept_all", objectives.total))}</span>`;
    }
    return `<span class="font-semibold text-danger">${esc(t("result.lost", objectives.total, objectives.lost))}</span>${
      objectives.undetected ? ` <span class="text-muted">· ${esc(t("result.unseen", objectives.undetected))}</span>` : ""}`;
  }

  function finishedRow(session) {
    return `
      <tr class="table-row hover:bg-subdued cursor-pointer" data-href="/session/${esc(session.id)}/">
        <td class="pl-5 font-semibold text-heading"><a href="/session/${esc(session.id)}/">${esc(t("common.session", session.id))}</a></td>
        <td>${kindBadge(session)}</td>
        <td>${esc(scenarioName(session.scenario))}</td>
        <td>${resultCell(session)}</td>
        <td>${esc(t("main.minutes_spent", minutesBetween(session.started_at, session.ended_at)))}</td>
        <td class="text-muted">${esc(clock(session.ended_at))}</td>
        <td class="text-faint pr-5 text-right">›</td>
      </tr>`;
  }

  let finishedRows = [];

  function renderFinished(rows) {
    finishedRows = rows;
    field("finished-panel").classList.toggle("hidden", rows.length === 0);
    field("finished").innerHTML = rows.map(finishedRow).join("");
    field("finished").querySelectorAll("[data-href]").forEach((row) =>
      row.addEventListener("click", () => { location.href = row.dataset.href; }));
  }

  async function renderSessions() {
    const open = await api("/api/sessions/?state=open");
    if (!open.ok || !Array.isArray(open.body)) {
      field("running-panel").classList.add("hidden");
      field("finished-panel").classList.add("hidden");
      showError(t("main.unavailable", t("main.the_sessions"), detail(open)), "sessions-error");
      return;
    }
    field("sessions-error").classList.add("hidden");
    running = open.body;
    renderRunning();
    const finished = await api("/api/sessions/?state=closed&limit=10");
    renderFinished(finished.ok && Array.isArray(finished.body) ? finished.body : []);
  }

  let canaryWired = false;

  function wireCanary() {
    if (canaryWired) return;
    canaryWired = true;
    field("canary").addEventListener("click", async () => {
      const button = field("canary");
      const out = field("canary-out");
      button.disabled = true;
      out.className = "text-[13px] ml-2 text-muted";
      out.textContent = "…";
      const result = await post("/api/range/canary/");
      button.disabled = false;
      if (result.ok && result.body.corroborated) {
        out.className = "text-[13px] ml-2 text-success";
        out.textContent = t("range.canary_ok", esc(result.body.skew_seconds));
      } else {
        const why = (result.body && result.body.blocked) || [detail(result)];
        out.className = "text-[13px] ml-2 text-danger";
        out.textContent = t("range.canary_failed", esc(why.join("; ")));
      }
    });
  }

  async function renderReady() {
    const result = await api("/api/range/ready/");
    const slot = result.ok && result.body ? result.body.slot : null;
    const ready = !result.ok || result.body.ready !== false;
    capacity = result.ok && Number.isInteger(result.body.max_sessions) ? result.body.max_sessions : null;
    renderRunning();

    rangeReady = ready;
    if (!starting) document.querySelectorAll(".start").forEach((button) => { button.disabled = !ready; });

    const health = field("range-health");
    health.classList.toggle("hidden", !result.ok || !operatorView);
    health.classList.toggle("flex", result.ok && operatorView);
    health.innerHTML = `<span class="dot dot-${ready ? "ok" : "warn"}"></span>${esc(t(ready ? "range.healthy" : "range.not_ready_short"))}`;

    field("range-state").classList.toggle("hidden", ready);
    if (!ready && slot) {
      const reasons = slot.phase === "RESETTING" ? [t("range.resetting")] : (slot.blocked || []);
      field("range-blocked").innerHTML = reasons.map((reason) => `<li>${esc(reason)}</li>`).join("");
    }

    field("range-pipeline").classList.toggle("hidden", !slot || !operatorView);
    if (slot && operatorView) wireCanary();
  }

  const SESSIONS_EVERY = 10000;
  let refreshTimer = null;
  let refreshing = false;
  let refreshedAt = 0;

  async function refreshSessions() {
    if (refreshing) return;
    refreshing = true;
    clearTimeout(refreshTimer);
    try {
      await renderSessions();
      await renderReady();
    } finally {
      refreshing = false;
      refreshedAt = Date.now();
      refreshTimer = setTimeout(refreshSessions, SESSIONS_EVERY);
    }
  }

  onResume(() => {
    if (Date.now() - refreshedAt >= SESSIONS_EVERY) refreshSessions();
  });

  setInterval(() => {
    if (running.some((session) => !session.ready)) renderRunning();
  }, 1000);

  renderWargames();
  refreshSessions();
</script>
{% endblock %}
