{% extends "console/base.html" %}
{% block title %}FSL{% endblock %}
{% block content %}
<h1 data-t="main.title" class="text-2xl font-semibold text-heading mb-2"></h1>
<p data-t="main.intro" class="text-muted text-sm mb-8"></p>

<p id="sessions-error" class="text-danger text-sm mb-10 hidden"></p>

<section id="running-panel" class="mb-10 hidden">
  <h2 data-t="main.running" class="text-sm uppercase tracking-wide text-success mb-3"></h2>
  <div id="running" class="space-y-2"></div>
</section>

<h2 data-t="main.scenarios" class="text-sm uppercase tracking-wide text-muted mb-3"></h2>
<div id="wargames" class="grid gap-4 mb-10"></div>
<p id="start-error" class="text-danger text-sm mb-10 hidden"></p>

<details id="finished-panel" class="mt-4">
  <summary data-t="main.finished"
    class="text-sm uppercase tracking-wide text-muted cursor-pointer select-none"></summary>
  <div id="finished" class="space-y-2 mt-3"></div>
</details>
{% endblock %}
{% block script %}
<script>
  function showError(text, panelId = "start-error") {
    const panel = document.getElementById(panelId);
    panel.classList.remove("hidden");
    panel.textContent = text;
  }

  async function renderWargames() {
    const result = await api("/api/wargames/");
    if (!result.ok || !Array.isArray(result.body)) {
      showError(t("main.unavailable", t("main.the_scenarios"), detail(result)));
      return;
    }
    document.getElementById("wargames").innerHTML = result.body.map((wargame) => `
      <div class="bg-panel border border-line rounded p-5 flex items-center gap-6">
        <div class="flex-1">
          <div class="text-heading font-medium">${esc(wargame.name)}</div>
          <div class="text-body text-sm mt-1">${esc(wargame.description)}</div>
          <div class="text-muted text-xs mt-2">${t("main.case_count", esc(wargame.cases))}</div>
        </div>
        <button data-wargame="${esc(wargame.id)}"
          class="start px-4 py-2 rounded bg-primary hover:bg-primary-strong text-inverse text-sm">
          ${esc(t("main.start"))}
        </button>
      </div>`).join("");

    document.querySelectorAll(".start").forEach((button) => {
      button.addEventListener("click", async () => {
        button.disabled = true;
        const started = await post("/api/sessions/", { scenario: button.dataset.wargame });
        if (!started.ok || !started.body.id) {
          button.disabled = false;
          showError(t("main.start_failed", detail(started)));
          return;
        }
        location.href = `/session/${started.body.id}/`;
      });
    });
  }

  function sessionRow(session, running) {
    const state = running ? t("main.open") : t("main.closed");
    const tone = running ? "text-success" : "text-muted";
    return `
      <a href="/session/${esc(session.id)}/"
         class="block bg-panel border rounded px-4 py-3 ${running
           ? "border-success-soft hover:border-success"
           : "border-line hover:border-primary"}">
        <span class="text-heading">${esc(t("common.session", session.id))}</span>
        <span class="text-body text-sm ml-3">${esc(session.scenario)}</span>
        <span class="text-muted text-xs ml-3">${
          esc((session.started_at || "").replace("T", " ").slice(0, 19))}</span>
        <span class="text-xs ml-3 ${tone}">${esc(state)}</span>
      </a>`;
  }

  function showPanel(id, visible) {
    document.getElementById(id).classList.toggle("hidden", !visible);
  }

  async function renderSessions() {
    const running = await api("/api/sessions/?state=open");
    if (!running.ok || !Array.isArray(running.body)) {
      showPanel("running-panel", false);
      showPanel("finished-panel", false);
      showError(t("main.unavailable", t("main.the_sessions"), detail(running)), "sessions-error");
      return;
    }
    showPanel("sessions-error", false);
    showPanel("running-panel", running.body.length > 0);
    document.getElementById("running").innerHTML =
      running.body.map((s) => sessionRow(s, true)).join("");

    const finished = await api("/api/sessions/?state=closed&limit=10");
    const rows = finished.ok && Array.isArray(finished.body) ? finished.body : [];
    showPanel("finished-panel", rows.length > 0);
    document.getElementById("finished").innerHTML =
      rows.map((s) => sessionRow(s, false)).join("");
  }

  const SESSIONS_EVERY = 10000;
  let refreshTimer = null;
  let refreshing = false;
  let refreshedAt = 0;

  async function refreshSessions() {
    if (refreshing) return;
    refreshing = true;
    clearTimeout(refreshTimer);
    try {
      await renderSessions();
    } finally {
      refreshing = false;
      refreshedAt = Date.now();
      refreshTimer = setTimeout(refreshSessions, SESSIONS_EVERY);
    }
  }

  onResume(() => {
    if (Date.now() - refreshedAt >= SESSIONS_EVERY) refreshSessions();
  });

  renderWargames();
  refreshSessions();
</script>
{% endblock %}
