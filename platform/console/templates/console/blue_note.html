<button id="note-pill" class="hidden absolute top-2 right-28 z-[36] btn btn-ghost note-shadow">
  <span class="dot dot-blue"></span><span id="note-pill-text"></span><span class="text-faint">▾</span>
</button>

<aside id="lesson" class="hidden absolute top-2 right-4 bottom-4 w-[360px] max-w-[calc(100%-2rem)] z-[35] bg-panel rounded-xl border border-line note-shadow flex-col">
  <header class="px-4 pt-3 flex items-center gap-2">
    <h2 data-t="lesson.note.heading" class="font-bold text-heading"></h2>
    <span id="lesson-subtitle" class="text-[12px] text-muted truncate"></span>
    <button id="lesson-collapse" class="ml-auto text-faint text-[12px] hover:text-heading shrink-0"></button>
  </header>
  <p id="lesson-goal-line" class="px-4 mt-1 text-[12.5px] text-heading font-medium"></p>
  <div id="lesson-tabs" class="px-4 mt-1 flex gap-5 border-b border-line overflow-x-auto">
    <button class="tab" data-tab="steps" data-t="lesson.tab.steps"></button>
    <button class="tab" data-tab="goal" data-t="lesson.tab.goal"></button>
    <button class="tab" data-tab="theory" data-t="lesson.tab.theory"></button>
    <button class="tab" data-tab="hint" data-t="lesson.tab.hint"></button>
  </div>
  <div id="lesson-body" class="flex-1 min-h-0 overflow-y-auto p-4 text-[13px] leading-relaxed">
    <div data-pane-of="steps" class="flex flex-col gap-3">
      <button id="lesson-coach-show" data-t="lesson.coach.show" class="self-start btn btn-sm btn-blue hidden"></button>
      <p id="lesson-step-count" class="text-[12px] text-muted"></p>
      <ol id="lesson-step-list" class="flex flex-col gap-1.5"></ol>
      <label class="flex items-start gap-2 text-[12px] text-muted border-t border-line-subdued pt-3">
        <input id="lesson-stretch" type="checkbox" class="mt-0.5">
        <span><b data-t="lesson.stretch" class="text-heading"></b> · <span data-t="lesson.stretch.note"></span></span>
      </label>
    </div>

    <div data-pane-of="goal" class="hidden flex-col gap-3">
      <p id="lesson-goal" class="text-heading"></p>
      <div class="rounded-lg bg-subdued p-3">
        <div data-t="lesson.goal.done" class="label mb-1"></div>
        <ul id="lesson-done" class="list-disc pl-4 space-y-0.5"></ul>
      </div>
      <ol id="lesson-steps" class="flex flex-col gap-2 list-decimal pl-5 text-body"></ol>
    </div>

    <div data-pane-of="theory" class="hidden flex-col gap-2">
      <ul id="lesson-theory" class="flex flex-col gap-2"></ul>
    </div>

    <div data-pane-of="hint" class="hidden flex-col gap-3">
      <p data-t="lesson.hint.intro" class="text-[12px] text-muted"></p>
      <ul id="lesson-hints" class="flex flex-col gap-2"></ul>
      <div class="rounded-lg border border-primary-soft bg-primary-soft">
        <div class="px-3 py-2 flex items-center gap-2">
          <span data-t="lesson.answer.heading" class="badge badge-blue"></span>
          <span data-t="lesson.answer.note" class="text-[12px] text-muted"></span>
          <button id="lesson-answer-toggle" class="ml-auto btn btn-sm btn-ghost"></button>
        </div>
        <div id="lesson-answer-box" class="hidden px-3 pb-3 relative">
          <pre id="lesson-answer" class="code pr-14"></pre>
          <button id="lesson-answer-copy" data-t="lesson.copy" class="absolute top-2 right-5 btn btn-sm btn-code"></button>
        </div>
      </div>
    </div>
  </div>
</aside>
