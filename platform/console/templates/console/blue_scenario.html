<div id="scenario-strip" class="hidden h-11 border-b border-line bg-subdued items-center px-3 gap-4 shrink-0 min-w-0 text-[13px]">
  <span id="scenario-name" class="font-semibold text-heading truncate"></span>
  <span id="scenario-phase" class="shrink-0 font-semibold"></span>
  <span id="scenario-clock" class="flex items-center gap-1.5 shrink-0"><span data-t="scenario.strip.left" class="text-muted"></span><b id="scenario-left" class="font-mono text-heading"></b></span>
  <span class="flex items-center gap-1.5 shrink-0"><span data-t="scenario.strip.blocked" class="text-muted"></span><b id="scenario-blocked" class="font-mono text-heading"></b></span>
  <span class="hidden md:flex items-center gap-1.5 shrink-0"><span data-t="scenario.strip.alerts" class="text-muted"></span><b id="scenario-alerts" class="font-mono text-heading"></b></span>
  <span id="scenario-lost-shown" class="flex items-center gap-1.5 shrink-0"><span data-t="scenario.strip.lost" class="text-muted"></span><b id="scenario-lost" class="font-mono text-heading"></b></span>
  <button type="button" id="scenario-offer" class="hidden btn btn-sm btn-ghost shrink-0" data-t="scenario.hint.offer"></button>
  <button type="button" id="scenario-briefing-open" class="ml-auto text-[13px] text-primary hover:underline shrink-0" data-t="scenario.briefing.reopen"></button>
  <button type="button" id="scenario-done" class="btn btn-sm btn-blue shrink-0" data-t="scenario.done"></button>
  <button type="button" id="scenario-end" class="hidden btn btn-sm btn-ghost shrink-0" data-t="session.close.button"></button>
</div>
<p id="scenario-done-said" class="hidden px-3 py-2 border-b border-line bg-danger-soft text-danger text-[13px] shrink-0"></p>
<div id="scenario-end-confirm" class="hidden px-3 py-2 border-b border-line bg-panel flex-wrap items-center gap-3 text-[13px] shrink-0">
  <span data-t="session.close.consequence" class="text-body"></span>
  <button type="button" id="scenario-end-yes" class="btn btn-sm btn-blue" data-t="session.close.confirm"></button>
  <button type="button" id="scenario-end-keep" class="btn btn-sm btn-ghost" data-t="session.close.keep"></button>
</div>

<div id="scenario-debrief" class="hidden absolute inset-0 z-[37] bg-panel overflow-auto">
  <div class="max-w-[760px] mx-auto p-6 flex flex-col gap-4">
    <div class="flex flex-wrap items-center gap-2">
      <button type="button" id="scenario-debrief-close" class="btn btn-ghost" data-t="scenario.debrief.back"></button>
      <button type="button" id="scenario-debrief-end" class="hidden btn btn-ghost" data-t="session.close.button"></button>
    </div>
    <div id="scenario-verdict"></div>
    <div id="scenario-debrief-body" class="flex flex-col text-[13px]"></div>
  </div>
</div>

<div id="briefing" class="hidden fixed inset-0 z-[10001] bg-panel overflow-auto">
  <div class="max-w-[720px] mx-auto px-6 py-12 flex flex-col">
    <h1 id="briefing-title" class="text-[22px] font-bold text-heading mb-4"></h1>
    <section class="text-[14px] leading-relaxed border-b border-line">
      <div class="grid sm:grid-cols-[120px_minmax(0,1fr)] gap-x-6 gap-y-1 py-4 border-t border-line"><h2 data-t="scenario.briefing.situation" class="font-semibold text-heading"></h2><p id="briefing-situation" class="text-body"></p></div>
      <div class="grid sm:grid-cols-[120px_minmax(0,1fr)] gap-x-6 gap-y-1 py-4 border-t border-line"><h2 data-t="scenario.briefing.goal" class="font-semibold text-heading"></h2><p id="briefing-goal" class="text-heading font-semibold"></p></div>
      <div class="grid sm:grid-cols-[120px_minmax(0,1fr)] gap-x-6 gap-y-1 py-4 border-t border-line"><h2 data-t="scenario.briefing.measured_by" class="font-semibold text-heading"></h2><p id="briefing-measured" class="text-body"></p></div>
      <div class="grid sm:grid-cols-[120px_minmax(0,1fr)] gap-x-6 gap-y-1 py-4 border-t border-line"><h2 data-t="scenario.briefing.time" class="font-semibold text-heading"></h2><p id="briefing-time" class="text-body"></p></div>
    </section>
    <div class="flex flex-wrap items-center gap-2 mt-6">
      <button type="button" id="briefing-start" class="btn btn-blue" data-t="scenario.briefing.start"></button>
      <button type="button" id="briefing-end" class="btn btn-ghost" data-t="session.close.button"></button>
    </div>
  </div>
</div>
