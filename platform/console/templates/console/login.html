{% extends "console/base.html" %}
{% block account %}{% endblock %}
{% block content %}
<section class="max-w-[360px] mx-auto mt-16 card p-6">
  <h1 data-t="auth.title" class="font-semibold text-heading text-[18px] mb-5"></h1>
  <form id="sign-in" class="space-y-4">
    <label class="block">
      <span data-t="auth.username" class="label"></span>
      <input id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required
             class="mt-1 w-full h-9 px-3 rounded-md border border-line bg-panel text-body outline-none focus:border-primary">
    </label>
    <label class="block">
      <span data-t="auth.password" class="label"></span>
      <input id="password" name="password" type="password" autocomplete="current-password" required
             class="mt-1 w-full h-9 px-3 rounded-md border border-line bg-panel text-body outline-none focus:border-primary">
    </label>
    <p id="sign-in-error" class="text-danger text-[13px] hidden"></p>
    <button id="sign-in-submit" data-t="auth.submit" class="btn btn-blue w-full justify-center"></button>
  </form>
  <p class="mt-5 text-[13px] text-muted">
    <span data-t="auth.no_account"></span>
    <a id="sign-up-link" href="/signup/" data-t="auth.sign_up" class="text-primary font-semibold ml-1"></a>
  </p>
</section>
{% endblock %}
{% block script %}
<script>
  const form = document.getElementById("sign-in");
  const failed = document.getElementById("sign-in-error");
  const submit = document.getElementById("sign-in-submit");

  function landing() {
    const asked = new URLSearchParams(location.search).get("next") || "/";
    try {
      const target = new URL(asked, location.href);
      const here = target.hostname === location.hostname
        && (target.port === location.port || target.port === "8002");
      return here && target.protocol === location.protocol ? target.href : "/";
    } catch (error) {
      return "/";
    }
  }

  api("/api/auth/").then((said) => {
    if (said.ok && said.body.user) location.replace(landing());
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    submit.disabled = true;
    failed.classList.add("hidden");
    const said = await post("/api/auth/login/", {
      username: document.getElementById("username").value,
      password: document.getElementById("password").value,
    });
    submit.disabled = false;
    if (said.ok) {
      location.replace(landing());
      return;
    }
    failed.textContent = said.body.pending ? t("auth.pending")
      : said.body.locked_until ? t("auth.locked", clock(said.body.locked_until))
      : said.status === 429 ? t("auth.too_many")
      : said.status === 401 ? t("auth.wrong") : detail(said);
    failed.classList.remove("hidden");
  });

  document.getElementById("username").focus();
</script>
{% endblock %}
