<div id="topology" class="absolute inset-0 flex-col bg-panel" style="display: none">

    <button type="button" id="topology-gns3" class="tab" data-t="topology.view.map"></button>
    <button type="button" id="topology-fit" class="btn btn-sm btn-ghost shrink-0" data-t="topology.fit" style="display: none"></button>
