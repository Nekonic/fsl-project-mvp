{% extends "console/base.html" %}
{% block account %}{% endblock %}
{% block content %}
<section class="max-w-[360px] mx-auto mt-16 card p-6">
  <h1 data-t="signup.title" class="font-semibold text-heading text-[18px] mb-5"></h1>
  <form id="sign-up" class="space-y-4">
    <label class="block">
      <span data-t="auth.username" class="label"></span>
      <input id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required
             class="mt-1 w-full h-9 px-3 rounded-md border border-line bg-panel text-body outline-none focus:border-primary">
    </label>
    <label class="block">
      <span data-t="auth.password" class="label"></span>
      <input id="password" name="password" type="password" autocomplete="new-password" required
             class="mt-1 w-full h-9 px-3 rounded-md border border-line bg-panel text-body outline-none focus:border-primary">
      <span data-t="signup.password_rule" class="block mt-1 text-[12px] text-faint"></span>
    </label>
    <label class="block">
      <span data-t="signup.password_confirm" class="label"></span>
      <input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" required
             class="mt-1 w-full h-9 px-3 rounded-md border border-line bg-panel text-body outline-none focus:border-primary">
    </label>
    <ul id="sign-up-error" class="text-danger text-[13px] space-y-1 hidden"></ul>
    <button id="sign-up-submit" data-t="signup.submit" class="btn btn-blue w-full justify-center"></button>
  </form>
  <div id="sign-up-pending" class="hidden">
    <p data-t="signup.pending" class="text-body"></p>
  </div>
  <p class="mt-5 text-[13px] text-muted">
    <a href="/login/" data-t="signup.to_login" class="text-primary font-semibold"></a>
  </p>
</section>
{% endblock %}
{% block script %}
<script>
  const form = document.getElementById("sign-up");
  const failed = document.getElementById("sign-up-error");
  const submit = document.getElementById("sign-up-submit");

  const refusal = (error) => localized(`signup.error.${error.code}`, t("signup.failed"));

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    submit.disabled = true;
    failed.classList.add("hidden");
    const said = await post("/api/auth/signup/", {
      username: document.getElementById("username").value,
      password: document.getElementById("password").value,
      password_confirm: document.getElementById("password-confirm").value,
    });
    submit.disabled = false;
    if (said.ok && said.body.pending) {
      form.classList.add("hidden");
      document.getElementById("sign-up-pending").classList.remove("hidden");
      return;
    }
    const reasons = said.body.errors ? [...new Set(said.body.errors.map(refusal))] : [detail(said)];
    failed.innerHTML = reasons.map((reason) => `<li>${esc(reason)}</li>`).join("");
    failed.classList.remove("hidden");
  });

  document.getElementById("username").focus();
</script>
{% endblock %}
