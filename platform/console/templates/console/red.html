{% extends "console/base.html" %}
{% block title %}FSL{% endblock %}
{% block nav %}<span data-t="common.red_team" class="text-rose-400"></span>{% endblock %}
{% block content %}
<h1 data-t="red.heading.objectives" class="text-2xl font-semibold text-slate-100 mb-2"></h1>

<div class="grid grid-cols-3 gap-3 mb-5">
  <div class="bg-slate-900/60 border border-slate-800 rounded p-3">
    <div data-t="red.kpi.taken" class="text-slate-500 text-xs uppercase tracking-wide"></div>
    <div id="kpi-taken" class="text-2xl font-semibold text-rose-300 tabular-nums">0</div>
  </div>
  <div class="bg-slate-900/60 border border-slate-800 rounded p-3">
    <div data-t="red.kpi.difficulty_total" class="text-slate-500 text-xs uppercase tracking-wide"></div>
    <div id="kpi-stars" class="text-2xl font-semibold text-amber-300 tabular-nums">0</div>
  </div>
  <div class="bg-slate-900/60 border border-slate-800 rounded p-3">
    <div data-t="red.kpi.unsolved" class="text-slate-500 text-xs uppercase tracking-wide"></div>
    <div id="kpi-available" class="text-2xl font-semibold text-slate-300 tabular-nums">-</div>
  </div>
</div>

<div class="flex flex-wrap gap-2 mb-3 items-center">
  <input id="objective-search" data-t-placeholder="red.objectives.search"
    class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm flex-1 min-w-56">
  <select id="objective-category"
    class="bg-slate-900 border border-slate-700 rounded px-2 py-2 text-xs text-slate-300">
    <option value="" data-t="red.objectives.all_categories"></option>
  </select>
  <label class="flex items-center gap-2 text-xs text-slate-400 px-1">
    <input id="hide-solved" type="checkbox" checked class="accent-sky-600">
    <span data-t="red.objectives.hide_solved"></span>
  </label>
</div>

<div id="objectives" class="border border-slate-800 rounded max-h-80 overflow-y-auto mb-10"></div>

<h1 data-t="red.heading.machine" class="text-2xl font-semibold text-slate-100 mb-2"></h1>

<div class="grid grid-cols-3 gap-3 mb-4 text-sm">
  <div class="bg-slate-900/60 border border-slate-800 rounded p-3">
    <div data-t="red.box.target" class="text-slate-500 text-xs uppercase tracking-wide"></div>
    <div id="box-target" class="font-mono text-slate-200 mt-1 truncate">-</div>
    <div data-t="red.box.target.hint" class="text-slate-400 text-xs mt-1"></div>
  </div>
  <div class="bg-slate-900/60 border border-slate-800 rounded p-3">
    <div data-t="red.box.proxied" class="text-slate-500 text-xs uppercase tracking-wide"></div>
    <div id="box-proxied" class="font-mono text-slate-200 mt-1">-</div>
    <div data-t="red.box.proxied.tools" class="text-slate-400 text-xs mt-1"></div>
  </div>
  <div class="bg-slate-900/60 border border-slate-800 rounded p-3">
    <div data-t="red.box.direct" class="text-slate-500 text-xs uppercase tracking-wide"></div>
    <div id="box-direct" class="font-mono text-slate-200 mt-1">-</div>
    <div data-t="red.box.direct.tools" class="text-slate-400 text-xs mt-1"></div>
  </div>
</div>

<div class="border border-slate-800 rounded p-4 mb-4 flex flex-wrap gap-3 items-end">
  <label class="text-sm">
    <span data-t="red.window.name" class="block text-slate-400 text-xs mb-1"></span>
    <input id="window-name" value="manual-attack"
           class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm w-56">
  </label>
  <label class="text-sm">
    <span data-t="red.window.route" class="block text-slate-400 text-xs mb-1"></span>
    <select id="window-route"
      class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm">
      <option value="proxy" data-t="red.window.route.proxy"></option>
      <option value="direct" data-t="red.window.route.direct"></option>
    </select>
  </label>
  <label class="text-sm flex items-center gap-2 pb-2">
    <input id="window-malicious" type="checkbox" checked class="accent-rose-600">
    <span data-t="red.window.malicious" class="text-slate-400"></span>
  </label>
  <button id="window-toggle" data-t="red.window.start"
    class="px-4 py-2 rounded bg-rose-700 hover:bg-rose-600 text-white text-sm"></button>
  <span id="window-status" class="text-slate-500 text-sm pb-2"></span>
</div>

<iframe id="terminal" class="w-full h-[28rem] border border-slate-800 rounded bg-black"></iframe>

<h1 data-t="red.baseline.heading" class="text-2xl font-semibold text-slate-100 mt-12 mb-2"></h1>

<div class="flex gap-3 mb-8 items-end flex-wrap">
  <label class="text-sm">
    <span data-t="red.baseline.origin" class="block text-slate-400 text-xs mb-1"></span>
    <select id="origin"
      class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm">
    </select>
  </label>
  <button id="run-all" data-t="red.baseline.run_all"
    class="px-4 py-2 rounded bg-rose-700 hover:bg-rose-600 text-white text-sm"></button>
  <button id="run-attacks" data-t="red.baseline.run_attacks"
    class="px-4 py-2 rounded bg-slate-700 hover:bg-slate-600 text-sm"></button>
  <a id="to-blue" target="_blank" data-t="red.baseline.open_blue"
    class="px-4 py-2 rounded border border-sky-900 hover:border-sky-600 text-sky-400 text-sm"></a>
</div>

<p id="covers" class="text-xs text-slate-500 mb-6"></p>

<div class="grid grid-cols-2 gap-8">
  <div>
    <h2 data-t="red.cases.attacks" class="text-sm uppercase tracking-wide text-slate-500 mb-3"></h2>
    <div id="attacks" class="space-y-2"></div>
  </div>
  <div>
    <h2 data-t="red.cases.benign" class="text-sm uppercase tracking-wide text-slate-500 mb-3"></h2>
    <div id="benign" class="space-y-2"></div>
  </div>
</div>

<h2 data-t="red.log.heading" class="text-sm uppercase tracking-wide text-slate-500 mt-10 mb-3"></h2>
<div id="log" class="space-y-1 text-sm font-mono"></div>
<p id="log-empty" data-t="red.log.empty" class="text-slate-500 text-sm"></p>
{% endblock %}
{% block script %}
<script>
  document.getElementById("to-blue").href = `/blue/${sessionId()}/`;
  document.title = t("common.red_team");

  let catalogue = [];
  let scenario = null;

  async function showCoverage() {
    const listed = await api("/api/wargames/");
    if (!listed.ok || !Array.isArray(listed.body)) return;
    const wargame = listed.body.find((w) => w.id === scenario);
    if (!wargame) return;

    const named = (stages) => stages.map((s) => t("stage." + s)).join(", ");
    const lines = [t("red.covers", named(wargame.covers))];
    if (wargame.uncovered.length) {
      lines.push(t("red.covers.not", named(wargame.uncovered)));
    }
    document.getElementById("covers").textContent = lines.join(" ");
  }

  function reference(caseDef, field) {
    const id = caseDef[field];
    const href = (caseDef.references || {})[field];
    if (!id) return "";
    if (!href) return `<span class="text-slate-600">${esc(id)}</span>`;
    return `<a href="${esc(href)}" target="_blank" rel="noopener"
      class="text-slate-500 hover:text-slate-300 underline decoration-dotted">${esc(id)}</a>`;
  }

  function labels(caseDef) {
    if (!caseDef.stage) return "";
    return `
      <div class="px-3 pb-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px]">
        <span class="text-slate-400">${esc(t("stage." + caseDef.stage))}</span>
        ${reference(caseDef, "technique")}
        ${reference(caseDef, "pattern")}
      </div>`;
  }

  function button(caseDef) {
    return `
      <div class="border border-slate-800 hover:border-slate-600 rounded">
        <button data-case="${esc(caseDef.name)}"
          class="fire w-full text-left px-3 py-2">
          <div class="text-slate-100 text-sm">${esc(caseDef.name)}</div>
          <div class="text-slate-500 text-xs font-mono mt-1">${esc(caseDef.summary)}</div>
          ${caseDef.takes
            ? `<div data-takes="${esc(caseDef.takes)}" class="text-rose-400 text-xs mt-1">${
              esc(t("red.case.objective", objectiveName(caseDef.takes)))}</div>`
            : ""}
        </button>
        ${labels(caseDef)}
      </div>`;
  }

  function nameObjectivesOnCards() {
    document.querySelectorAll("[data-takes]").forEach((line) => {
      line.textContent = t("red.case.objective", objectiveName(line.dataset.takes));
    });
  }

  const LOG_LINES = 200;

  function note(text, tone) {
    document.getElementById("log-empty").classList.add("hidden");
    const line = document.createElement("div");
    line.className = tone;
    line.textContent = text;
    const log = document.getElementById("log");
    log.prepend(line);
    while (log.children.length > LOG_LINES) log.lastElementChild.remove();
  }

  async function fire(name) {
    const result = await post(`/api/sessions/${sessionId()}/attacks/`,
                              { case: name, origin: chosenOrigin() }, PATIENCE_FOR_RANGE_WORK);
    if (result.ok) {
      note(t("red.log.sent", name), "text-slate-300");
    } else {
      note(t("red.log.fire_failed", name, detail(result)), "text-amber-400");
    }
    await pollObjectives();
    return result.ok;
  }

  const chosenOrigin = () => document.getElementById("origin").value;

  async function loadOrigins() {
    const select = document.getElementById("origin");
    const result = await api("/api/origins/");
    if (!result.ok) {
      select.innerHTML = `<option value="">${esc(t("red.origin.unavailable"))}</option>`;
      select.disabled = true;
      return;
    }
    select.innerHTML =
      `<option value="rotate">${esc(t("red.origin.rotate"))}</option>` +
      result.body.origins.map((origin) =>
        `<option value="${esc(origin.id)}">${esc(origin.label)} (${esc(origin.subnet)})</option>`
      ).join("");
    const preferred = result.body.origins.find((origin) => origin.default);
    if (preferred) select.value = preferred.id;
    select.addEventListener("change", loadTerminal);
  }

  async function fireMany(cases) {
    const buttons = document.querySelectorAll("button:not(:disabled)");
    buttons.forEach((b) => (b.disabled = true));
    for (const caseDef of cases) {
      await fire(caseDef.name);
    }
    buttons.forEach((b) => (b.disabled = false));
  }

  async function render() {
    const session = await api(`/api/sessions/${sessionId()}/`);
    if (!session.ok) {
      const said = session.status === 404
        ? t("red.error.no_session") : t("red.error.session", detail(session));
      document.getElementById("attacks").innerHTML =
        `<p class="text-amber-400 text-sm">${esc(said)}</p>`;
      return;
    }

    scenario = session.body.scenario;
    await loadObjectives();

    const cases = await api(`/api/wargames/${scenario}/cases/`);
    if (!cases.ok || !Array.isArray(cases.body)) {
      document.getElementById("attacks").innerHTML =
        `<p class="text-amber-400 text-sm">${esc(t("red.error.no_catalogue", detail(cases)))}</p>`;
      return;
    }
    catalogue = cases.body;
    await showCoverage();
    document.getElementById("attacks").innerHTML =
      catalogue.filter((c) => c.malicious).map(button).join("");
    document.getElementById("benign").innerHTML =
      catalogue.filter((c) => !c.malicious).map(button).join("");

    document.querySelectorAll(".fire").forEach((element) => {
      element.addEventListener("click", () => fire(element.dataset.case));
    });
  }

  let objectives = [];
  const STAR = (n) => "*".repeat(n);
  const objectiveName = (key) => objectives.find((o) => o.key === key)?.name || key;

  async function loadObjectives() {
    const result = await api(`/api/wargames/${scenario}/objectives/`);
    if (!result.ok) {
      document.getElementById("objectives").innerHTML =
        `<p class="text-amber-400 text-sm p-4">${esc(t("red.error.objectives", detail(result)))}</p>`;
      return;
    }
    objectives = result.body;
    nameObjectivesOnCards();
    document.getElementById("kpi-available").textContent =
      objectives.filter((o) => !o.solved).length;

    const categories = [...new Set(objectives.map((o) => o.category))].sort();
    const select = document.getElementById("objective-category");
    const chosen = select.value;
    select.innerHTML = `<option value="">${esc(t("red.objectives.all_categories"))}</option>` +
      categories.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
    if (categories.includes(chosen)) select.value = chosen;
    renderObjectives();
  }

  function renderObjectives() {
    const needle = document.getElementById("objective-search").value.trim().toLowerCase();
    const category = document.getElementById("objective-category").value;
    const hideSolved = document.getElementById("hide-solved").checked;

    const shown = objectives.filter((o) => {
      if (hideSolved && o.solved) return false;
      if (category && o.category !== category) return false;
      if (!needle) return true;
      return (o.name + o.description).toLowerCase().includes(needle);
    }).sort((a, b) => a.difficulty - b.difficulty);

    document.getElementById("objectives").innerHTML = shown.map((o) => `
      <div class="border-t border-slate-900 px-3 py-2 flex gap-3 items-baseline">
        <span class="text-amber-400 font-mono text-xs w-12">${esc(STAR(o.difficulty))}</span>
        <span class="${o.solved ? "text-slate-500 line-through" : "text-slate-100"} text-sm w-56">
          ${esc(o.name)}</span>
        <span class="text-slate-500 text-xs w-48">${esc(o.category)}</span>
        <span class="text-slate-400 text-xs flex-1 truncate" title="${esc(o.description)}"
          >${esc(o.description)}</span>
      </div>`).join("") ||
      `<p class="text-slate-500 text-sm p-4">${esc(t("red.objectives.none"))}</p>`;
  }

  async function refreshTaken() {
    const result = await api(`/api/sessions/${sessionId()}/objectives/`);
    if (!result.ok) return;
    document.getElementById("kpi-taken").textContent = result.body.length;
    document.getElementById("kpi-stars").textContent =
      result.body.reduce((sum, o) => sum + o.difficulty, 0);
  }

  const CHECK_EVERY = 10000;
  let timer = null;
  let checking = false;
  let recheck = false;
  let closed = false;
  let checkedAt = 0;

  function stopPolling() {
    if (closed) return;
    closed = true;
    clearTimeout(timer);
    note(t("red.log.session_closed"), "text-slate-500");
  }

  async function checkObjectives() {
    const result = await post(`/api/sessions/${sessionId()}/objectives/`);
    if (result.status === 409) {
      stopPolling();
      return;
    }
    if (result.ok && result.body.achieved) {
      note(t("red.log.taken", result.body.achieved), "text-rose-300 font-semibold");
      await loadObjectives();
    }
    await refreshTaken();
  }

  async function pollObjectives() {
    if (checking) {
      recheck = true;
      return;
    }
    checking = true;
    clearTimeout(timer);
    try {
      do {
        recheck = false;
        await checkObjectives();
      } while (recheck && !closed);
    } finally {
      checking = false;
      checkedAt = Date.now();
      schedule();
    }
  }

  function schedule() {
    clearTimeout(timer);
    if (!closed && !checking) timer = setTimeout(pollObjectives, CHECK_EVERY);
  }

  onResume(() => {
    if (!closed && !checking && Date.now() - checkedAt >= CHECK_EVERY) pollObjectives();
  });

  ["objective-search", "objective-category", "hide-solved"].forEach((id) => {
    document.getElementById(id).addEventListener("input", renderObjectives);
  });

  let attacker = null;
  let openedAt = null;
  let windowCaseId = null;
  let recordedFrom = null;

  const status = (text, tone) => {
    const element = document.getElementById("window-status");
    element.textContent = text;
    element.className = `text-sm pb-2 ${tone || "text-slate-500"}`;
  };

  const windowAddress = () =>
    document.getElementById("window-route").value === "direct"
      ? attacker.direct_ip
      : attacker.source_ip;

  let confirmedOrigin = null;
  let describedOrigin = null;
  let moving = false;
  let moveAgain = false;

  async function loadTerminal() {
    if (moving) {
      moveAgain = true;
      return;
    }
    moving = true;
    const toggle = document.getElementById("window-toggle");
    toggle.disabled = true;
    try {
      do {
        moveAgain = false;
        await moveTerminal();
      } while (moveAgain);
    } finally {
      moving = false;
      toggle.disabled = describedOrigin === null || describedOrigin !== confirmedOrigin;
    }
  }

  async function moveTerminal() {
    const select = document.getElementById("origin");
    const wanted = select.value;
    const origin = wanted === "rotate" ? "" : wanted;
    const moved = await post("/api/attacker/origin/", { origin });
    if (!moved.ok) {
      status(t("red.window.status.origin_failed", detail(moved)), "text-amber-400");
      if (confirmedOrigin !== null) select.value = confirmedOrigin;
      return;
    }
    confirmedOrigin = wanted;
    const result = await api(`/api/attacker/?origin=${encodeURIComponent(origin)}`);
    if (!result.ok) {
      status(t("red.window.status.unavailable", detail(result)), "text-amber-400");
      return;
    }
    attacker = result.body;
    describedOrigin = wanted;
    if (!document.getElementById("terminal").src) {
      document.getElementById("terminal").src = attacker.terminal_url;
    }
    document.getElementById("box-target").textContent = attacker.public_url;
    document.getElementById("box-proxied").textContent = attacker.source_ip;
    document.getElementById("box-direct").textContent =
      attacker.direct_ip || t("red.box.direct.none");

    const route = document.getElementById("window-route");
    route.querySelector('[value="direct"]').disabled = !attacker.direct_ip;
    if (!attacker.direct_ip) route.value = "proxy";

    status(t("red.window.status.will_record", windowAddress()));
  }

  const unlocked = new Set();

  function lockCase(locked) {
    ["window-name", "window-malicious", "window-route", "origin"].forEach((id) => {
      const control = document.getElementById(id);
      if (locked) {
        if (!control.disabled) unlocked.add(id);
        control.disabled = true;
      } else if (unlocked.has(id)) {
        control.disabled = false;
      }
    });
    if (!locked) unlocked.clear();
  }

  async function toggleWindow() {
    const toggle = document.getElementById("window-toggle");
    const name = document.getElementById("window-name");
    const malicious = document.getElementById("window-malicious");

    if (!openedAt) {
      const from = {
        address: windowAddress(),
        origin: attacker.origin,
        route: document.getElementById("window-route").value,
      };
      lockCase(true);
      windowCaseId = crypto.randomUUID();
      const labelled = await post("/api/attacker/label/", { case_id: windowCaseId });
      if (!labelled.ok) {
        lockCase(false);
        status(t("red.window.status.marker_failed", detail(labelled)), "text-amber-400");
        return;
      }
      recordedFrom = from;
      openedAt = new Date();
      toggle.textContent = t("red.window.stop");
      status(t("red.window.status.recording", from.address), "text-rose-400");
      note(t("red.log.case_started", name.value), "text-slate-500");
      return;
    }

    const cleared = await post("/api/attacker/label/", { case_id: null });
    if (!cleared.ok) {
      status(t("red.window.status.clear_failed", detail(cleared)), "text-amber-400");
      return;
    }
    const result = await post(`/api/sessions/${sessionId()}/cases/`, {
      case_id: windowCaseId,
      name: name.value,
      malicious: malicious.checked,
      correlation: "window",
      source_ip: recordedFrom.address,
      meta: { origin: recordedFrom.origin, route: recordedFrom.route },
      started_at: openedAt.toISOString(),
      ended_at: new Date().toISOString(),
    });

    note(
      result.ok
        ? t("red.log.case_recorded", name.value)
        : t("red.log.case_record_failed", name.value, detail(result)),
      result.ok ? "text-slate-300" : "text-amber-400",
    );
    await pollObjectives();
    openedAt = null;
    recordedFrom = null;
    lockCase(false);
    toggle.textContent = t("red.window.start");
    status(t("red.window.status.will_record", windowAddress()));
  }

  document.getElementById("window-toggle").addEventListener("click", toggleWindow);

  document.getElementById("run-all")
    .addEventListener("click", () => fireMany(catalogue));
  document.getElementById("run-attacks")
    .addEventListener("click", () => fireMany(catalogue.filter((c) => c.malicious)));

  render();
  loadOrigins().then(loadTerminal);
  refreshTaken();
  schedule();
</script>
{% endblock %}
