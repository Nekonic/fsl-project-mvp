<!DOCTYPE html>
<html lang="en" class="bg-slate-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FSL{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 font-sans {% block body_class %}{% endblock %}">
  <header class="border-b border-slate-800">
    <nav class="{% block nav_class %}max-w-5xl mx-auto{% endblock %} px-6 py-3 flex gap-6 text-sm items-center">
      <a href="/" class="font-semibold text-slate-100">FSL</a>
      {% block nav %}{% endblock %}
      <span id="session-label" class="ml-auto text-slate-500"></span>
    </nav>
  </header>
  {% comment %}
  A monitoring console is not a document: it fills the screen and each panel
  scrolls on its own. Pages that are documents keep the default.
  {% endcomment %}
  <main class="{% block main_class %}max-w-5xl mx-auto px-6 py-8{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script>
    // The session lives in the URL, so no page is ever handed data by the
    // server and two windows cannot drift onto different sessions.
    const sessionId = () => location.pathname.split("/")[2];

    async function api(path, options) {
      const response = await fetch(path, options);
      const body = await response.json().catch(() => ({}));
      return { ok: response.ok, status: response.status, body };
    }

    // Everything on these pages is an attack someone just sent. Putting any
    // of it into innerHTML unescaped runs it: a script-tag payload goes out
    // as a case, comes back as a request path, and the console that displays
    // it is where the payload finally lands. A security tool executing the
    // attacks it caught is the worst version of this bug, and it shipped.
    //
    // So: every value interpolated into markup goes through this. Use
    // textContent where there is no markup to build.
    //
    // Nothing here may contain a literal closing script tag, not even inside
    // a comment or a string: the HTML parser ends the element at the first
    // one it sees and the rest stops being JavaScript. That is how this very
    // comment broke the console while describing the bug it fixes.
    const ESCAPES = {
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    };
    const esc = (value) =>
      String(value === null || value === undefined ? "" : value)
        .replace(/[&<>"']/g, (c) => ESCAPES[c]);

    const post = (path, payload) => api(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload || {}),
    });

    if (sessionId()) {
      document.getElementById("session-label").textContent = `session ${sessionId()}`;
    }
  </script>
  {% block script %}{% endblock %}
</body>
</html>
