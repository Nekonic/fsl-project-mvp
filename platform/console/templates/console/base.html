<!DOCTYPE html>
<html lang="en" class="bg-slate-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FSL{% endblock %}</title>
  <style>{% include "console/tailwind.css" %}</style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans {% block body_class %}{% endblock %}">
  <header class="border-b border-slate-800">
    <nav class="{% block nav_class %}max-w-5xl mx-auto{% endblock %} px-6 py-3 flex gap-6 text-sm items-center">
      <a href="/" class="font-semibold text-slate-100">FSL</a>
      {% block nav %}{% endblock %}
      <span id="session-label" class="ml-auto text-slate-500"></span>
      <button id="language" class="text-slate-500 hover:text-slate-200 text-xs"></button>
    </nav>
  </header>
  <main class="{% block main_class %}max-w-5xl mx-auto px-6 py-8{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% include "console/strings.html" %}
  <script>
    const sessionId = () => location.pathname.split("/")[2];

    async function api(path, options) {
      let response;
      try {
        response = await fetch(path, options);
      } catch (error) {
        return { ok: false, status: 0, body: { detail: String(error) } };
      }
      const body = await response.json().catch(() => ({}));
      return { ok: response.ok, status: response.status, body };
    }

    const detail = (result) =>
      result.body.detail || result.status || t("common.no_answer");

    const ESCAPES = {
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    };
    const esc = (value) =>
      String(value === null || value === undefined ? "" : value)
        .replace(/[&<>"']/g, (c) => ESCAPES[c]);

    const post = (path, payload) => api(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload || {}),
    });

    function onResume(catchUp) {
      const back = () => {
        if (document.visibilityState !== "hidden") catchUp();
      };
      document.addEventListener("visibilitychange", back);
      window.addEventListener("online", back);
    }

    if (sessionId()) {
      document.getElementById("session-label").textContent = t("common.session", sessionId());
    }

    document.getElementById("language").textContent = t("common.language");
    document.getElementById("language").addEventListener("click", switchLanguage);
    applyLanguage();
  </script>
  {% block script %}{% endblock %}
</body>
</html>
