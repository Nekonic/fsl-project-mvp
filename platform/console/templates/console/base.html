<!DOCTYPE html>
<html lang="en" class="bg-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FSL{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #F6F7F9;
      --panel: #FFFFFF;
      --subdued: #F8FAFC;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --border-subdued: #F1F5F9;
      --heading: #0F172A;
      --text: #334155;
      --text-muted: #64748B;
      --text-faint: #94A3B8;
      --text-inverse: #FFFFFF;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --primary-text: #1D4ED8;
      --primary-soft: #EFF6FF;
      --primary-line: #DBEAFE;
      --danger: #DC2626;
      --danger-hover: #B91C1C;
      --danger-text: #B91C1C;
      --danger-soft: #FEF2F2;
      --danger-line: #FEE2E2;
      --warning: #B45309;
      --warning-text: #B45309;
      --warning-soft: #FEF3C7;
      --warning-line: #FDE68A;
      --success: #16A34A;
      --success-text: #15803D;
      --success-soft: #F0FDF4;
      --success-line: #DCFCE7;
      --accent: #BC1E70;
      --accent-text: #A11262;
      --accent-soft: #FFF0F8;
      --accent-line: #FFC7DB;
      --teal: #008B87;
      --terminal: #0B1020;
      --terminal-bar: #111827;
      --terminal-line: #1F2937;
      --terminal-text: #D1D5DB;
      --code: #0F172A;
      --code-text: #E2E8F0;
      --code-button: #1E293B;
      --shadow-pop: 0 10px 30px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(15, 23, 42, 0.06);
      --shadow-note: 0 20px 25px -5px rgba(15, 23, 42, 0.12), 0 8px 10px -6px rgba(15, 23, 42, 0.1);
      --shadow-lift: 0 4px 12px rgba(15, 23, 42, 0.08);
      --scrim: 0 0 0 9999px rgba(15, 23, 42, 0.18);
      --font-sans: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
  </style>
  <style>{% include "console/tailwind.css" %}</style>
</head>
<body class="bg-page text-body font-sans text-[14px] {% block body_class %}{% endblock %}">
  <header class="h-14 shrink-0 bg-panel border-b border-line px-4 sm:px-6 flex items-center gap-4 sm:gap-6">
    <a href="/" class="flex items-center gap-2 font-bold text-[15px] text-heading shrink-0">
      <span class="brand-mark">F</span><span data-t="common.brand" class="hidden sm:inline"></span>
    </a>
    <nav id="crumbs" class="flex items-center gap-2 text-muted text-[13px] min-w-0 truncate"></nav>
    <div class="ml-auto flex items-center gap-4 text-[13px] text-muted shrink-0">
      <span id="range-health" class="hidden items-center gap-1.5"></span>
      <button id="language" class="hover:text-heading"></button>
    </div>
  </header>
  <main class="{% block main_class %}max-w-[1120px] mx-auto px-4 sm:px-6 py-8{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% include "console/strings.html" %}
  <script>
    const sessionId = () => location.pathname.split("/")[2];

    const PATIENCE = 90 * 1000;
    const PATIENCE_FOR_RANGE_WORK = 15 * 60 * 1000;
    const OPENING_TAKES = 80;

    async function api(path, options, patience = PATIENCE) {
      const abandon = new AbortController();
      const timer = setTimeout(() => abandon.abort(), patience);
      try {
        const response = await fetch(path, { ...options, signal: abandon.signal });
        const body = await response.json().catch(() => ({}));
        if (!abandon.signal.aborted) return { ok: response.ok, status: response.status, body };
      } catch (error) {
        if (!abandon.signal.aborted) return { ok: false, status: 0, body: { detail: String(error) } };
      } finally {
        clearTimeout(timer);
      }
      return {
        ok: false, status: 0, body: { detail: t("common.no_answer_within", patience / 1000) },
      };
    }

    const detail = (result) =>
      result.body.detail || result.status || t("common.no_answer");

    const ESCAPES = {
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    };
    const esc = (value) =>
      String(value === null || value === undefined ? "" : value)
        .replace(/[&<>"']/g, (c) => ESCAPES[c]);

    const post = (path, payload, patience) => api(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload || {}),
    }, patience);

    function onResume(catchUp) {
      const back = () => {
        if (document.visibilityState !== "hidden") catchUp();
      };
      document.addEventListener("visibilitychange", back);
      window.addEventListener("online", back);
    }

    const localized = (key, fallback) => {
      const value = t(key);
      return value === key ? fallback : value;
    };

    const clock = (instant) => {
      const at = instant ? new Date(instant) : null;
      if (!at || Number.isNaN(at.getTime())) return "";
      return `${String(at.getHours()).padStart(2, "0")}:${String(at.getMinutes()).padStart(2, "0")}`;
    };

    const minutesBetween = (from, to) =>
      Math.max(0, Math.round((new Date(to || Date.now()) - new Date(from)) / 60000));

    const secondsSince = (instant) =>
      Math.max(0, Math.round((Date.now() - new Date(instant)) / 1000));

    const LESSON_STEP_KEY = (id) => `fsl-lesson-step-${id}`;

    function lessonStep(id) {
      try {
        const kept = Number(localStorage.getItem(LESSON_STEP_KEY(id)));
        return Number.isInteger(kept) && kept > 0 ? kept : 1;
      } catch (error) {
        return 1;
      }
    }

    function keepLessonStep(id, step) {
      try {
        localStorage.setItem(LESSON_STEP_KEY(id), String(step));
      } catch (error) {
        return;
      }
    }

    function crumbs(items) {
      const trail = [{ label: t("crumb.home"), href: "/" }, ...items];
      document.getElementById("crumbs").innerHTML = trail.map((item, index) =>
        index === trail.length - 1
          ? `<span class="text-heading font-semibold truncate">${esc(item.label)}</span>`
          : `<a href="${esc(item.href)}" class="hover:text-heading shrink-0">${esc(item.label)}</a>`,
      ).join('<span class="text-faint">/</span>');
    }

    function badge(text, tone, dot) {
      return `<span class="badge badge-${tone}">${dot ? `<span class="dot dot-${tone}"></span>` : ""}${esc(text)}</span>`;
    }

    function caseOutcome(malicious, meta) {
      const said = meta || {};
      if (said.outcome === "leaked") return { text: t("outcome.leaked"), tone: "red" };
      if (said.outcome === "held") return { text: t("outcome.held"), tone: "ok" };
      if (said.outcome === "inconclusive") return { text: t("outcome.inconclusive"), tone: "warn" };
      const status = Number(said.status);
      if (status === 403) return { text: t("outcome.blocked"), tone: malicious ? "ok" : "red" };
      if (status >= 200 && status < 300) return { text: t("outcome.served"), tone: malicious ? "warn" : "ok" };
      if (status) return { text: `HTTP ${status}`, tone: "neutral" };
      return { text: t("outcome.sent"), tone: "neutral" };
    }

    document.getElementById("language").textContent = t("common.language");
    document.getElementById("language").addEventListener("click", switchLanguage);
    applyLanguage();
    if (!sessionId()) crumbs([]);
  </script>
  {% block script %}{% endblock %}
</body>
</html>
