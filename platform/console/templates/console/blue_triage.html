<div id="triage" class="absolute inset-0 flex-col bg-panel" style="display: none">
  <div class="h-10 border-b border-line bg-subdued flex items-center px-3 gap-3 shrink-0 min-w-0 text-[12.5px]">
    <b data-t="triage.heading" class="text-heading shrink-0"></b>
    <span id="triage-count" class="text-muted truncate"></span>
    <button type="button" id="triage-reload" class="ml-auto btn btn-sm btn-ghost shrink-0" data-t="triage.reload"></button>
  </div>
  <p data-t="triage.intro" class="px-4 pt-3 text-[12.5px] text-muted"></p>
  <div id="triage-dock" class="px-4 pt-3 flex flex-col gap-2 shrink-0 overflow-auto" style="max-height: 55%"></div>
  <ol id="triage-list" class="flex-1 min-h-0 overflow-auto px-4 py-3 flex flex-col gap-3 text-[12.5px]"></ol>
</div>
