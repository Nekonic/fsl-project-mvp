      "lesson.board.theory.paranoia.body": "CRS groups its rules into paranoia levels 1 to 4, and only the rules up to the chosen level run. Level 1 is the default. A higher level makes it harder for an attack to go undetected, at the cost of more false positives: genuine requests blocked. This WAF starts at level 4.",

      "lesson.board.theory.scoring.body": "A CRS detection rule does not block by itself: when it matches, it adds to the request's inbound anomaly score (a critical match adds 5). Rule 949110 then blocks the request once the total reaches the threshold, 5 by default. So a 403 record names 949110 and the rule that scored, here 920273.",
      "lesson.board.theory.culprit.title": "Finding a false positive's culprit",
      "lesson.board.theory.culprit.body": "A false positive is a genuine request that a rule matches in error. In ELK, expand the 403 row of the O'Brien search and read the rule field. Skip 949110, which only adds up; the culprit is the rule that scored. Its record also says what it matched: the variable (ARGS:q, the search parameter q) and the value (O'Brien).",
      "lesson.board.theory.fixes.title": "Two fixes: lower the level, or exclude one rule",
      "lesson.board.theory.fixes.body": "Lowering the paranoia level switches off every rule above it, for every parameter on every page: fewer false positives, weaker detection everywhere. A rule exclusion removes one rule for one variable on one path, here 920273 for ARGS:q under /search/, and leaves the rest of the level in force. That narrow exclusion is the recommended fix; the CRS documentation tunes a false positive away by removing a rule for one location only.",
      "lesson.board.theory.anatomy.title": "Reading a rule exclusion",
      "lesson.board.theory.anatomy.body": "SecRule REQUEST_FILENAME \"@beginsWith /search/\" \"id:10001,phase:1,pass,nolog,ctl:ruleRemoveTargetById=920273;ARGS:q\"\nREQUEST_FILENAME is the request path without the query string; @beginsWith /search/ makes the line apply only under that path. id is a unique rule id. phase:1 runs it before the CRS rules inspect the arguments; pass and nolog make the line itself neither block nor log. ctl:ruleRemoveTargetById=920273;ARGS:q tells this one request that rule 920273 no longer inspects ARGS:q. ctl:ruleRemoveById=920273 would remove the whole rule. The file is read before CRS, which a runtime exclusion like this needs.",

      "lesson.theory.show": "위치 보기",
      "lesson.board.theory.paranoia.title": "Paranoia Level(PL): CRS가 얼마나 공격적으로 검사하는가",
      "lesson.board.theory.paranoia.body": "CRS는 룰을 Paranoia Level 1~4로 나누고, 고른 PL까지의 룰만 실행합니다. 기본값은 1입니다. PL을 올리면 공격이 탐지를 피하기 어려워지지만 false positive(정상 요청을 잘못 잡는 것)가 늘어납니다. 이 WAF는 PL 4에서 시작합니다.",
      "lesson.board.theory.scoring.title": "Anomaly Scoring: 403에 룰이 둘 찍히는 이유",
      "lesson.board.theory.scoring.body": "CRS 탐지 룰은 혼자 차단하지 않습니다. 일치하면 요청의 inbound anomaly score에 점수를 더합니다(CRITICAL 룰은 5점). 그다음 rule 949110이 합계가 inbound anomaly score threshold(기본 5)에 닿으면 요청을 차단합니다. 그래서 403 기록에는 949110과 점수를 더한 룰, 여기서는 920273이 함께 나옵니다.",
      "lesson.board.theory.culprit.title": "false positive를 일으킨 룰 찾기",
      "lesson.board.theory.culprit.body": "false positive는 정상 요청을 룰이 잘못 잡은 것입니다. ELK에서 O'Brien 검색의 403 행을 펼쳐 rule 필드를 읽으세요. 합산만 하는 949110은 건너뛰고, 점수를 더한 룰이 원인입니다. 기록에는 무엇에 일치했는지도 있습니다: 변수(ARGS:q, 검색 파라미터 q)와 값(O'Brien).",
      "lesson.board.theory.fixes.title": "두 가지 해결: PL 낮추기, 룰 하나 빼기",
      "lesson.board.theory.fixes.body": "Paranoia Level을 낮추면 그 위의 룰이 모든 페이지의 모든 파라미터에서 꺼집니다. false positive는 줄지만 탐지가 전부 약해집니다. rule exclusion은 한 경로의 한 변수에 대해 룰 하나만 뺍니다(여기서는 /search/ 아래 ARGS:q에 대한 920273). 나머지 룰은 그대로 동작합니다. 권장하는 쪽은 이 좁은 rule exclusion입니다. CRS 문서도 false positive를 해당 위치에서만 룰을 빼는 방식으로 튜닝합니다.",
      "lesson.board.theory.anatomy.title": "rule exclusion 한 줄 읽기",
      "lesson.board.theory.anatomy.body": "SecRule REQUEST_FILENAME \"@beginsWith /search/\" \"id:10001,phase:1,pass,nolog,ctl:ruleRemoveTargetById=920273;ARGS:q\"\nREQUEST_FILENAME은 쿼리 문자열을 뺀 요청 경로이고, @beginsWith /search/ 때문에 이 줄은 그 경로 아래에서만 적용됩니다. id는 겹치지 않는 rule ID입니다. phase:1이라 CRS 룰이 인자를 검사하기 전에 실행되고, pass와 nolog라 이 줄 자체는 차단도 기록도 하지 않습니다. ctl:ruleRemoveTargetById=920273;ARGS:q는 이 요청에 한해 rule 920273이 ARGS:q를 더는 검사하지 않게 합니다. ctl:ruleRemoveById=920273이면 룰 전체를 뺍니다. 이 파일은 CRS보다 먼저 읽히는데, 이런 runtime exclusion은 그래야 동작합니다.",

  const LANGUAGES = ["en", "ko"];

  function chosenLanguage() {
    let stored = null;
    try {
      stored = localStorage.getItem("fsl-language");
    } catch (error) {
      stored = null;
    }
    if (LANGUAGES.includes(stored)) return stored;
    return (navigator.language || "en").startsWith("ko") ? "ko" : "en";
  }

  let language = chosenLanguage();

  function t(key, ...values) {
    const table = STRINGS[language] || STRINGS.en;
    const text = table[key] !== undefined ? table[key] : STRINGS.en[key];
    if (text === undefined) return key;
    return values.reduce(
      (out, value, index) => out.split(`{${index}}`).join(value), text,
    );
  }

  function applyLanguage(root) {
    (root || document).querySelectorAll("[data-t]").forEach((element) => {
      element.textContent = t(element.dataset.t);
    });
    (root || document).querySelectorAll("[data-t-placeholder]").forEach((element) => {
      element.placeholder = t(element.dataset.tPlaceholder);
    });
    (root || document).querySelectorAll("[data-t-title]").forEach((element) => {
      element.title = t(element.dataset.tTitle);
    });
    document.documentElement.lang = language;
  }

  function switchLanguage() {
    const next = LANGUAGES[(LANGUAGES.indexOf(language) + 1) % LANGUAGES.length];
    try {
      localStorage.setItem("fsl-language", next);
    } catch (error) {
      language = next;
    }
    location.reload();
  }
</script>
