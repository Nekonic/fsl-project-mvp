      "lesson.board.summary": "Goal: make the O'Brien search load while sqlmap still concludes ?sort= is not injectable and the other ordinary pages still load.",
      "lesson.theory.show": "Show me where",
      "lesson.board.theory.paranoia.title": "Paranoia level: how aggressive CRS is",
      "lesson.board.theory.paranoia.body": "CRS groups its rules into paranoia levels 1 to 4, and only the rules up to the chosen level run. Level 1 is the default. A higher level makes it harder for an attack to go undetected, at the cost of more false positives: genuine requests blocked. This WAF starts at level 4.",
      "lesson.board.theory.scoring.title": "Anomaly scoring: why a 403 names two rules",
      "lesson.board.theory.scoring.body": "A CRS detection rule does not block by itself: when it matches, it adds to the request's inbound anomaly score (a critical match adds 5). Rule 949110 then blocks the request once the total reaches the threshold, 5 by default. So a 403 record names 949110 and the rule that scored, here 920273.",
      "lesson.board.theory.culprit.title": "Finding a false positive's culprit",
      "lesson.board.theory.culprit.body": "A false positive is a genuine request that a rule matches in error. In Kibana, expand the 403 row of the O'Brien search and read the rule field. Skip 949110, which only adds up; the culprit is the rule that scored. Its record also says what it matched: the variable (ARGS:q, the search parameter q) and the value (O'Brien).",
      "lesson.board.theory.fixes.title": "Two fixes: lower the level, or exclude one rule",
      "lesson.board.theory.fixes.body": "Lowering the paranoia level switches off every rule above it, for every parameter on every page: fewer false positives, weaker detection everywhere. A rule exclusion removes one rule for one variable on one path, here 920273 for ARGS:q under /search/, and leaves the rest of the level in force. That narrow exclusion is the recommended fix; the CRS documentation tunes a false positive away by removing a rule for one location only.",
      "lesson.board.theory.anatomy.title": "Reading a rule exclusion",
      "lesson.board.theory.anatomy.body": "SecRule REQUEST_FILENAME \"@beginsWith /search/\" \"id:10100,phase:1,pass,nolog,ctl:ruleRemoveTargetById=920273;ARGS:q\"\nREQUEST_FILENAME is the request path without the query string; @beginsWith /search/ makes the line apply only under that path. id is a unique rule id; 10100 to 10199 are kept for rules written by hand, apart from the ids the platform's own tuning writes. phase:1 runs it before the CRS rules inspect the arguments; pass and nolog make the line itself neither block nor log. ctl:ruleRemoveTargetById=920273;ARGS:q tells this one request that rule 920273 no longer inspects ARGS:q. ctl:ruleRemoveById=920273 would remove the whole rule. The file is read before CRS, which a runtime exclusion like this needs.",

      "lesson.coach.next": "Next",

      "lesson.board.hint.why_rule.title": "Hint 1 · Why 920273?",
      "lesson.board.hint.why_rule.body": "920273 runs only at Paranoia Level 4 and flags any character outside a very strict set. The apostrophe in O'Brien is outside it. 949110 on the same request only says the total score reached the threshold: it is the result, not the cause.",
      "lesson.board.hint.why_target.title": "Hint 2 · Why only ARGS:q?",

      "lesson.board.hint.why_file.title": "Hint 3 · Why the 900 file?",
      "lesson.board.hint.why_file.body": "A ctl: rule exclusion changes the rules for one request while it is processed, so it has to run before the CRS rules inspect the arguments. REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf is read before them, and phase:1 runs the line before CRS looks at ARGS.",

      "lesson.tour.title": "Console tour",
      "lesson.tour.summary": "Goal: send one request the WAF blocks, find its record in Kibana, and say which rule blocked it.",
      "lesson.tour.blurb.blue": "Learn the console: send a request the WAF blocks, find its record in Kibana and read which rule blocked it.",
      "lesson.tour.read": "Read. The rail on the left has three panes: Website is the board as a customer sees it, Kibana holds the records the WAF and the IDS write, WAF is a terminal on the WAF itself.",
      "lesson.tour.write": "Act. Send a request from the Website pane and watch what the WAF answers.",
      "lesson.tour.replay": "Replay. The Check tab replays any case of the lesson; each one leaves its own records in Kibana.",
      "lesson.tour.verify": "Answer. Each step is checked against the records this session holds, not against a fixed answer.",
      "lesson.tour.theory.panes.title": "The three panes",
      "lesson.tour.theory.panes.body": "Website opens the board through this session's WAF, as a customer would. Kibana shows the records: one row per ModSecurity rule match and one per Suricata alert. WAF opens a shell on the WAF host, where its configuration lives.",
      "lesson.tour.theory.record.title": "A record in Kibana",
      "lesson.tour.theory.record.body": "Discover lists records newest first. Expand a row with the arrow at its left to see every field: rule names the rule, url the request, status what the WAF answered, fsl_source the engine that wrote it (modsecurity for the WAF, suricata for the IDS).",
      "lesson.tour.theory.rule.title": "Why a 403 names two rules",
      "lesson.tour.theory.rule.body": "A CRS detection rule does not block by itself: each match adds to the request's anomaly score. Rule 949110 blocks the request once the total reaches the threshold, so it appears on every block. The rule that objected to the request is the other number.",
      "lesson.tour.hint.why_403.title": "Hint 1 · What is 403?",
      "lesson.tour.hint.why_403.body": "403 Forbidden is the WAF's answer. The board never saw the request.",
      "lesson.tour.hint.why_two.title": "Hint 2 · Two rule numbers?",
      "lesson.tour.hint.why_two.body": "One of them is 949110, which only adds up the score. Type the other one.",
      "lesson.tour.label.search": "Send an attack from the website",
      "lesson.tour.coach.search": "In the address bar, type http://board.com/search/?q=' OR 1=1-- and press Enter.",
      "lesson.tour.nudge.search": "That search text is a classic SQL injection; the WAF should refuse it.",
      "lesson.tour.answer.search": "Type board.com/search/?q=' OR 1=1-- and press Enter. A 403 Forbidden page is what you should see.",
      "lesson.tour.ok.search": "Found the record of the block.",
      "lesson.tour.line.search": "The WAF refused it before the board saw it.",
      "lesson.tour.fail.search": "No blocked request of yours has reached this session yet. Send it from the Website pane; the record takes a few seconds to arrive.",
      "lesson.tour.label.find": "Find it in Kibana",
      "lesson.tour.coach.find": "Press the filter button below to show only that request, then open its row with the expand icon at the left.",
      "lesson.tour.nudge.find": "Use the button in this box to filter, then look for the expand icon at the start of a row.",
      "lesson.tour.answer.find": "Press the filter button, then the expand icon on the first row.",
      "lesson.tour.ok.find": "Row opened.",
      "lesson.tour.line.find": "One row is one record of one request.",
      "lesson.tour.chip.find": "Show only: 1=1 and 403",
      "lesson.tour.label.rule": "Which rule blocked it?",
      "lesson.tour.coach.rule": "In the open row, read the rule field. Type the number of the rule that objected to your request.",
      "lesson.tour.nudge.rule": "Two numbers appear. One of them only adds up the score.",
      "lesson.tour.answer.rule": "The number in the rule field that is not 949110.",
      "lesson.tour.ok.rule": "Correct.",
      "lesson.tour.line.rule": "That rule is the one that saw SQL in your search.",

      "lesson.tour.nudge.engine": "The WAF is ModSecurity; the IDS is Suricata.",

      "lesson.tour.ok.engine": "Correct.",

      "lesson.read.title": "Read the block",
      "lesson.read.summary": "Goal: name the rule that blocked the O'Brien search and the parameter it fired on, from this session's own records.",
      "lesson.read.ticket": "A customer writes: “I searched the board for O'Brien and the page said 403 Forbidden.”",
      "lesson.read.blurb.blue": "Read a WAF block: find which CRS rule refused an ordinary search and which parameter it fired on.",
      "lesson.read.read": "Read. Kibana holds a record of each request the WAF blocked, including the O'Brien search the session replayed when it opened.",
      "lesson.read.write": "Find. Expand the record and read the rule that matched and the variable it matched in.",
      "lesson.read.replay": "Replay. The Check tab replays the O'Brien search when you need a fresh record.",
      "lesson.read.verify": "Answer. Each answer is checked against the records this session holds.",
      "lesson.read.theory.anomaly.title": "949110: the anomaly total",
      "lesson.read.theory.anomaly.body": "CRS runs in anomaly scoring mode: a detection rule that matches adds to the request's inbound anomaly score (a critical match adds 5) and lets the request go on. Rule 949110 then compares the total with the threshold (5 by default) and blocks. So 949110 says only that the total was too high; the rules that added to it say why.",
      "lesson.read.theory.fields.title": "Where the parameter is written",
      "lesson.read.theory.fields.body": "Each rule match in a ModSecurity record carries details. details.data and details.match name the variable the rule matched in, written COLLECTION:name: ARGS:q is the argument named q, the search box. REQUEST_URI would be the whole address, REQUEST_HEADERS a header.",
      "lesson.read.hint.why_total.title": "Hint 1 · Which number is not the cause?",
      "lesson.read.hint.why_total.body": "949110 appears on every block because it adds up the score. The other number on the same record is the rule that objected.",
      "lesson.read.hint.why_variable.title": "Hint 2 · How is a parameter written?",
      "lesson.read.hint.why_variable.body": "ModSecurity writes it as collection:name. The search box's parameter is q, in the ARGS collection.",
      "lesson.read.label.search": "Search as a customer",
      "lesson.read.coach.search": "In the address bar, type http://board.com/search/?q=O'Brien and press Enter.",
      "lesson.read.nudge.search": "The address bar sits above the page, as in any browser.",
      "lesson.read.answer.search": "Type board.com/search/?q=O'Brien and press Enter. A 403 Forbidden page is what you should see.",
      "lesson.read.ok.search": "Found the record of the block.",
      "lesson.read.line.search": "An ordinary customer was blocked: a false positive.",
      "lesson.read.fail.search": "No blocked O'Brien search from the Website pane yet. Search for it there first; the record takes a few seconds to arrive.",
      "lesson.read.label.find": "Find that request in Kibana",
      "lesson.read.coach.find": "Press the filter button below to show only the O'Brien request, then open its row with the expand icon at the left.",
      "lesson.read.nudge.find": "Use the button in this box to filter, then look for the expand icon at the start of a row.",
      "lesson.read.answer.find": "Press the filter button, then the expand icon on the first row.",
      "lesson.read.ok.find": "Row opened.",
      "lesson.read.line.find": "The record lists every rule that matched the request.",
      "lesson.read.chip.find": "Show only: O'Brien and 403",
      "lesson.read.label.rule": "Which rule blocked it?",
      "lesson.read.coach.rule": "In the open row, read the rule field. Type the number of the rule that objected to the search.",
      "lesson.read.nudge.rule": "Two numbers appear. One of them only adds up the score.",
      "lesson.read.answer.rule": "The number in the rule field that is not 949110 (at paranoia level 4 this search draws 920273).",
      "lesson.read.ok.rule": "Correct.",
      "lesson.read.line.rule": "949110 only totals the score; the rule you named is the one that objected.",
      "lesson.read.wrong.rule.949110": "That is the anomaly total: it blocks once the score is high enough. Name the rule that added to the score.",
      "lesson.read.label.target": "Which parameter did it fire on?",
      "lesson.read.coach.target": "In the same row, read transaction.messages.details.data. Type the variable the rule matched in, as ModSecurity writes it.",
      "lesson.read.nudge.target": "It is written COLLECTION:name, and the customer typed into the search box.",
      "lesson.read.answer.target": "ARGS:q: the argument named q, the search box.",
      "lesson.read.ok.target": "Correct.",
      "lesson.read.line.target": "A fix can now name exactly this rule and this parameter.",
      "lesson.read.placeholder.target": "variable, e.g. ARGS:name",
      "lesson.read.label.total": "What does 949110 do?",
      "lesson.read.coach.total": "Pick what rule 949110 does.",
      "lesson.read.nudge.total": "Read its message in the record: Inbound Anomaly Score Exceeded.",
      "lesson.read.answer.total": "It adds up the anomaly score and blocks when the total reaches the threshold.",
      "lesson.read.ok.total": "Correct.",
      "lesson.read.line.total": "So a false positive is never fixed at 949110, but at the rule that added to the score.",
      "lesson.read.option.total.total": "Totals the anomaly score and blocks at the threshold",
      "lesson.read.option.total.sqli": "Detects SQL injection",
      "lesson.read.option.total.charset": "Checks which characters a request may contain",
      "lesson.level.title": "Choose the level",
      "lesson.level.summary": "Goal: find the highest CRS paranoia level at which every ordinary request in this lesson is served and both sqlmap variants are held, with no exclusions.",
      "lesson.level.ticket": "A customer writes: “I searched the board in Korean, for 서울 맛집 추천, and the page said 403 Forbidden.”",
      "lesson.level.blurb.blue": "Choose the WAF's paranoia level: the highest one that serves every ordinary request and still holds sqlmap.",
      "lesson.level.read": "Read. The WAF runs at paranoia level 4. Search in Korean and read in Kibana which rules refuse it.",
      "lesson.level.write": "Tune. Lower the level with the control in the Check tab, one step at a time, and verify after each.",
      "lesson.level.replay": "Replay. The Check tab replays any case of the lesson against the level you set.",
      "lesson.level.verify": "Verify. The check replays both sqlmap variants and every ordinary request. It passes at the highest level where every ordinary request is served and no account hash leaks.",
      "lesson.level.theory.levels.title": "What each paranoia level adds",
      "lesson.level.theory.levels.body": "CRS tags its rules with a paranoia level from 1 to 4, and the WAF runs every rule up to the level it is set to. Level 1 catches common attacks with few false positives. Each level above adds rules that are stricter about what a request may contain: measured on this board, level 3 refuses a Korean search (920272, bytes outside printable ASCII; 942460, repeated non-word characters) and level 4 refuses an apostrophe (920273).",
      "lesson.level.theory.tradeoff.title": "Lower is not free",
      "lesson.level.theory.tradeoff.body": "Every level you drop switches off all the rules of the levels above, on every page and every parameter. An attack those rules would have caught now meets fewer checks. That is why the goal is the highest level that serves every ordinary request, not the lowest.",
      "lesson.level.theory.highest.title": "How to find it",
      "lesson.level.theory.highest.body": "Start at the level the lesson opens with. Lower it one step, verify, read what is still refused. Stop at the first level where every ordinary request is served and both sqlmap variants are still held.",
      "lesson.level.hint.why_korean.title": "Hint 1 · Why is Korean refused?",
      "lesson.level.hint.why_korean.body": "Korean is sent as UTF-8 bytes outside the printable ASCII range. Rules from level 3 treat that as suspicious.",
      "lesson.level.hint.why_highest.title": "Hint 2 · Why not level 1?",
      "lesson.level.hint.why_highest.body": "Level 1 also serves everything, but it runs the fewest rules. The goal is the highest level that still serves every ordinary request.",
      "lesson.level.hint.why_no_exclusion.title": "Hint 3 · Why no exclusion?",
      "lesson.level.hint.why_no_exclusion.body": "An exclusion is the narrower fix, and the WAF tuning lesson teaches it. This lesson is about the level itself, so the check refuses a WAF that holds exclusions.",
      "lesson.level.label.search": "Search in Korean",
      "lesson.level.coach.search": "In the address bar, type http://board.com/search/?q=서울 맛집 추천 and press Enter.",
      "lesson.level.nudge.search": "The search is the one in the customer's ticket on the Goal tab.",
      "lesson.level.answer.search": "Type board.com/search/?q=서울 맛집 추천 and press Enter. A 403 Forbidden page is what you should see.",
      "lesson.level.ok.search": "Found the record of the block.",
      "lesson.level.line.search": "An ordinary Korean search is refused at level 4.",
      "lesson.level.fail.search": "No blocked Korean search from the Website pane yet. Search for it there first; the record takes a few seconds to arrive.",
      "lesson.level.label.find": "Find it in Kibana",
      "lesson.level.coach.find": "Press the filter button below to show the blocked searches, then open the newest row with the expand icon at the left.",
      "lesson.level.nudge.find": "Use the button in this box to filter, then look for the expand icon at the start of a row.",
      "lesson.level.answer.find": "Press the filter button, then the expand icon on the first row.",

      "lesson.ids.title": "Write an IDS signature",
      "lesson.ids.summary": "Goal: write a Suricata rule that alerts on both sqlmap ?sort= variants and not on the ordinary ?sort=-created_at.",
      "lesson.ids.blurb.blue": "Write a Suricata signature that alerts on sqlmap at ?sort=, tamper variant included, and stays quiet on the ordinary sort.",
      "lesson.ids.read": "Read. The sensor here runs the baseline rules without the shipped URI SQL injection rule (sid 9000001), so nothing alerts on sqlmap at ?sort=. Kibana shows the requests the WAF refused, payloads included.",
      "lesson.ids.write": "Write. In the Check tab, add a rule to the sensor's file, validate it and apply it.",
      "lesson.ids.replay": "Replay. Each step sends one case and waits for the sensor's alert.",
      "lesson.ids.verify": "Verify. The check sends every case of the lesson. It passes when each sqlmap variant draws an alert whose message mentions SQL and the ordinary requests draw none. Suricata only detects: this is a detection result and marks no objective.",
      "lesson.ids.theory.signature.title": "Anatomy of a Suricata rule",
      "lesson.ids.theory.signature.body": "alert http $EXTERNAL_NET any -> $HOME_NET any (msg:\"...\"; flow:established,to_server; http.uri; pcre:\"/.../i\"; sid:9000101; rev:1;)\nThe header says which traffic to look at; the options in brackets say what to match. msg is what the alert says, sid is the rule's own number (one not yet in the file), rev its revision.",
      "lesson.ids.theory.buffers.title": "Sticky buffers: where a rule looks",
      "lesson.ids.theory.buffers.body": "A keyword such as http.uri sets the buffer the following content or pcre is matched against. http.uri is the normalised path and query, with percent-escapes decoded; http.uri.raw is the URI as sent; http.request_body is the body. A rule that looks in the wrong buffer never sees the attack.",
      "lesson.ids.theory.allow.title": "Match what the value must not be",
      "lesson.ids.theory.allow.body": "The shipped rule matched a quote. One measured tamper run sent payloads with no quote, such as posts_post.id`=`posts_post.id`/**/ANd/**/8074=7435, and 18 of its requests passed the quote rule unseen. A sort value is a column name: letters, digits, _ and ., with an optional leading -. A rule that alerts on anything else after sort= catches every variant and stays quiet on -created_at.",
      "lesson.ids.theory.corroborate.title": "Why msg must name the attack",
      "lesson.ids.theory.corroborate.body": "A case counts as detected only when one of its alerts mentions what the attack is: for these cases, SQL. An alert that fires for another reason is reported as an alert without the attack's name, because it does not show that the defence recognised the attack.",
      "lesson.ids.theory.detect_only.title": "Detection, not blocking",
      "lesson.ids.theory.detect_only.body": "Suricata here reads a copy of the traffic and writes alerts; it stops no request. The WAF, at paranoia level 1, still refuses most sqlmap requests, and the sensor sees them on their way in. This lesson is judged on alerts alone: it reports in the detection score and never on the objectives.",
      "lesson.ids.hint.why_quote.title": "Hint 1 · Why not match a quote?",
      "lesson.ids.hint.why_quote.body": "Stock sqlmap sends quotes, so a quote rule fires on it. The tamper variant can inject without any quote, so a quote rule misses part of it.",
      "lesson.ids.hint.why_tamper.title": "Hint 2 · What does tamper change?",
      "lesson.ids.hint.why_tamper.body": "space2comment turns spaces into /**/, between rewrites > as NOT BETWEEN, randomcase mixes letter case. Match something every variant needs, not one spelling.",
      "lesson.ids.hint.why_msg.title": "Hint 3 · What should msg say?",
      "lesson.ids.hint.why_msg.body": "Put SQL in it, for example \"FSL SQLi attempt - sort is not a column name\". The check reads the alert's message.",
      "lesson.ids.label.payloads": "Look at what sqlmap sends",
      "lesson.ids.coach.payloads": "Press the filter button below to show the sqlmap requests the WAF refused at ?sort=, then open one row and read its url.",
      "lesson.ids.nudge.payloads": "Use the button in this box to filter, then look for the expand icon at the start of a row.",
      "lesson.ids.answer.payloads": "Press the filter button, then the expand icon on the first row.",
      "lesson.ids.ok.payloads": "Row opened.",
      "lesson.ids.line.payloads": "Every payload puts something other than a column name after sort=.",

      "lesson.ids.coach.write": "In the Check tab, add one rule to the sensor's file, press Validate, then Apply.",
      "lesson.ids.nudge.write": "Start from the anatomy card in Theory, and use a sid that is not in the file yet.",
      "lesson.ids.answer.write": "Add this line, then Validate and Apply: alert http $EXTERNAL_NET any -> $HOME_NET any (msg:\"FSL SQLi attempt - sort is not a column name\"; flow:established,to_server; http.uri; pcre:\"/[?&]sort=[-\\w.]*[^-\\w.&]/i\"; classtype:web-application-attack; sid:9000101; rev:1;)",
      "lesson.ids.ok.write": "The sensor loaded a new rule.",

      "lesson.xss.theory.body.body": "http.uri holds the path and query only. A POST carries its data in the request body, which a rule reads after http.request_body. The board's comment request sends JSON: {\"body\": \"...\"}.",

      "lesson.board.summary": "목표: sqlmap이 여전히 ?sort=를 주입할 수 없다고 판정하고 다른 일반 페이지도 계속 열리는 가운데 O'Brien 검색이 열리게 하기.",
      "lesson.theory.show": "위치 보기",
      "lesson.board.theory.paranoia.title": "Paranoia Level(PL): CRS가 얼마나 공격적으로 검사하는가",
      "lesson.board.theory.paranoia.body": "CRS는 규칙을 Paranoia Level 1~4로 나누고, 고른 PL까지의 규칙만 실행합니다. 기본값은 1입니다. PL을 올리면 공격이 탐지를 피하기 어려워지지만 오탐(false positive, 정상 요청을 잘못 잡는 것)이 늘어납니다. 이 WAF는 PL 4에서 시작합니다.",
      "lesson.board.theory.scoring.title": "Anomaly Scoring: 403에 규칙이 둘 찍히는 이유",
      "lesson.board.theory.scoring.body": "CRS 탐지 규칙은 혼자 차단하지 않습니다. 일치하면 요청의 inbound anomaly score에 점수를 더합니다(CRITICAL 규칙은 5점). 그다음 rule 949110이 합계가 inbound anomaly score threshold(기본 5)에 닿으면 요청을 차단합니다. 그래서 403 기록에는 949110과 점수를 더한 규칙, 여기서는 920273이 함께 나옵니다.",
      "lesson.board.theory.culprit.title": "오탐(false positive)을 일으킨 규칙 찾기",
      "lesson.board.theory.culprit.body": "오탐(false positive)은 정상 요청을 규칙이 잘못 잡은 것입니다. Kibana에서 O'Brien 검색의 403 행을 펼쳐 rule 필드를 읽으세요. 합산만 하는 949110은 건너뛰고, 점수를 더한 규칙이 원인입니다. 기록에는 무엇에 일치했는지도 있습니다: 변수(ARGS:q, 검색 파라미터 q)와 값(O'Brien).",
      "lesson.board.theory.fixes.title": "두 가지 해결: PL 낮추기, 규칙 하나 빼기",
      "lesson.board.theory.fixes.body": "Paranoia Level을 낮추면 그 위의 규칙이 모든 페이지의 모든 파라미터에서 꺼집니다. 오탐(false positive)은 줄지만 탐지가 전부 약해집니다. rule exclusion(규칙 제외)은 한 경로의 한 변수에 대해 규칙 하나만 뺍니다(여기서는 /search/ 아래 ARGS:q에 대한 920273). 나머지 규칙은 그대로 동작합니다. 권장하는 쪽은 이 좁은 rule exclusion입니다. CRS 문서도 오탐을 해당 위치에서만 규칙을 빼는 방식으로 튜닝합니다.",
      "lesson.board.theory.anatomy.title": "rule exclusion(규칙 제외) 한 줄 읽기",
      "lesson.board.theory.anatomy.body": "SecRule REQUEST_FILENAME \"@beginsWith /search/\" \"id:10100,phase:1,pass,nolog,ctl:ruleRemoveTargetById=920273;ARGS:q\"\nREQUEST_FILENAME은 쿼리 문자열을 뺀 요청 경로이고, @beginsWith /search/ 때문에 이 줄은 그 경로 아래에서만 적용됩니다. id는 겹치지 않는 rule ID이며, 10100~10199는 손으로 쓰는 규칙용으로 플랫폼의 튜닝이 쓰는 ID와 겹치지 않습니다. phase:1이라 CRS 규칙이 인자를 검사하기 전에 실행되고, pass와 nolog라 이 줄 자체는 차단도 기록도 하지 않습니다. ctl:ruleRemoveTargetById=920273;ARGS:q는 이 요청에 한해 rule 920273이 ARGS:q를 더는 검사하지 않게 합니다. ctl:ruleRemoveById=920273이면 규칙 전체를 뺍니다. 이 파일은 CRS보다 먼저 읽히는데, 이런 runtime exclusion은 그래야 동작합니다.",
      "lesson.note.collapse": "접기 ▴",
      "lesson.coach.back": "이전",
      "lesson.coach.next": "다음",
      "lesson.coach.missing": "지금 화면에서 강조할 위치를 찾지 못했습니다. 위 설명을 따라 직접 찾아보세요. Kibana가 아직 로딩 중이거나 스크롤되어 있을 수 있습니다.",
      "lesson.board.read": "읽기. Kibana를 열고 이 세션이 시작할 때 재생한 요청을 찾으세요. ModSecurity 기록마다 일치한 CRS 규칙과 요청이 받은 403이 적혀 있습니다. 일반 사용자가 보내는 O'Brien 검색을 어떤 규칙이 차단했는지 확인하세요.",
      "lesson.board.write": "튜닝. WAF 창에서 REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf에 rule exclusion(규칙 제외)을 추가하고(또는 SecAction 줄의 Paranoia Level을 낮추고), 예외 추가 단계 명령의 마지막 줄로 확인하고 적용하세요. nginx -t 뒤에 이 WAF의 reload를 실행합니다(필요한 곳에서는 sudo 포함).",
      "lesson.board.replay": "재생. 튜닝한 WAF에 케이스를 실행하고 Kibana에서 기록을 다시 읽으세요.",
      "lesson.board.verify": "검증. 모든 sqlmap 변형과 모든 정상 케이스를 다시 실행합니다. 어떤 변형도 게시판 계정과 일치하는 비밀번호 해시를 덤프하지 못하고, 모든 정상 요청이 응답을 받을 때만 통과합니다.",

      "lesson.level.ticket": "고객 문의: “게시판에서 한국어로 서울 맛집 추천을 검색했더니 403 Forbidden이 떴어요.”",
      "lesson.level.blurb.blue": "WAF의 Paranoia Level을 고릅니다. 정상 요청을 모두 통과시키면서 sqlmap은 계속 막는 가장 높은 레벨입니다.",
      "lesson.level.read": "읽기. WAF는 Paranoia Level 4로 동작합니다. 한국어로 검색하고 어느 규칙이 거부하는지 Kibana에서 읽으세요.",
      "lesson.level.write": "조정. 확인 탭의 레벨 조절로 한 단계씩 낮추고, 낮출 때마다 검증하세요.",

      "lesson.level.theory.levels.title": "레벨마다 더해지는 것",
      "lesson.level.theory.levels.body": "CRS는 규칙마다 1부터 4까지 Paranoia Level을 붙이고, WAF는 설정한 레벨까지의 규칙을 모두 실행합니다. 레벨 1은 흔한 공격을 오탐 적게 잡습니다. 그 위 레벨은 요청에 들어갈 수 있는 것을 더 엄격하게 보는 규칙을 더합니다. 이 게시판에서 측정해 보니 레벨 3은 한국어 검색을 거부하고(920272 출력 가능한 ASCII 밖의 바이트, 942460 반복되는 비단어 문자) 레벨 4는 아포스트로피 하나로도 거부합니다(920273).",
      "lesson.level.theory.tradeoff.title": "낮추는 데도 대가가 있다",
      "lesson.level.theory.tradeoff.body": "레벨을 하나 낮출 때마다 그 위 레벨의 규칙이 모든 페이지, 모든 파라미터에서 꺼집니다. 그 규칙들이 잡았을 공격은 이제 검사를 덜 받습니다. 그래서 목표는 가장 낮은 레벨이 아니라 정상 요청을 모두 통과시키는 가장 높은 레벨입니다.",
      "lesson.level.theory.highest.title": "찾는 방법",
      "lesson.level.theory.highest.body": "레슨을 시작한 레벨에서 출발해 한 단계 낮추고, 검증하고, 아직 거부되는 것을 읽으세요. 정상 요청이 모두 통과하고 sqlmap 두 변형이 여전히 막히는 첫 레벨에서 멈추세요.",

      "lesson.ids.title": "IDS 시그니처 쓰기",
      "lesson.ids.summary": "목표: sqlmap ?sort= 두 변형에는 경보를 내고 정상 ?sort=-created_at에는 내지 않는 Suricata 규칙 쓰기.",
      "lesson.ids.blurb.blue": "?sort=를 노리는 sqlmap에 tamper 변형까지 경보를 내고, 정상 정렬에는 조용한 Suricata 시그니처를 씁니다.",
      "lesson.ids.read": "읽기. 여기 센서는 기본 규칙에서 URI SQL 인젝션 규칙(sid 9000001)을 뺀 규칙으로 동작하므로, ?sort=의 sqlmap에 아무 경보도 나지 않습니다. Kibana에는 WAF가 거부한 요청이 페이로드째 보입니다.",
      "lesson.ids.write": "쓰기. 확인 탭에서 센서 파일에 규칙을 더하고, 검사한 뒤 적용하세요.",
      "lesson.ids.replay": "다시 보내기. 각 단계는 케이스 하나를 보내고 센서의 경보를 기다립니다.",
      "lesson.ids.verify": "검증. 레슨의 케이스를 모두 보냅니다. sqlmap 변형마다 메시지에 SQL이 들어간 경보가 나고 정상 요청에는 경보가 없으면 통과합니다. Suricata는 탐지만 하므로 이 결과는 탐지 결과이고 목표에는 표시하지 않습니다.",
      "lesson.ids.theory.signature.title": "Suricata 규칙의 구조",
      "lesson.ids.theory.signature.body": "alert http $EXTERNAL_NET any -> $HOME_NET any (msg:\"...\"; flow:established,to_server; http.uri; pcre:\"/.../i\"; sid:9000101; rev:1;)\n헤더는 어떤 트래픽을 볼지, 괄호 안 옵션은 무엇과 맞출지를 말합니다. msg는 경보에 나오는 말, sid는 규칙 고유 번호(파일에 아직 없는 번호), rev는 개정 번호입니다.",
      "lesson.ids.theory.buffers.title": "sticky buffer: 규칙이 보는 곳",
      "lesson.ids.theory.buffers.body": "http.uri 같은 키워드는 뒤따르는 content나 pcre를 맞출 버퍼를 정합니다. http.uri는 퍼센트 인코딩을 푼 정규화된 경로와 쿼리, http.uri.raw는 보낸 그대로의 URI, http.request_body는 본문입니다. 엉뚱한 버퍼를 보는 규칙은 공격을 보지 못합니다.",
      "lesson.ids.theory.allow.title": "값이 아니어야 할 것을 맞추기",
      "lesson.ids.theory.allow.body": "기본 규칙은 따옴표를 맞췄습니다. 측정한 tamper 실행 하나는 posts_post.id`=`posts_post.id`/**/ANd/**/8074=7435처럼 따옴표 없는 페이로드를 보냈고, 그중 18개 요청이 따옴표 규칙을 그냥 지나갔습니다. sort 값은 열 이름입니다. 글자, 숫자, _, .이고 앞에 -가 붙을 수 있습니다. sort= 뒤에 그 밖의 것이 오면 경보를 내는 규칙은 모든 변형을 잡고 -created_at에는 조용합니다.",
      "lesson.ids.theory.corroborate.title": "msg에 공격 이름이 있어야 하는 이유",
      "lesson.ids.theory.corroborate.body": "경보 중 하나가 공격이 무엇인지(이 케이스들에서는 SQL)를 말할 때만 탐지로 셉니다. 다른 이유로 난 경보는 공격 이름 없는 경보로 보고합니다. 방어가 그 공격을 알아봤다는 근거가 되지 않기 때문입니다.",
      "lesson.ids.theory.detect_only.title": "차단이 아니라 탐지",
      "lesson.ids.theory.detect_only.body": "여기서 Suricata는 트래픽의 사본을 읽고 경보를 쓸 뿐, 요청을 멈추지 않습니다. Paranoia Level 1의 WAF가 sqlmap 요청 대부분을 여전히 거부하고, 센서는 들어오는 길에 그 요청을 봅니다. 이 레슨은 경보만으로 판정하며, 탐지 점수로만 보고하고 목표에는 반영하지 않습니다.",
      "lesson.ids.hint.why_quote.title": "힌트 1 · 따옴표를 맞추면 왜 안 되나",
      "lesson.ids.hint.why_quote.body": "기본 sqlmap은 따옴표를 보내므로 따옴표 규칙에 걸립니다. tamper 변형은 따옴표 없이도 주입할 수 있어서 따옴표 규칙이 일부를 놓칩니다.",
      "lesson.ids.hint.why_tamper.title": "힌트 2 · tamper는 무엇을 바꾸나",
      "lesson.ids.hint.why_tamper.body": "space2comment는 공백을 /**/로, between은 >를 NOT BETWEEN으로 바꾸고, randomcase는 대소문자를 섞습니다. 철자 하나가 아니라 모든 변형에 꼭 필요한 것을 맞추세요.",
      "lesson.ids.hint.why_msg.title": "힌트 3 · msg에는 무엇을 쓰나",
      "lesson.ids.hint.why_msg.body": "SQL을 넣으세요. 예: \"FSL SQLi attempt - sort is not a column name\". 확인은 경보의 메시지를 읽습니다.",
      "lesson.ids.label.payloads": "sqlmap이 보내는 것 보기",
      "lesson.ids.coach.payloads": "아래 필터 버튼을 눌러 WAF가 거부한 ?sort= sqlmap 요청만 보이게 한 뒤, 한 행을 펼쳐 url을 읽으세요.",
      "lesson.ids.nudge.payloads": "이 상자의 버튼으로 거른 뒤, 행 맨 앞의 expand 아이콘을 찾으세요.",
      "lesson.ids.answer.payloads": "필터 버튼을 누르고 첫 행의 expand 아이콘을 누르세요.",
      "lesson.ids.ok.payloads": "행을 펼쳤습니다.",
      "lesson.ids.line.payloads": "페이로드마다 sort= 뒤에 열 이름이 아닌 것이 옵니다.",
      "lesson.ids.chip.payloads": "?sort=의 sqlmap만 보기",
      "lesson.ids.label.write": "규칙 쓰기",
      "lesson.ids.coach.write": "확인 탭에서 센서 파일에 규칙 하나를 더하고 검사를 누른 뒤 적용을 누르세요.",
      "lesson.ids.nudge.write": "이론의 구조 카드에서 시작하고, 파일에 아직 없는 sid를 쓰세요.",
      "lesson.ids.answer.write": "이 줄을 더하고 검사, 적용을 누르세요: alert http $EXTERNAL_NET any -> $HOME_NET any (msg:\"FSL SQLi attempt - sort is not a column name\"; flow:established,to_server; http.uri; pcre:\"/[?&]sort=[-\\w.]*[^-\\w.&]/i\"; classtype:web-application-attack; sid:9000101; rev:1;)",

  const LANGUAGES = ["en", "ko"];

  function chosenLanguage() {
    let stored = null;
    try {
      stored = localStorage.getItem("fsl-language");
    } catch (error) {
      stored = null;
    }
    if (LANGUAGES.includes(stored)) return stored;
    return (navigator.language || "en").startsWith("ko") ? "ko" : "en";
  }

  let language = chosenLanguage();

  function t(key, ...values) {
    const table = STRINGS[language] || STRINGS.en;
    const text = table[key] !== undefined ? table[key] : STRINGS.en[key];
    if (text === undefined) return key;
    return values.reduce(
      (out, value, index) => out.split(`{${index}}`).join(value), text,
    );
  }

  function applyLanguage(root) {
    (root || document).querySelectorAll("[data-t]").forEach((element) => {
      element.textContent = t(element.dataset.t);
    });
    (root || document).querySelectorAll("[data-t-placeholder]").forEach((element) => {
      element.placeholder = t(element.dataset.tPlaceholder);
    });
    (root || document).querySelectorAll("[data-t-title]").forEach((element) => {
      element.title = t(element.dataset.tTitle);
    });
    document.documentElement.lang = language;
  }

  function switchLanguage() {
    const next = LANGUAGES[(LANGUAGES.indexOf(language) + 1) % LANGUAGES.length];
    try {
      localStorage.setItem("fsl-language", next);
    } catch (error) {
      language = next;
    }
    location.reload();
  }
