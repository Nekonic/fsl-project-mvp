# Difficulty steps of Player vs AI rounds (DECISIONS 2026-11-24).
# Pace and allowance are held by the launcher's relay, never by the server.
# min_gap_s, budget_usd and max_turns are not ruled and not measured; tune them after rounds are played.
stand_in:
  attack: "2"
  defence: "2"
steps:
  - id: "1"
    attack:
      model: claude-haiku-5-5
      budget_usd: 2
      max_turns: 200
      pace: {per_window: 4, window_s: 300, min_gap_s: 45}
      allowance:
        cases: ["*"]
        operations: [attack_state, attack_cases, attack_fire_case, attack_tool_output, attack_stop_tool,
                     attack_next_origin, attack_send, attack_loot, attack_forfeit]
    defence:
      model: claude-haiku-5-5
      budget_usd: 2
      max_turns: 200
      pace: {per_window: 4, window_s: 300, min_gap_s: 45}
      allowance:
        operations: [defence_state, defence_alerts, defence_traffic, defence_probes, defence_waf, defence_waf_versions,
                     defence_waf_version, defence_waf_check, defence_waf_test, defence_waf_test_result,
                     defence_waf_apply, defence_forfeit]
  - id: "2"
    attack:
      model: claude-sonnet-5-5
      budget_usd: 4
      max_turns: 300
      pace: {per_window: 10, window_s: 300, min_gap_s: 15}
      allowance:
        cases: ["*"]
        operations: [attack_state, attack_cases, attack_fire_case, attack_tool_output, attack_stop_tool,
                     attack_next_origin, attack_send, attack_loot, attack_forfeit, attack_tools, attack_start_tool]
    defence:
      model: claude-sonnet-5-5
      budget_usd: 4
      max_turns: 300
      pace: {per_window: 10, window_s: 300, min_gap_s: 15}
      allowance:
        operations: [defence_state, defence_alerts, defence_traffic, defence_probes, defence_waf, defence_waf_versions,
                     defence_waf_version, defence_waf_check, defence_waf_test, defence_waf_test_result,
                     defence_waf_apply, defence_forfeit, defence_ids_rules, defence_ids_versions, defence_ids_version,
                     defence_ids_test, defence_ids_test_result, defence_ids_terminal]
  - id: "3"
    attack:
      model: claude-opus-5-5
      budget_usd: 8
      max_turns: 400
      pace: {per_window: 30, window_s: 300, min_gap_s: 3}
      allowance:
        cases: ["*"]
        operations: [attack_state, attack_cases, attack_fire_case, attack_tool_output, attack_stop_tool,
                     attack_next_origin, attack_send, attack_loot, attack_forfeit, attack_tools, attack_start_tool,
                     attack_terminal]
    defence:
      model: claude-opus-5-5
      budget_usd: 8
      max_turns: 400
      pace: {per_window: 30, window_s: 300, min_gap_s: 3}
      allowance:
        operations: [defence_state, defence_alerts, defence_traffic, defence_probes, defence_waf, defence_waf_versions,
                     defence_waf_version, defence_waf_check, defence_waf_test, defence_waf_test_result,
                     defence_waf_apply, defence_forfeit, defence_ids_rules, defence_ids_versions, defence_ids_version,
                     defence_ids_test, defence_ids_test_result, defence_ids_terminal, defence_terminal]
