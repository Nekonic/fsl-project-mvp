    edge: fsl-pfsense
    sensor: fsl-pfsense
    proxy: fsl-kali
  watches:
    sensor: edge
  hosts:
    fsl-pfsense:
      segments: [internet, estate, mgmt]
      image: fsl-pfsense-edge
      ssh_user: admin
    fsl-kali:
      segments: [internet, mgmt]
      setup: deploy/kali/setup.sh
      files: [deploy/kali, deploy/proxy/stamp.py]
      base: kali-rolling
    fsl-waf:
      segments: [estate, mgmt]
      names: [shop.com, board.com]
